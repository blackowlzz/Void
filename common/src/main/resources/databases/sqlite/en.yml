# SQLite backend. Single-server only; use MySQL or Postgres for multi-server setups.
sqlite:
  # Database file path, relative to the plugin data folder if not absolute.
  path: "data/history.v1.db"

  # Keep WAL enabled; it allows reads and writes to run at the same time.
  journal-mode: WAL

  # NORMAL is fine for most setups. FULL adds durability at a write cost. OFF is unsafe.
  synchronous-mode: NORMAL

  # How long to wait on a locked database before giving up (ms).
  busy-timeout-ms: 5000

  # Page cache size. 10000 pages is about 40 MB.
  cache-pages: 10000

  # Max events per batch commit. Higher values improve throughput at the cost of latency.
  batch-flush-cap: 256

# Schema markers: see header comment in config.yml.
config-flavor: V2
config-version: 1
