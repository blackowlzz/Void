# Redis backend. Not recommended for history; enable AOF persistence on the server if you use it.
redis:
  host: "localhost"
  port: 6379

  # Logical database index (0-15).
  database: 0

  # ACL credentials. Leave empty for no-auth Redis.
  user: ""
  password: ""

  # Prefix added to every key Void writes. Useful when sharing a Redis instance with other apps.
  key-prefix: ""

  timeout-ms: 2000
  batch-flush-cap: 256

  # Log a warning on startup when violation/session history is routed here. Disable once confirmed.
  warn-on-history: true

  # Key namespace overrides.
  tables:
    meta: void_meta
    checks: void_checks
    players: void_players
    sessions: void_sessions
    violations: void_violations
    settings: void_settings

# Schema markers: see header comment in config.yml.
config-flavor: V2
config-version: 1
