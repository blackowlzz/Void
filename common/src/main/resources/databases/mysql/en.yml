# MySQL backend. Supports multi-server setups sharing one database.
mysql:
  host: "localhost"
  port: 3306
  database: "void"
  user: "root"
  password: ""

  # Extra JDBC URL params appended to the defaults. Leave empty unless you need something specific.
  extra-jdbc-params: ""

  # Max events per batch commit. Higher values improve throughput at the cost of latency.
  batch-flush-cap: 256

  # Table name overrides. Useful when sharing one MySQL database across multiple Void instances.
  tables:
    meta: void_meta
    checks: void_checks
    players: void_players
    sessions: void_sessions
    violations: void_violations
    settings: void_settings

# Schema markers: see header comment in config.yml.
config-flavor: V2
config-version: 1
