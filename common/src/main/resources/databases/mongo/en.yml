# MongoDB backend.
mongo:
  # Standard MongoDB connection string (mongodb://user:pass@host:port/?authSource=admin).
  connection-string: "mongodb://localhost:27017"

  database: "void"

  # Max operations per bulkWrite() call.
  batch-flush-cap: 256

  # Collection name overrides.
  tables:
    meta: void_meta
    checks: void_checks
    players: void_players
    sessions: void_sessions
    violations: void_violations
    settings: void_settings

# Schema markers: see header comment in config.yml.
config-flavor: V2
config-version: 1
