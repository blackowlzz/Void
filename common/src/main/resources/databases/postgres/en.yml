# Postgres backend. Supports multi-server setups sharing one database.
postgres:
  host: "localhost"
  port: 5432
  database: "void"
  user: "postgres"
  password: ""

  # Extra JDBC URL params. Leave empty unless you need something specific.
  extra-jdbc-params: ""

  batch-flush-cap: 256

  # Table name overrides. Useful when sharing one Postgres database across multiple Void instances.
  tables:
    meta: void_meta
    checks: void_checks
    players: void_players
    sessions: void_sessions
    violations: void_violations
    settings: void_settings

# Schema markers: see header comment in config.yml.
config-flavor: V2
config-version: 1
