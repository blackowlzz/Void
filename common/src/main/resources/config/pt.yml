# Geral

alerts:
    # Enviar alertas de violação também ao console além do staff online.
    print-to-console: true
    proxy:
        # Encaminhar alertas para outros servidores no proxy (BungeeCord/Velocity).
        send: false
        receive: false

verbose:
    print-to-console: false

experimental-checks: false

# Jogadores que se conectam através de um proxy com ViaVersion instalado podem
# causar problemas de tradução de pacotes que geram falsos positivos.
# allow: defina como true para permitir o acesso em vez de expulsá-los.
# disable-setbacks: mantém os alertas ativos mas desabilita os setbacks para estes
#   jogadores, evitando perturbações para jogadores legítimos.
via-proxy:
    allow: false
    disable-setbacks: true

# Atenuação do offset de predição entre versões.
#
# Quando o ViaVersion está ativo: instalado neste servidor ou em um proxy:
# clientes com uma versão Minecraft diferente usam fórmulas físicas ligeiramente
# diferentes. O ViaVersion traduz pacotes fielmente mas não pode compensar essas
# diferenças numéricas, causando pequenos offsets sistemáticos (~0.001-0.003 blocos/tick)
# mesmo em jogadores completamente legítimos.
#
# Com viaversion-attenuation ativado, o Void subtrai 0.005 do offset bruto de predição
# para jogadores cuja versão difere do servidor. Speed hacks e fly hacks produzem
# offsets de 0.01-1.0+ (pelo menos 2× a tolerância), a detecção não é afetada.
#
# Desative apenas se seu servidor usa uma única versão sem jogadores cross-version
# e deseja o limiar de detecção mais restrito possível.
viaversion-attenuation: false

# Atenuacao especifica para elytra para jogadores cross-version.
#
# A fisica do elytra (planar) diverge mais entre versoes do Minecraft do que o movimento
# normal - resistencia aerodinamica, escala de direcao do olhar e acumulacao de velocidade
# por tick diferem entre versoes. Com ViaVersion ativo, um jogador legitimo planando com
# elytra pode produzir offsets brutos ate ~0.032 blocos/tick, muito acima dos ~0.001-0.003
# no movimento normal.
#
# Quando ativado, Void aplica uma atenuacao extra de 0.03 (alem de viaversion-attenuation)
# para jogadores cross-version enquanto planeiam ou logo apos pousar. Exploits reais de
# elytra produzem offsets de 0.1+ (3x a tolerancia extra), a detecao permanece intacta.
#
# Ative se ver falsos positivos de Simulation em jogadores cross-version usando elytra.
# Nao tem efeito se viaversion-attenuation nao estiver ativado.
viaversion-elytra-attenuation: false

client-brand:
    # Lista regex de clientes cujo brand é ignorado silenciosamente.
    ignored-clients:
        - "^vanilla$"
        - "^fabric$"
        - "^quilt$"
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4},(?:fabric|forge)$"
        - "^Feather Fabric$"
        - "^labymod$"
    # Desconectar clientes Forge 1.18.2-1.19.3 que incluem reach hacks integrados.
    disconnect-blacklisted-forge-versions: true

spectators:
    # Ocultar espectadores com permissão void.spectator mesmo sem espectarem ativamente.
    hide-regardless: false
    # Restringir ocultamento a mundos específicos. Vazio = todos.
    allowed-worlds:
        - ""

# Segundos antes de expulsar um jogador que para de responder.
max-transaction-time: 60

# Chave API Pastebin para /void debug. Vazio para salvar logs localmente.
pastebin-api-key: ""

# Checks

Simulation:
    setback-decay-multiplier: 0.999
    threshold: 0.001
    immediate-setback-threshold: 0.1
    max-advantage: 1
    max-ceiling: 4
    setback-violation-threshold: 1

Knockback:
    setback-decay-multiplier: 0.999
    threshold: 0.001
    immediate-setback-threshold: 0.1
    max-advantage: 1
    max-ceiling: 4

Explosion:
    threshold: 0.001
    setbackvl: 3

Phase:
    setbackvl: 1
    decay: 0.005

NoSlow:
    threshold: 0.001
    setbackvl: 5
    decay: 0.05

Reach:
    threshold: 0.0005
    block-impossible-hits: true
    enable-post-packet: false

AutoClickerA:
    # Hard CPS cap. No human technique sustains above 30 CPS long-term.
    # Raise only if you host drag-click tournaments; do not lower below 25.
    max-cps: 30
    # Minimum CPS before interval regularity analysis kicks in.
    analysis-cps: 8
    # Minimum interval Coefficient of Variation. Autoclickers: 0.00-0.02. Humans: 0.08+.
    # Keep this low. Clicks only ever land on tick boundaries, so an honest player
    # already looks flatter than they really are, and raising it bans them.
    min-cv: 0.05

AutoClickerB:
    # Minimum mean CPS across 1-second buckets before analysis runs.
    analysis-cps: 8
    # Minimum bucket-CV (std_dev/mean of per-second CPS). Randomized autoclickers: 0.04-0.08.
    # Human butterfly/jitter even at peak CPS: typically 0.15+.
    # 0.10 is the safe middle ground: catches bots, cannot false flag legitimate players.
    min-bucket-cv: 0.10

AutoClickerC:
    # Vanilla clients send at most 1 attack per tick. Keep at 1.
    max-attacks-per-tick: 1
    # Consecutive ticks with too many attacks before flagging.
    # 3 absorbs rare ViaVersion packet reordering without missing real violations.
    min-consecutive-ticks: 3

TimerA:
    setbackvl: 10
    drift: 120

TimerLimit:
    ping-abuse-limit-threshold: 1000

NegativeTimer:
    drift: 1200

VehicleTimer:
    setbackvl: 10

AirLiquidPlace:
    cancelvl: 0

FabricatedPlace:
    cancelvl: 5

FarPlace:
    cancelvl: 5

PositionPlace:
    cancelvl: 5

RotationPlace:
    cancelvl: 5

PacketOrderI:
    # Ativar se jogadores com mods de animação 1.7 forem marcados incorretamente.
    exempt-placing-while-digging: false

exploit:
    allow-sprint-jumping-when-using-elytra: true
    allow-building-on-ghostblocks: true
    distance-to-check-if-ghostblocks: 2

    auto-totem:
        autopunish:
            enabled: false
            action: ban
            duration: "1d"
            reason: |
                &cAutoTotem detectado.
                &7Check: &f%check_name% &8(&dVL %vl%&8)
            # Se true, o comando abaixo é executado pelo console em vez do ban interno.
            prefer-custom-ban: false
            # Modelo de comando. Marcadores: {player}  {duration}  {reason}
            # LiteBans:    "litebans:tempban {player} {duration} {reason}"
            # AdvancedBan: "ban {player} {reason} -t {duration}"
            # EssentialsX: "ban {player} {reason}"
            custom-ban-command: "litebans:tempban {player} {duration} {reason}"

# Punições

punishments:

    auto-punish:
        enabled: false
        # Violacoes que UM UNICO check deve atingir antes do Void agir (nao a soma de todos).
        # Usado para qualquer check sem substituicao na seccao thresholds abaixo.
        threshold: 100
        # Substituicoes por check, por nome do check.
        # Os checks nao sinalizam ao mesmo ritmo, por isso nao podem partilhar um unico limite.
        # O Simulation em particular acumula violacoes em jogadores totalmente legitimos
        # (lag, casos limite, ticks perdidos). Banir apos alguns flags de Simulation
        # removera jogadores legitimos. Aumente se vir bans falsos; nunca reduza.
        thresholds:
            Simulation: 200
            GroundSpoof: 150
            NoFall: 150
            Timer: 100
            Knockback: 80
            Explosion: 80
            NoSlow: 80
            Post: 80
            Reach: 25
            Hitboxes: 25
        action: ban
        duration: "7d"
        reason: |
            &5VoidAC
            &cConta Suspensa
            &7Ban ID: &d%ban_id%
            &7Duração: &f%duration%
        support-link: ""
        broadcast-message: "&8[&5Void&8] &f%player% &cfoi banido &7por jogo desonesto."
        # Se true, o comando abaixo é executado pelo console em vez do ban interno.
        prefer-custom-ban: false
        # Modelo de comando. Marcadores: {player}  {duration}  {reason}
        # LiteBans:    "litebans:tempban {player} {duration} {reason}"
        # AdvancedBan: "ban {player} {reason} -t {duration}"
        # EssentialsX: "ban {player} {reason}"
        custom-ban-command: "litebans:tempban {player} {duration} {reason}"

    manual-punish:
        duration: "7d"
        reason: |
            &5VoidAC
            &cConta Suspensa
            &7Banido por: &f{issued_by}
            &7Ban ID: &d{ban_id}
            &7Duração: &f{duration}
        prefer-custom-ban: false
        custom-ban-command: "litebans:tempban {player} {duration} {reason}"

# Ban Wave
# /void banwave add <player> [duration] : adicionar à fila
# /void banwave execute                 : banir todos agora

ban-wave:
    enabled: true
    queue-on-auto-punish: false
    auto-execute-days: 7
    duration: "7d"
    reason: |
        &5VoidAC
        &cConta Suspensa
        &7Ban Wave: &d#{wave}
        &7Ban ID: &d{ban_id}
        &7Duração: &f{duration}
    broadcast: "&8[&5Void&8] &7Ban Wave &d#{wave} &7executada: &d{count} &7jogadores removidos."
    prefer-custom-ban: false
    # Modelo de comando. Marcadores: {player}  {duration}  {reason}
    # LiteBans:    "litebans:tempban {player} {duration} {reason}"
    # AdvancedBan: "ban {player} {reason} -t {duration}"
    custom-ban-command: "litebans:tempban {player} {duration} {reason}"

# Storage ESP Decoys

storage-esp-decoys:
    enabled: false
    decoys-per-chunk: 20
    include-client-side-blocks: false
    auto-flag-threshold: 16

