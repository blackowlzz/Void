# Genel

alerts:
    # İhlal uyarılarını çevrimiçi personele ek olarak konsola da gönder.
    print-to-console: true
    proxy:
        # Uyarıları proxy'deki diğer sunuculara ilet (BungeeCord/Velocity).
        send: false
        receive: false

verbose:
    print-to-console: false

experimental-checks: false

# ViaVersion kurulu bir proxy üzerinden bağlanan oyuncular, yanlış bayrak
# tetikleyebilecek paket çeviri sorunlarına neden olabilir.
# allow: kicklemek yerine giriş izni vermek için true yapın.
# disable-setbacks: alertleri aktif tutar ancak bu oyuncular için setbackleri devre dışı bırakır.
via-proxy:
    allow: false
    disable-setbacks: true

# Sürümler arası tahmin ofseti zayıflatma.
#
# ViaVersion etkin olduğunda: bu sunucuya veya bir proxy'e kurulduğunda: farklı
# Minecraft sürümündeki istemciler biraz farklı fizik formülleri kullanır.
# ViaVersion paketleri doğru çevirir ancak bu sayısal farkları telafi edemez; bu durum
# tamamen meşru oyuncularda bile küçük sistematik ofsetlere (~0.001-0.003 blok/tick) yol açar.
#
# viaversion-attenuation etkinken Void, farklı sürümdeki oyuncuların ham tahmin
# ofsetinden 0.005 çıkarır. Speed hack ve fly hack yazılımları 0.01-1.0+ ofset üretir
# (toleransın en az 2 katı), bu nedenle tespit etkilenmez.
#
# Yalnızca tek sürüm kullanan ve cross-version oyuncu barındırmayan sunucularda
# devre dışı bırakın.
viaversion-attenuation: false

# Cross-version oyuncular icin elytra'ya ozgu tahmin ofseti azaltmasi.
#
# Elytra (suzulme) fizigi, Minecraft surumleri arasinda normal hareketten daha belirgin
# sekilde farklilasiyor - aerodinamik surukleme, bakis yonu olceklendirmesi ve tik basina
# hiz birikimi surumler arasinda farklidir. ViaVersion aktifken, elytra ile suzulen mesru
# bir oyuncu ~0.032 blok/tike kadar ham ofsetler uretebilir; bu, normal hareketteki
# ~0.001-0.003 in cok uzerindedir.
#
# Etkinlestirildiginde, Void suzulme sirasinda veya inis sonrasinda cross-version oyunculara
# 0.03 ek azaltma uygular (viaversion-attenuation'a ek olarak). Gercek elytra aciklari
# 0.1+ ofseti uretir (ek toleransin 3x'i), tespit tamamen aktif kalir.
#
# Cross-version oyuncularda elytra kullanirken Simulation yanlis alarmlari goruyorsaniz
# etkinlestirin. viaversion-attenuation etkin degilse etkisi yoktur.
viaversion-elytra-attenuation: false

client-brand:
    # Sessizce yok sayılacak istemci marka regex listesi.
    ignored-clients:
        - "^vanilla$"
        - "^fabric$"
        - "^quilt$"
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4},(?:fabric|forge)$"
        - "^Feather Fabric$"
        - "^labymod$"
    # Yerleşik reach hack içeren Forge 1.18.2-1.19.3 istemcilerini kes.
    disconnect-blacklisted-forge-versions: true

spectators:
    # void.spectator iznine sahip izleyicileri her zaman gizle.
    hide-regardless: false
    # İzleyicileri yalnızca bu dünyalarda gizle. Boş = tüm dünyalar.
    allowed-worlds:
        - ""

# Yanıt vermeyi bırakan oyuncuyu atmadan önce beklenecek saniye.
max-transaction-time: 60

# /void debug yüklemeleri için Pastebin API anahtarı. Boş = yerel kayıt.
pastebin-api-key: ""

# Kontroller

Simulation:
    setback-decay-multiplier: 0.999
    threshold: 0.001
    immediate-setback-threshold: 0.1
    max-advantage: 1
    max-ceiling: 4
    setback-violation-threshold: 1

Knockback:
    setback-decay-multiplier: 0.999
    threshold: 0.001
    immediate-setback-threshold: 0.1
    max-advantage: 1
    max-ceiling: 4

Explosion:
    threshold: 0.001
    setbackvl: 3

Phase:
    setbackvl: 1
    decay: 0.005

NoSlow:
    threshold: 0.001
    setbackvl: 5
    decay: 0.05

Reach:
    threshold: 0.0005
    block-impossible-hits: true
    enable-post-packet: false

AutoClickerA:
    # Hard CPS cap. No human technique sustains above 30 CPS long-term.
    # Raise only if you host drag-click tournaments; do not lower below 25.
    max-cps: 30
    # Minimum CPS before interval regularity analysis kicks in.
    analysis-cps: 8
    # Minimum interval Coefficient of Variation. Autoclickers: 0.00-0.02. Humans: 0.08+.
    # Keep this low. Clicks only ever land on tick boundaries, so an honest player
    # already looks flatter than they really are, and raising it bans them.
    min-cv: 0.05

AutoClickerB:
    # Minimum mean CPS across 1-second buckets before analysis runs.
    analysis-cps: 8
    # Minimum bucket-CV (std_dev/mean of per-second CPS). Randomized autoclickers: 0.04-0.08.
    # Human butterfly/jitter even at peak CPS: typically 0.15+.
    # 0.10 is the safe middle ground: catches bots, cannot false flag legitimate players.
    min-bucket-cv: 0.10

AutoClickerC:
    # Vanilla clients send at most 1 attack per tick. Keep at 1.
    max-attacks-per-tick: 1
    # Consecutive ticks with too many attacks before flagging.
    # 3 absorbs rare ViaVersion packet reordering without missing real violations.
    min-consecutive-ticks: 3

TimerA:
    setbackvl: 10
    drift: 120

TimerLimit:
    ping-abuse-limit-threshold: 1000

NegativeTimer:
    drift: 1200

VehicleTimer:
    setbackvl: 10

AirLiquidPlace:
    cancelvl: 0

FabricatedPlace:
    cancelvl: 5

FarPlace:
    cancelvl: 5

PositionPlace:
    cancelvl: 5

RotationPlace:
    cancelvl: 5

PacketOrderI:
    # 1.7 animasyon modu kullanan oyuncular yanlış işaretleniyorsa etkinleştir.
    exempt-placing-while-digging: false

exploit:
    allow-sprint-jumping-when-using-elytra: true
    allow-building-on-ghostblocks: true
    distance-to-check-if-ghostblocks: 2

    auto-totem:
        autopunish:
            enabled: false
            action: ban
            duration: "1d"
            reason: |
                &cAutoTotem tespit edildi.
                &7Check: &f%check_name% &8(&dVL %vl%&8)
            # True ise, aşağıdaki komut dahili ban yerine konsol aracılığıyla çalıştırılır.
            prefer-custom-ban: false
            # Komut şablonu. Yer tutucular: {player}  {duration}  {reason}
            # LiteBans:    "litebans:tempban {player} {duration} {reason}"
            # AdvancedBan: "ban {player} {reason} -t {duration}"
            # EssentialsX: "ban {player} {reason}"
            custom-ban-command: "litebans:tempban {player} {duration} {reason}"

# Cezalar

punishments:

    auto-punish:
        enabled: false
        # Void harekete gecmeden once TEK BIR kontrolun ulasmasi gereken ihlal sayisi (tum kontrollerin toplami degil).
        # Asagidaki thresholds bolumunde gecersiz kilinmayan her kontrol icin kullanilir.
        threshold: 100
        # Kontrol adina gore, kontrol basina gecersiz kilmalar.
        # Kontroller ayni siklikta isaretlemez, bu yuzden tek bir esigi paylasamazlar.
        # Ozellikle Simulation, tamamen durust oyuncularda da ihlal biriktirir
        # (lag, sinir durumlar, atlanan tickler). Birkac Simulation flagi sonrasi ban
        # durust oyunculari siler. Yanlis banlarda degeri artirin; asla dusurmeyin.
        thresholds:
            Simulation: 200
            GroundSpoof: 150
            NoFall: 150
            Timer: 100
            Knockback: 80
            Explosion: 80
            NoSlow: 80
            Post: 80
            Reach: 25
            Hitboxes: 25
        action: ban
        duration: "7d"
        reason: |
            &5VoidAC
            &cHesap Askıya Alındı
            &7Ban ID: &d%ban_id%
            &7Süre: &f%duration%
        support-link: ""
        broadcast-message: "&8[&5Void&8] &f%player% &cdürüst olmayan oyun &7nedeniyle yasaklandı."
        # True ise, aşağıdaki komut dahili ban yerine konsol aracılığıyla çalıştırılır.
        prefer-custom-ban: false
        # Komut şablonu. Yer tutucular: {player}  {duration}  {reason}
        # LiteBans:    "litebans:tempban {player} {duration} {reason}"
        # AdvancedBan: "ban {player} {reason} -t {duration}"
        # EssentialsX: "ban {player} {reason}"
        custom-ban-command: "litebans:tempban {player} {duration} {reason}"

    manual-punish:
        duration: "7d"
        reason: |
            &5VoidAC
            &cHesap Askıya Alındı
            &7Yasaklayan: &f{issued_by}
            &7Ban ID: &d{ban_id}
            &7Süre: &f{duration}
        prefer-custom-ban: false
        custom-ban-command: "litebans:tempban {player} {duration} {reason}"

# Ban Dalgası
# /void banwave add <player> [duration] : kuyruğa ekle
# /void banwave execute                 : herkesi şimdi yasakla

ban-wave:
    enabled: true
    queue-on-auto-punish: false
    auto-execute-days: 7
    duration: "7d"
    reason: |
        &5VoidAC
        &cHesap Askıya Alındı
        &7Ban Dalgası: &d#{wave}
        &7Ban ID: &d{ban_id}
        &7Süre: &f{duration}
    broadcast: "&8[&5Void&8] &7Ban Dalgası &d#{wave} &7gerçekleştirildi: &d{count} &7oyuncu kaldırıldı."
    prefer-custom-ban: false
    # Komut şablonu. Yer tutucular: {player}  {duration}  {reason}
    # LiteBans:    "litebans:tempban {player} {duration} {reason}"
    # AdvancedBan: "ban {player} {reason} -t {duration}"
    custom-ban-command: "litebans:tempban {player} {duration} {reason}"

# Storage ESP Decoys

storage-esp-decoys:
    enabled: false
    decoys-per-chunk: 20
    include-client-side-blocks: false
    auto-flag-threshold: 16

