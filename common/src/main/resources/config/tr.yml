# ─── Genel ───────────────────────────────────────────────────────────────────

alerts:
    # İhlal uyarılarını çevrimiçi personele ek olarak konsola da gönder.
    print-to-console: true
    proxy:
        # Uyarıları proxy'deki diğer sunuculara ilet (BungeeCord/Velocity).
        send: false
        receive: false

verbose:
    print-to-console: false

check-for-updates: true
experimental-checks: false

client-brand:
    # Sessizce yok sayılacak istemci marka regex listesi.
    ignored-clients:
        - "^vanilla$"
        - "^fabric$"
        - "^quilt$"
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4},(?:fabric|forge)$"
        - "^Feather Fabric$"
        - "^labymod$"
    # Yerleşik reach hack içeren Forge 1.18.2–1.19.3 istemcilerini kes.
    disconnect-blacklisted-forge-versions: true

spectators:
    # void.spectator iznine sahip izleyicileri her zaman gizle.
    hide-regardless: false
    # İzleyicileri yalnızca bu dünyalarda gizle. Boş = tüm dünyalar.
    allowed-worlds:
        - ""

# Yanıt vermeyi bırakan oyuncuyu atmadan önce beklenecek saniye.
max-transaction-time: 60

# /void debug yüklemeleri için Pastebin API anahtarı. Boş = yerel kayıt.
pastebin-api-key: ""

# ─── Kontroller ──────────────────────────────────────────────────────────────

Simulation:
    setback-decay-multiplier: 0.999
    threshold: 0.001
    immediate-setback-threshold: 0.1
    max-advantage: 1
    max-ceiling: 4
    setback-violation-threshold: 1

Knockback:
    setback-decay-multiplier: 0.999
    threshold: 0.001
    immediate-setback-threshold: 0.1
    max-advantage: 1
    max-ceiling: 4

Explosion:
    threshold: 0.001
    setbackvl: 3

Phase:
    setbackvl: 1
    decay: 0.005

NoSlow:
    threshold: 0.001
    setbackvl: 5
    decay: 0.05

Reach:
    threshold: 0.0005
    block-impossible-hits: true
    enable-post-packet: false

TimerA:
    setbackvl: 10
    drift: 120

TimerLimit:
    ping-abuse-limit-threshold: 1000

NegativeTimer:
    drift: 1200

VehicleTimer:
    setbackvl: 10

AirLiquidPlace:
    cancelvl: 0

FabricatedPlace:
    cancelvl: 5

FarPlace:
    cancelvl: 5

PositionPlace:
    cancelvl: 5

RotationPlace:
    cancelvl: 5

PacketOrderI:
    # 1.7 animasyon modu kullanan oyuncular yanlış işaretleniyorsa etkinleştir.
    exempt-placing-while-digging: false

exploit:
    allow-sprint-jumping-when-using-elytra: true
    allow-building-on-ghostblocks: true
    distance-to-check-if-ghostblocks: 2

    auto-totem:
        autopunish:
            enabled: false
            action: ban
            duration: "1d"
            reason: |
                &cAutoTotem tespit edildi.
                &7Check: &f%check_name% &8(&dVL %vl%&8)
            # True ise, aşağıdaki komut dahili ban yerine konsol aracılığıyla çalıştırılır.
            prefer-custom-ban: false
            # Komut şablonu. Yer tutucular: {player}  {duration}  {reason}
            # LiteBans:    "litebans:tempban {player} {duration} {reason}"
            # AdvancedBan: "ban {player} {reason} -t {duration}"
            # EssentialsX: "ban {player} {reason}"
            custom-ban-command: "litebans:tempban {player} {duration} {reason}"

# ─── Cezalar ─────────────────────────────────────────────────────────────────

punishments:

    auto-punish:
        enabled: false
        threshold: 10
        action: ban
        duration: "7d"
        reason: |
            &5VoidAC
            &cHesap Askıya Alındı
            &7Ban ID: &d%ban_id%
            &7Süre: &f%duration%
        support-link: ""
        broadcast-message: "&8[&5Void&8] &f%player% &cdürüst olmayan oyun &7nedeniyle yasaklandı."
        # True ise, aşağıdaki komut dahili ban yerine konsol aracılığıyla çalıştırılır.
        prefer-custom-ban: false
        # Komut şablonu. Yer tutucular: {player}  {duration}  {reason}
        # LiteBans:    "litebans:tempban {player} {duration} {reason}"
        # AdvancedBan: "ban {player} {reason} -t {duration}"
        # EssentialsX: "ban {player} {reason}"
        custom-ban-command: "litebans:tempban {player} {duration} {reason}"

    manual-punish:
        duration: "7d"
        reason: |
            &5VoidAC
            &cHesap Askıya Alındı
            &7Yasaklayan: &f{issued_by}
            &7Ban ID: &d{ban_id}
            &7Süre: &f{duration}
        prefer-custom-ban: false
        custom-ban-command: "litebans:tempban {player} {duration} {reason}"

# ─── Ban Dalgası ─────────────────────────────────────────────────────────────
# /void banwave add <player> [duration]  — kuyruğa ekle
# /void banwave execute                  — herkesi şimdi yasakla

ban-wave:
    enabled: true
    queue-on-auto-punish: false
    auto-execute-days: 7
    duration: "7d"
    reason: |
        &5VoidAC
        &cHesap Askıya Alındı
        &7Ban Dalgası: &d#{wave}
        &7Ban ID: &d{ban_id}
        &7Süre: &f{duration}
    broadcast: "&8[&5Void&8] &7Ban Dalgası &d#{wave} &7gerçekleştirildi — &d{count} &7oyuncu kaldırıldı."
    prefer-custom-ban: false
    # Komut şablonu. Yer tutucular: {player}  {duration}  {reason}
    # LiteBans:    "litebans:tempban {player} {duration} {reason}"
    # AdvancedBan: "ban {player} {reason} -t {duration}"
    custom-ban-command: "litebans:tempban {player} {duration} {reason}"

# ─── Storage ESP Decoys ───────────────────────────────────────────────────────

storage-esp-decoys:
    enabled: false
    decoys-per-chunk: 20
    include-client-side-blocks: false
    auto-flag-threshold: 16

# ─── Anti-Xray ───────────────────────────────────────────────────────────────

AntiXray:
    configure-paper: false
    engine-mode: 2
    max-block-height: 320
    update-radius: 16
    hidden-blocks:
        - air
        - copper_ore
        - deepslate_copper_ore
        - raw_copper_block
        - iron_ore
        - deepslate_iron_ore
        - gold_ore
        - deepslate_gold_ore
        - diamond_ore
        - deepslate_diamond_ore
        - emerald_ore
        - deepslate_emerald_ore
        - lapis_ore
        - deepslate_lapis_ore
        - redstone_ore
        - deepslate_redstone_ore
        - coal_ore
        - deepslate_coal_ore
        - nether_quartz_ore
        - nether_gold_ore
        - ancient_debris
        - chest
        - trapped_chest
        - barrel
        - ender_chest
        - shulker_box
        - white_shulker_box
        - orange_shulker_box
        - magenta_shulker_box
        - light_blue_shulker_box
        - yellow_shulker_box
        - lime_shulker_box
        - pink_shulker_box
        - gray_shulker_box
        - light_gray_shulker_box
        - cyan_shulker_box
        - purple_shulker_box
        - blue_shulker_box
        - brown_shulker_box
        - green_shulker_box
        - red_shulker_box
        - black_shulker_box
    replacement-blocks:
        - stone
        - deepslate
        - granite
        - diorite
        - andesite
        - dirt
        - gravel
        - tuff
        - calcite
        - smooth_basalt
        - coal_ore
        - deepslate_coal_ore

# ─── Eşik Optimizörü ─────────────────────────────────────────────────────────

threshold-optimizer:
    enabled: false

# ─── Gelişmiş ────────────────────────────────────────────────────────────────

packet-spam-threshold: 100
debug-packet-cancel: false

max-ping-out-of-flying: 1000
max-ping-firework-boost: 1000

disable-pong-cancelling: false
disable-default-resync-handler: false

cancel-duplicate-packet: true
ignore-duplicate-packet-rotation: false

reset-item-usage-on-item-update: true
reset-item-usage-on-attack: true
reset-item-usage-on-slot-change: true
reset-item-usage-on-item-use: true

debug-pipeline-on-join: false

config-flavor: V2
config-version: 19
