# Generale

alerts:
    # Invia gli avvisi di violazione anche alla console oltre che allo staff online.
    print-to-console: true
    proxy:
        # Invia gli avvisi agli altri server del proxy (BungeeCord/Velocity).
        # Richiede bungee-plugin-message-channel abilitato in Velocity se usato.
        send: false
        receive: false

verbose:
    print-to-console: false

experimental-checks: false

# Dedicated killaura detection (AimGcd, AimSnapReturn, AutoClickerD). Off by default, independent of experimental-checks.
# These checks are new and only tested against a few clients: they can false flag. Their flags are alert-only and never reach punishments.yml or auto-punish.
# Enable it on servers whose owners accept that risk. See docs/killaura-experimental.md.
killaura-dedicated-experimental-checks: false

# Mostra i messaggi di Void in maiuscoletto (ѕᴛɪʟᴇ ᴠᴏɪᴅ). Richiede un font del client con questi glifi: se i giocatori vedono dei riquadri al posto delle lettere, lascia disattivato.
# Pensato solo per l'inglese: le lingue con accenti o alfabeti non latini (italiano, russo, cinese, ...) mostrano testo misto o senza stile, e lo staff con void.alerts riceve un avviso in gioco 5 secondi dopo il join.
small-caps: false

# Giocatori che si connettono tramite un proxy con ViaVersion installato possono
# causare problemi di traduzione dei pacchetti e falsi positivi.
# allow: imposta a true per permettere l'accesso invece di espellerli.
# disable-setbacks: mantiene gli alert attivi ma disabilita i setback per evitare
#   di disturbare i giocatori legittimi colpiti da falsi positivi.
via-proxy:
    allow: false
    disable-setbacks: true

viaproxy-warn-on-join: true

# Attenuazione dell'offset di predizione cross-version.
#
# Quando ViaVersion è attivo: installato su questo server o su un proxy: i client
# su una versione Minecraft diversa usano formule fisiche leggermente differenti.
# ViaVersion traduce i pacchetti fedelmente ma non può compensare queste differenze
# numeriche, causando piccoli offset sistematici (~0.001-0.003 blocchi/tick) anche
# per giocatori completamente legittimi.
#
# Con viaversion-attenuation abilitato, Void sottrae 0.005 dall'offset grezzo di
# predizione per i giocatori la cui versione differisce da quella del server.
# Speed hack e fly hack producono offset di 0.01-1.0+ (almeno 2× la tolleranza),
# quindi il rilevamento rimane intatto.
#
# Disabilita solo se il tuo server usa una sola versione Minecraft senza giocatori
# cross-version e vuoi la soglia di rilevamento più stretta possibile.
viaversion-attenuation: false

# Attenuazione specifica per elytra per i player cross-version.
#
# La fisica dell'elytra (planata) diverge piu significativamente tra versioni Minecraft
# rispetto al movimento normale - drag aerodinamico, scaling della direzione di sguardo
# e l'accumulo di velocita tick per tick differiscono tra versioni. Con ViaVersion attivo,
# un player legittimo che vola con l'elytra puo produrre offset raw fino a ~0.032
# blocchi/tick, molto sopra gli ~0.001-0.003 del movimento normale.
#
# Quando attivo, Void applica un'attenuazione extra di 0.03 (oltre a viaversion-attenuation)
# per ogni player cross-version mentre plana o subito dopo l'atterraggio.
# Gli exploit elytra reali producono offset di 0.1+ (3x la tolleranza extra), quindi
# il rilevamento rimane intatto.
#
# Attiva se vedi falsi positivi sulla Simulation per player cross-version che usano l'elytra.
# Non ha effetto se viaversion-attenuation non e attivo.
viaversion-elytra-attenuation: false

client-brand:
    # Regex dei client il cui brand viene ignorato silenziosamente e non trasmesso agli op.
    ignored-clients:
        - "^vanilla$"
        - "^fabric$"
        - "^quilt$"
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4},(?:fabric|forge)$"
        - "^Feather Fabric$"
        - "^labymod$"
    # Disconnette i client Forge 1.18.2-1.19.3 che includono reach hack integrati.
    disconnect-blacklisted-forge-versions: true

spectators:
    # Nascondi gli spettatori con il permesso void.spectator anche quando non spettano attivamente.
    hide-regardless: false
    # Limita il nascondimento degli spettatori ai mondi specificati. Lasciare vuoto per tutti.
    allowed-worlds:
        - ""

# Secondi prima di espellere un giocatore che smette di rispondere alle keep-alive.
max-transaction-time: 60

# Secondi massimi in cui un client congelato che risponde ancora alle keep-alive (es. ridotto a icona con vsync) resta connesso. 0-600, valori alti usano più memoria.
max-frozen-client-time: 300

# Chiave API Pastebin per /void debug. Lasciare vuoto per salvare i log localmente.
pastebin-api-key: ""

# Check

Simulation:
    # Moltiplicatore di decadimento del vantaggio accumulato durante il movimento legittimo.
    setback-decay-multiplier: 0.999
    # Offset minimo per sollevare una violazione. Valore più basso = più restrittivo.
    threshold: 0.001
    # Offset in un singolo tick che attiva un setback immediato. -1 per disabilitare.
    immediate-setback-threshold: 0.1
    # Vantaggio totale accumulato prima che inizino i setback. -1 per disabilitare.
    max-advantage: 1
    # Limite massimo del vantaggio per evitare accumulo infinito.
    max-ceiling: 4
    setback-violation-threshold: 1

Knockback:
    setback-decay-multiplier: 0.999
    threshold: 0.001
    immediate-setback-threshold: 0.1
    max-advantage: 1
    max-ceiling: 4

Explosion:
    threshold: 0.001
    setbackvl: 3

Phase:
    setbackvl: 1
    decay: 0.005

NoSlow:
    threshold: 0.001
    setbackvl: 5
    decay: 0.05

Reach:
    # Espansione della hitbox per il rilevamento. 0.0005 rileva tutto sopra 3.0005 blocchi.
    threshold: 0.0005
    block-impossible-hits: true
    # Invia un pacchetto extra per tick per migliorare la copertura.
    # Aumenta leggermente la banda. Consigliato solo per server PvP 1.8.
    enable-post-packet: false

AutoClickerA:
    # Hard CPS cap. No human technique sustains above 30 CPS long-term.
    # Raise only if you host drag-click tournaments; do not lower below 25.
    max-cps: 30
    # Minimum CPS before interval regularity analysis kicks in.
    analysis-cps: 8
    # Minimum interval Coefficient of Variation. Autoclickers: 0.00-0.02. Humans: 0.08+.
    # Keep this low. Clicks only ever land on tick boundaries, so an honest player
    # already looks flatter than they really are, and raising it bans them.
    min-cv: 0.05

AutoClickerB:
    # Minimum mean CPS across 1-second buckets before analysis runs.
    analysis-cps: 8
    # Minimum bucket-CV (std_dev/mean of per-second CPS). Randomized autoclickers: 0.04-0.08.
    # Human butterfly/jitter even at peak CPS: typically 0.15+.
    # 0.10 is the safe middle ground: catches bots, cannot false flag legitimate players.
    min-bucket-cv: 0.10

AutoClickerC:
    # A client queues every click and sends them all on the next tick, so an occasional double click is normal.
    # Drag clicking can keep several per tick going for a while. Keep at 1 and let min-consecutive-ticks filter.
    # Raise it only if drag clicking is allowed on your server.
    max-attacks-per-tick: 1
    # Consecutive ticks with too many attacks before flagging.
    # 3 absorbs one-off double clicks and rare ViaVersion packet reordering without missing real violations.
    min-consecutive-ticks: 3

AutoClickerD:
    # Needs killaura-dedicated-experimental-checks: true. Flags attacking at the earliest tick the weapon is fully charged (or the next one),
    # every time, for 48 attacks in a row. Cooldown-synced killauras do this; a human cannot hold that precision.
    # Attacks needed inside that band out of the last 48 (the maximum). Lower values flag more people: only lower it if you have measured your own players.
    min-in-band: 48
    # Weapons whose full-charge time is below this many ticks are ignored (spam-click rates are not cooldown timing).
    min-floor: 6

AimGcd:
    # Needs killaura-dedicated-experimental-checks: true. Real mouse input moves the camera in fixed steps set by the sensitivity.
    # Killauras send raw trigonometric angles that do not fit that grid. Only rotations around an attack are judged.
    # Off-grid rotations needed in the last 16 combat rotations. Lower catches more and risks cinematic camera, zoom and controllers.
    min-off-grid: 13
    # Ticks around an attack in which rotations are judged.
    combat-ticks: 1
    # Smallest learned sensitivity step (degrees) judged. Tiny steps cannot tell a grid from noise.
    min-step: 0.03
    # Smallest rotation (degrees) judged.
    min-delta: 0.75

AimSnapReturn:
    # Needs killaura-dedicated-experimental-checks: true. Flags a large rotation around an attack that is undone by the next one,
    # the pattern left by killauras that rotate only for the hit and then give the camera back.
    # Snaps needed inside window-ticks before flagging.
    min-hits: 3
    window-ticks: 200
    combat-ticks: 1
    # Smallest snap (degrees) and the largest leftover (degrees) after the return that still counts as undone.
    min-snap: 12
    max-residual: 2
    # Ticks allowed between the snap and the return.
    max-gap-ticks: 6

TimerA:
    setbackvl: 10
    # Millisecondi di bilanciamento timer accumulabili per compensare il lag.
    drift: 120

TimerLimit:
    # Soglia di ping oltre la quale il limitatore di bilanciamento timer si attiva. -1 per disabilitare.
    ping-abuse-limit-threshold: 1000

NegativeTimer:
    # Millisecondi di deficit di movimento prima di segnalare. -1 per disabilitare.
    drift: 1200

VehicleTimer:
    setbackvl: 10

AirLiquidPlace:
    cancelvl: 0

FabricatedPlace:
    cancelvl: 5

FarPlace:
    cancelvl: 5

PositionPlace:
    cancelvl: 5

RotationPlace:
    cancelvl: 5

PacketOrderI:
    # Abilitare se i giocatori con mod di animazioni 1.7 vengono segnalati erroneamente.
    exempt-placing-while-digging: false

exploit:
    # Previene l'exploit di velocità con sprint+salto in elytra.
    allow-sprint-jumping-when-using-elytra: true
    # Risincronizza il giocatore quando piazza blocchi su ghost block.
    allow-building-on-ghostblocks: true
    # Distanza di controllo per i ghost block. Range valido: 2-4.
    distance-to-check-if-ghostblocks: 2

    auto-totem:
        autopunish:
            enabled: false
            # kick o ban
            action: ban
            # Durata del ban passata al custom-ban-command quando action=ban.
            duration: "1d"
            # Placeholder: %check_name%  %vl%
            reason: |
                &cAutoTotem rilevato.
                &7Check: &f%check_name% &8(&dVL %vl%&8)
            # Se true, esegue il comando seguente dalla console al posto del ban interno.
            prefer-custom-ban: false
            # Template del comando. Placeholder: {player}  {duration}  {reason}
            # LiteBans:    "litebans:tempban {player} {duration} {reason}"
            # AdvancedBan: "ban {player} {reason} -t {duration}"
            # EssentialsX: "ban {player} {reason}"
            custom-ban-command: "litebans:tempban {player} {duration} {reason}"

# Punizioni

punishments:

    unban-command: "unban {player}"

    auto-punish:
        enabled: false
        # Violazioni che UN SINGOLO check deve raggiungere prima che Void agisca (non la somma di tutti).
        # Usato per ogni check senza override nella sezione thresholds qui sotto.
        threshold: 100
        # Override per singolo check, per nome del check.
        # I check non flaggano allo stesso ritmo, quindi non possono condividere una sola soglia.
        # Simulation in particolare accumula violazioni anche su giocatori del tutto legittimi
        # (lag, casi limite, tick saltati). Bannare dopo pochi flag di Simulation
        # rimuovera giocatori legittimi. Alza il valore se vedi ban ingiusti; non abbassarlo mai.
        thresholds:
            Simulation: 200
            GroundSpoof: 150
            NoFall: 150
            Timer: 100
            Knockback: 80
            Explosion: 80
            NoSlow: 80
            Post: 80
            Reach: 25
            Hitboxes: 25
        # kick o ban
        action: ban
        # Durata: "7d", "30d", "24h", "permanent"
        duration: "7d"
        # Placeholder: %check_name%  %vl%  %ban_id%  %date%  %duration%
        reason: |
            &5VoidAC
            &cAccount Sospeso
            &7Ban ID: &d%ban_id%
            &7Durata: &f%duration%
        # URL di appello opzionale mostrato in fondo al messaggio di espulsione.
        support-link: ""
        # Messaggio in broadcast a tutti i giocatori quando scatta la punizione.
        broadcast-message: "&8[&5Void&8] &f%player% &cè stato bannato &7per gioco scorretto."
        # Se true, esegue il comando seguente dalla console al posto del ban interno.
        prefer-custom-ban: false
        # Template del comando. Placeholder: {player}  {duration}  {reason}
        # LiteBans:    "litebans:tempban {player} {duration} {reason}"
        # AdvancedBan: "ban {player} {reason} -t {duration}"
        # EssentialsX: "ban {player} {reason}"
        custom-ban-command: "litebans:tempban {player} {duration} {reason}"

    manual-punish:
        # Durata predefinita per /void punish quando non viene specificata.
        duration: "7d"
        default-reason: "Cheating"
        # Placeholder: {player}  {issued_by}  {duration}  {reason}  {ban_id}  {date}
        reason: |
            &5VoidAC
            &cAccount Sospeso
            &7Bannato da: &f{issued_by}
            &7Ban ID: &d{ban_id}
            &7Durata: &f{duration}
            &7Motivo: &f{reason}
        # Se true, esegue il comando seguente dalla console al posto del ban interno.
        prefer-custom-ban: false
        # Template del comando. Placeholder: {player}  {duration}  {reason}
        custom-ban-command: "litebans:tempban {player} {duration} {reason}"

# Ban Wave
# Metti i giocatori in coda e bannali tutti in una volta.
# /void banwave add <player> [duration] : aggiunge alla coda
# /void banwave execute                 : banna tutti nella coda ora

ban-wave:
    enabled: true
    # Se true, auto-punish mette in coda invece di bannare subito.
    queue-on-auto-punish: false
    # Giorni tra le esecuzioni automatiche. 0 = solo manuale.
    auto-execute-days: 7
    # Durata predefinita del ban. Sovrascrivibile con /void banwave add <player> <duration>.
    duration: "7d"
    default-reason: "Cheating"
    # Placeholder: {wave}  {player}  {check}  {ban_id}  {date}  {duration}  {reason}
    reason: |
        &5VoidAC
        &cAccount Sospeso
        &7Ban Wave: &d#{wave}
        &7Ban ID: &d{ban_id}
        &7Durata: &f{duration}
        &7Motivo: &f{reason}
    # Placeholder: {wave}  {count}
    broadcast: "&8[&5Void&8] &7Ban Wave &d#{wave} &7eseguita: &d{count} &7giocatori rimossi."
    # Se true, esegue il comando seguente dalla console al posto del ban interno.
    prefer-custom-ban: false
    # Template del comando. Placeholder: {player}  {duration}  {reason}
    # LiteBans:    "litebans:tempban {player} {duration} {reason}"
    # AdvancedBan: "ban {player} {reason} -t {duration}"
    custom-ban-command: "litebans:tempban {player} {duration} {reason}"

# Anti-ESP e Anti-Freecam

anti-spoof:
    auto-kick: true
    kick-message: "<red>You have been kicked for using a blacklisted client."
    # The lists below are matched as lowercase substrings. Remove an entry to allow that client or mod.
    # Client brand sent on join (minecraft:brand).
    blocked-brands:
        - "meteor-client"
        - "meteor client"
        - "wurst"
        - "impact"
        - "aristois"
        - "inertia"
        - "lambda"
        - "kami blue"
        - "rusherhack"
        - "future"
        - "konas"
        - "phobos"
        - "salhack"
        - "liquidbounce"
        - "fdpclient"
        - "sigma"
        - "exhibition"
        - "ghost"
        - "rise"
        - "vape"
    # Plugin channels the client sends messages on. "xaero" matches Xaero's Minimap and World Map:
    # remove it if your server allows minimaps.
    blocked-channels:
        - "meteor-client"
        - "meteor:client"
        - "meteorclient"
        - "wurst:"
        - "impact:"
        - "aristois:"
        - "liquidbounce:"
        - "rusherhack:"
        - "ghost:"
        - "rise:"
        - "xaero"
    # Channels the client registers (minecraft:register, fabric:register, REGISTER).
    blocked-registrations:
        - "meteor-client:"
        - "meteor-client"
        - "meteor:"
        - "meteorclient:"
        - "meteorclient"
        - "baritone:"
        - "wurst:"
        - "impact:"
        - "aristois:"
        - "liquidbounce:"
        - "rusherhack:"
        - "lambda:"
        - "konas:"
        - "phobos:"
        - "ghost:"
        - "rise:"
    # Text searched inside any other plugin message (up to 2048 bytes).
    blocked-payload-keywords:
        - "meteor-client"
        - "meteorclient"
        - "liquidbounce"
        - "aristois"
        - "rusherhack"

# =============================================================================
# WARNING: ANTIESP IS AN EXPERIMENTAL DEVELOPMENT FEATURE
#
# AntiESP is still under active testing and is not ready for production use.
# Enabling it may cause incorrect blocks, hidden entities, visual glitches,
# compatibility problems, or other serious gameplay issues for players.
# This section is included only for developer testing convenience.
# Keep enabled set to false on every live server.
# =============================================================================
anti-esp:
    enabled: false
    entity-visibility: true
    block-entity-visibility: true
    terrain-masking: true
    hide-below-y: 0
    replacement-block: "air"
    proximity-radius: 16
    line-of-sight-distance: 96
    underground-reveal-radius: 2
    entity-recheck-interval-ticks: 2
    pov-unmasking: true
    pov-distance: 48
    pov-refresh-interval-ticks: 4
    chunk-refresh-cooldown-ticks: 4

# Storage ESP Decoys

storage-esp-decoys:
    # Invia blocchi di storage falsi (casse, botti, shulker) per confondere i client ESP.
    # I giocatori con il permesso void.storageesp bypassano i decoy.
    enabled: false
    # Blocchi falsi iniettati per chunk. Consigliati 10-20.
    decoys-per-chunk: 20
    include-client-side-blocks: false
    # Interazioni con un decoy prima del flag automatico. -1 per disabilitare.
    auto-flag-threshold: 16

# Anti-Xray
# Configura l'anti-xray integrato di Paper all'avvio. Solo server Paper.
# Richiede un riavvio completo per applicare i cambiamenti.

AntiXray:
    # Impostare true per far scrivere a Void le impostazioni di seguito nel config di Paper.
    configure-paper: false
    # 1 = sostituisce i minerali con pietra lato client (debole)
    # 2 = invia blocchi falsi al posto dei minerali (consigliato)
    engine-mode: 2
    max-block-height: 320
    # Raggio intorno all'aria esposta dove i dati reali vengono rivelati al client.
    update-radius: 16
    hidden-blocks:
        - air
        # Minerali
        - copper_ore
        - deepslate_copper_ore
        - raw_copper_block
        - iron_ore
        - deepslate_iron_ore
        - gold_ore
        - deepslate_gold_ore
        - diamond_ore
        - deepslate_diamond_ore
        - emerald_ore
        - deepslate_emerald_ore
        - lapis_ore
        - deepslate_lapis_ore
        - redstone_ore
        - deepslate_redstone_ore
        - coal_ore
        - deepslate_coal_ore
        - nether_quartz_ore
        - nether_gold_ore
        - ancient_debris
        # Blocchi di storage
        - chest
        - trapped_chest
        - barrel
        - ender_chest
        - shulker_box
        - white_shulker_box
        - orange_shulker_box
        - magenta_shulker_box
        - light_blue_shulker_box
        - yellow_shulker_box
        - lime_shulker_box
        - pink_shulker_box
        - gray_shulker_box
        - light_gray_shulker_box
        - cyan_shulker_box
        - purple_shulker_box
        - blue_shulker_box
        - brown_shulker_box
        - green_shulker_box
        - red_shulker_box
        - black_shulker_box
    replacement-blocks:
        - stone
        - deepslate
        - granite
        - diorite
        - andesite
        - dirt
        - gravel
        - tuff
        - calcite
        - smooth_basalt
        - coal_ore
        - deepslate_coal_ore

# Ottimizzatore Soglie
# Analizza i flag in tempo reale e suggerisce soglie di punizione più sicure.
# Comandi: /void optimizer start | stop | status | save | discard
# Richiede il permesso void.optimizer. Tagga i giocatori legit con void.optimizer.legit.

threshold-optimizer:
    enabled: false

# Avanzato

# Numero massimo di cancellazioni pacchetti illegali al secondo prima dell'espulsione.
packet-spam-threshold: 100
debug-packet-cancel: false
debug-packet-exceptions: false

# Ping massimo (ms) per i giocatori non in volo. -1 per disabilitare.
max-ping-out-of-flying: 1000
# Ping massimo (ms) con un boost di fuochi d'artificio in elytra attivo. -1 per disabilitare.
max-ping-firework-boost: 1000

# Disabilita la cancellazione dei pacchetti pong da parte di Void.
disable-pong-cancelling: false

# Disabilita il gestore di risincronizzazione blocchi predefinito.
# Abilitare se usi plugin che creano blocchi falsi via pacchetti.
disable-default-resync-handler: false

# Cancella i pacchetti di movimento duplicati dei client 1.17-1.20.5 su server 1.8.
cancel-duplicate-packet: true
ignore-duplicate-packet-rotation: false

# Reimposta il tracking dell'uso degli oggetti a questi eventi per prevenire bypass.
reset-item-usage-on-item-update: true
reset-item-usage-on-attack: true
reset-item-usage-on-slot-change: true
reset-item-usage-on-item-use: true

# Logga i plugin che hanno iniettato nella pipeline Netty al join (debug compatibilità).
debug-pipeline-on-join: false

# Invia le info di debug di Void a chi entra con il nome 22ix o con l'UUID dello sviluppatore.
# Serve solo allo sviluppatore di Void per il debug e non verifica l'account. Non concede permessi, accessi o comandi:
# quel giocatore vede solo versione di Void, piattaforma, giocatori tracciati, TPS, lingua e stato dell'archivio. Imposta false per disattivarlo.
unverified-dev-debug-greet: true

# Compatibilità con CoordinateOffset e plugin simili che riscrivono le coordinate tramite un proprio PacketEvents.
# Al join gli handler PacketEvents di Void vengono spostati dopo quelli dell'altro plugin, così Void continua a vedere le coordinate reali.
# Effetto collaterale: Void vede i pacchetti in uscita prima, e quelli in entrata dopo, ogni altro plugin che usa il PacketEvents condiviso.
# Dopo aver cambiato questo valore i player devono rientrare. Lascia false se non usi un plugin di questo tipo. Vale solo per il jar che include PacketEvents.
coordinate-offset-compat: false


# Diagnostic Logger
# WARNING: Extremely high CPU and disk I/O cost. Never enable on a production server.
# Enable only on a private test server to collect movement data for engine research.
# Writes one structured log block per prediction tick per player to plugins/Void/diagnostic/.
# Use the logs to distinguish false flags (lerp/slime/edge=Y) from real cheats (all N, offset >> threshold).

diagnostic-logger:
    enabled: false
    # Async write queue depth. Entries are dropped (oldest first) when full.
    queue-capacity: 4096
config-flavor: V2
config-version: 36
