# Général

alerts:
    # Envoyer les alertes de violation aussi dans la console en plus du staff en ligne.
    print-to-console: true
    proxy:
        # Transmettre les alertes aux autres serveurs du proxy (BungeeCord/Velocity).
        send: false
        receive: false

verbose:
    print-to-console: false

experimental-checks: false

# Les joueurs se connectant via un proxy avec ViaVersion installé peuvent provoquer
# des problèmes de traduction de paquets générant de faux positifs.
# allow: mettre à true pour les autoriser à rejoindre au lieu de les expulser.
# disable-setbacks: garde les alertes actives mais désactive les setbacks pour ces
#   joueurs, évitant de perturber les joueurs légitimes.
via-proxy:
    allow: false
    disable-setbacks: true

# Atténuation de l'offset de prédiction entre versions.
#
# Quand ViaVersion est actif: installé sur ce serveur ou sur un proxy: les clients
# d'une autre version de Minecraft utilisent des formules physiques légèrement différentes.
# ViaVersion traduit les paquets fidèlement mais ne peut compenser ces différences
# numériques, causant de petits offsets systématiques (~0.001–0.003 blocs/tick) même
# chez les joueurs parfaitement légitimes.
#
# Avec viaversion-attenuation activé, Void soustrait 0.005 de l'offset brut de prédiction
# pour les joueurs dont la version diffère du serveur. Les speed hacks et fly hacks
# produisent des offsets de 0.01–1.0+ (au moins 2× la tolérance), la détection reste intacte.
#
# Désactiver uniquement si votre serveur tourne sur une seule version sans joueurs
# cross-version et que vous souhaitez le seuil de détection le plus strict possible.
viaversion-attenuation: false

# Attenuation specifique a l'elytre pour les joueurs cross-version.
#
# La physique de l'elytre (planeur) diverge plus entre les versions Minecraft que le
# mouvement normal - trainee aerodynamique, mise a l'echelle de la direction du regard
# et accumulation de vitesse par tick different entre les versions. Avec ViaVersion actif,
# un joueur legitime planant avec un elytre peut produire des offsets bruts jusqu'a
# ~0.032 blocs/tick, bien au-dessus des ~0.001-0.003 en mouvement normal.
#
# Lorsqu'active, Void applique une attenuation supplementaire de 0.03 (en plus de
# viaversion-attenuation) pour tout joueur cross-version pendant qu'il plane ou juste
# apres l'atterrissage. Les exploits d'elytre reels produisent des offsets de 0.1+
# (3x la tolerance supplementaire), la detection reste donc intacte.
#
# Activer si vous voyez de faux positifs de Simulation chez des joueurs cross-version
# utilisant un elytre. N'a aucun effet si viaversion-attenuation n'est pas active.
viaversion-elytra-attenuation: false

client-brand:
    # Liste regex des clients dont la marque est ignorée silencieusement et non transmise aux ops.
    ignored-clients:
        - "^vanilla$"
        - "^fabric$"
        - "^quilt$"
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4},(?:fabric|forge)$"
        - "^Feather Fabric$"
        - "^labymod$"
    # Déconnecter les clients Forge 1.18.2–1.19.3 qui incluent des reach hacks intégrés.
    disconnect-blacklisted-forge-versions: true

spectators:
    # Cacher les spectateurs avec la permission void.spectator même s'ils ne spectent pas activement.
    hide-regardless: false
    # Restreindre le masquage des spectateurs à des mondes spécifiques. Vide = tous.
    allowed-worlds:
        - ""

# Secondes avant d'expulser un joueur qui ne répond plus.
max-transaction-time: 60

# Clé API Pastebin pour /void debug. Laisser vide pour sauvegarder les logs localement.
pastebin-api-key: ""

# Vérifications

Simulation:
    setback-decay-multiplier: 0.999
    threshold: 0.001
    immediate-setback-threshold: 0.1
    max-advantage: 1
    max-ceiling: 4
    setback-violation-threshold: 1

Knockback:
    setback-decay-multiplier: 0.999
    threshold: 0.001
    immediate-setback-threshold: 0.1
    max-advantage: 1
    max-ceiling: 4

Explosion:
    threshold: 0.001
    setbackvl: 3

Phase:
    setbackvl: 1
    decay: 0.005

NoSlow:
    threshold: 0.001
    setbackvl: 5
    decay: 0.05

Reach:
    threshold: 0.0005
    block-impossible-hits: true
    enable-post-packet: false

AutoClickerA:
    # Hard CPS cap. No human technique sustains above 30 CPS long-term.
    # Raise only if you host drag-click tournaments; do not lower below 25.
    max-cps: 30
    # Minimum CPS before interval regularity analysis kicks in.
    analysis-cps: 8
    # Minimum interval Coefficient of Variation. Autoclickers: 0.00-0.02. Humans: 0.08+.
    # 0.05 is well below every documented human technique; false flags are essentially impossible.
    min-cv: 0.05

AutoClickerB:
    # Minimum mean CPS across 1-second buckets before analysis runs.
    analysis-cps: 8
    # Minimum bucket-CV (std_dev/mean of per-second CPS). Randomized autoclickers: 0.04-0.08.
    # Human butterfly/jitter even at peak CPS: typically 0.15+.
    # 0.10 is the safe middle ground: catches bots, cannot false flag legitimate players.
    min-bucket-cv: 0.10

AutoClickerC:
    # Vanilla clients send at most 1 attack per tick. Keep at 1.
    max-attacks-per-tick: 1
    # Consecutive ticks with too many attacks before flagging.
    # 3 absorbs rare ViaVersion packet reordering without missing real violations.
    min-consecutive-ticks: 3

TimerA:
    setbackvl: 10
    drift: 120

TimerLimit:
    ping-abuse-limit-threshold: 1000

NegativeTimer:
    drift: 1200

VehicleTimer:
    setbackvl: 10

AirLiquidPlace:
    cancelvl: 0

FabricatedPlace:
    cancelvl: 5

FarPlace:
    cancelvl: 5

PositionPlace:
    cancelvl: 5

RotationPlace:
    cancelvl: 5

PacketOrderI:
    # Activer si des joueurs utilisant des mods d'animation 1.7 sont faussement signalés.
    exempt-placing-while-digging: false

exploit:
    allow-sprint-jumping-when-using-elytra: true
    allow-building-on-ghostblocks: true
    distance-to-check-if-ghostblocks: 2

    auto-totem:
        autopunish:
            enabled: false
            action: ban
            duration: "1d"
            reason: |
                &cAutoTotem détecté.
                &7Check: &f%check_name% &8(&dVL %vl%&8)
            # Si true, la commande ci-dessous est executée en console à la place du ban interne.
            prefer-custom-ban: false
            # Modèle de commande. Paramètres: {player}  {duration}  {reason}
            # LiteBans:    "litebans:tempban {player} {duration} {reason}"
            # AdvancedBan: "ban {player} {reason} -t {duration}"
            # EssentialsX: "ban {player} {reason}"
            custom-ban-command: "litebans:tempban {player} {duration} {reason}"

# Sanctions

punishments:

    auto-punish:
        enabled: false
        threshold: 10
        action: ban
        duration: "7d"
        reason: |
            &5VoidAC
            &cCompte Suspendu
            &7Ban ID: &d%ban_id%
            &7Durée: &f%duration%
        support-link: ""
        broadcast-message: "&8[&5Void&8] &f%player% &ca été banni &7pour jeu déloyal."
        # Si true, la commande ci-dessous est executée en console à la place du ban interne.
        prefer-custom-ban: false
        # Modèle de commande. Paramètres: {player}  {duration}  {reason}
        # LiteBans:    "litebans:tempban {player} {duration} {reason}"
        # AdvancedBan: "ban {player} {reason} -t {duration}"
        # EssentialsX: "ban {player} {reason}"
        custom-ban-command: "litebans:tempban {player} {duration} {reason}"

    manual-punish:
        duration: "7d"
        reason: |
            &5VoidAC
            &cCompte Suspendu
            &7Banni par: &f{issued_by}
            &7Ban ID: &d{ban_id}
            &7Durée: &f{duration}
        prefer-custom-ban: false
        custom-ban-command: "litebans:tempban {player} {duration} {reason}"

# Vague de Bans
# /void banwave add <player> [duration] : ajouter à la file
# /void banwave execute                 : bannir tout le monde maintenant

ban-wave:
    enabled: true
    queue-on-auto-punish: false
    auto-execute-days: 7
    duration: "7d"
    reason: |
        &5VoidAC
        &cCompte Suspendu
        &7Vague de Bans: &d#{wave}
        &7Ban ID: &d{ban_id}
        &7Durée: &f{duration}
    broadcast: "&8[&5Void&8] &7Vague de Bans &d#{wave} &7exécutée: &d{count} &7joueurs supprimés."
    prefer-custom-ban: false
    # Modèle de commande. Paramètres: {player}  {duration}  {reason}
    # LiteBans:    "litebans:tempban {player} {duration} {reason}"
    # AdvancedBan: "ban {player} {reason} -t {duration}"
    custom-ban-command: "litebans:tempban {player} {duration} {reason}"

# Storage ESP Decoys

storage-esp-decoys:
    enabled: false
    decoys-per-chunk: 20
    include-client-side-blocks: false
    auto-flag-threshold: 16

# Anti-Xray

AntiXray:
    configure-paper: false
    engine-mode: 2
    max-block-height: 320
    update-radius: 16
    hidden-blocks:
        - air
        - copper_ore
        - deepslate_copper_ore
        - raw_copper_block
        - iron_ore
        - deepslate_iron_ore
        - gold_ore
        - deepslate_gold_ore
        - diamond_ore
        - deepslate_diamond_ore
        - emerald_ore
        - deepslate_emerald_ore
        - lapis_ore
        - deepslate_lapis_ore
        - redstone_ore
        - deepslate_redstone_ore
        - coal_ore
        - deepslate_coal_ore
        - nether_quartz_ore
        - nether_gold_ore
        - ancient_debris
        - chest
        - trapped_chest
        - barrel
        - ender_chest
        - shulker_box
        - white_shulker_box
        - orange_shulker_box
        - magenta_shulker_box
        - light_blue_shulker_box
        - yellow_shulker_box
        - lime_shulker_box
        - pink_shulker_box
        - gray_shulker_box
        - light_gray_shulker_box
        - cyan_shulker_box
        - purple_shulker_box
