# Configuration de Void: https://github.com/blackowlzz/Void
# Copyright 2026 blackowlzz, MWHunter (DefineOutside) et contributeurs, sous licence GPLv3.

# Général

alerts:
    # Envoyer les alertes de violation aussi dans la console en plus du staff en ligne.
    print-to-console: true
    proxy:
        # Transmettre les alertes aux autres serveurs du proxy (BungeeCord/Velocity).
        send: false
        receive: false

verbose:
    print-to-console: false

experimental-checks: false

# Dedicated killaura detection (AimGcd, AimSnapReturn, AutoClickerD). Off by default, independent of experimental-checks.
# These checks are new and only tested against a few clients: they can false flag. Their flags are alert-only and never reach punishments.yml or auto-punish.
# Enable it on servers whose owners accept that risk. See docs/killaura-experimental.md.
killaura-dedicated-experimental-checks: false

# Affiche les messages de Void en petites capitales (ѕᴛʏʟᴇ ᴠᴏɪᴅ). Nécessite une police client avec ces glyphes : si les joueurs voient des carrés à la place des lettres, laissez désactivé.
# Prévu uniquement pour l'anglais : les langues avec accents ou alphabets non latins (italien, russe, chinois, ...) affichent un texte mixte ou sans style, et le staff avec void.alerts est averti en jeu 5 secondes après sa connexion.
small-caps: false

# Les joueurs se connectant via un proxy avec ViaVersion installé peuvent provoquer
# des problèmes de traduction de paquets générant de faux positifs.
# allow: mettre à true pour les autoriser à rejoindre au lieu de les expulser.
# disable-setbacks: garde les alertes actives mais désactive les setbacks pour ces
#   joueurs, évitant de perturber les joueurs légitimes.
via-proxy:
    allow: false
    disable-setbacks: true

viaproxy-warn-on-join: true

# Atténuation de l'offset de prédiction entre versions.
#
# Quand ViaVersion est actif: installé sur ce serveur ou sur un proxy: les clients
# d'une autre version de Minecraft utilisent des formules physiques légèrement différentes.
# ViaVersion traduit les paquets fidèlement mais ne peut compenser ces différences
# numériques, causant de petits offsets systématiques (~0.001-0.003 blocs/tick) même
# chez les joueurs parfaitement légitimes.
#
# Avec viaversion-attenuation activé, Void soustrait 0.005 de l'offset brut de prédiction
# pour les joueurs dont la version diffère du serveur. Les speed hacks et fly hacks
# produisent des offsets de 0.01-1.0+ (au moins 2× la tolérance), la détection reste intacte.
#
# Désactiver uniquement si votre serveur tourne sur une seule version sans joueurs
# cross-version et que vous souhaitez le seuil de détection le plus strict possible.
viaversion-attenuation: false

# Attenuation specifique a l'elytre pour les joueurs cross-version.
#
# La physique de l'elytre (planeur) diverge plus entre les versions Minecraft que le
# mouvement normal - trainee aerodynamique, mise a l'echelle de la direction du regard
# et accumulation de vitesse par tick different entre les versions. Avec ViaVersion actif,
# un joueur legitime planant avec un elytre peut produire des offsets bruts jusqu'a
# ~0.032 blocs/tick, bien au-dessus des ~0.001-0.003 en mouvement normal.
#
# Lorsqu'active, Void applique une attenuation supplementaire de 0.03 (en plus de
# viaversion-attenuation) pour tout joueur cross-version pendant qu'il plane ou juste
# apres l'atterrissage. Les exploits d'elytre reels produisent des offsets de 0.1+
# (3x la tolerance supplementaire), la detection reste donc intacte.
#
# Activer si vous voyez de faux positifs de Simulation chez des joueurs cross-version
# utilisant un elytre. N'a aucun effet si viaversion-attenuation n'est pas active.
viaversion-elytra-attenuation: false

client-brand:
    # Liste regex des clients dont la marque est ignorée silencieusement et non transmise aux ops.
    ignored-clients:
        - "^vanilla$"
        - "^fabric$"
        - "^quilt$"
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4},(?:fabric|forge)$"
        - "^Feather Fabric$"
        - "^labymod$"
    # Déconnecter les clients Forge 1.18.2-1.19.3 qui incluent des reach hacks intégrés.
    disconnect-blacklisted-forge-versions: true

spectators:
    # Cacher les spectateurs avec la permission void.spectator même s'ils ne spectent pas activement.
    hide-regardless: false
    # Restreindre le masquage des spectateurs à des mondes spécifiques. Vide = tous.
    allowed-worlds:
        - ""

# Secondes avant d'expulser un joueur qui ne répond plus.
max-transaction-time: 60

# Secondes maximales pendant lesquelles un client figé qui répond encore aux keep-alive (ex. réduit avec la vsync) reste connecté. 0-600, des valeurs élevées utilisent plus de mémoire.
max-frozen-client-time: 300

# Clé API Pastebin pour /void debug. Laisser vide pour sauvegarder les logs localement.
pastebin-api-key: ""

# Vérifications

Simulation:
    setback-decay-multiplier: 0.999
    threshold: 0.001
    immediate-setback-threshold: 0.1
    max-advantage: 1
    max-ceiling: 4
    setback-violation-threshold: 1

Knockback:
    setback-decay-multiplier: 0.999
    threshold: 0.001
    immediate-setback-threshold: 0.1
    max-advantage: 1
    max-ceiling: 4

Explosion:
    threshold: 0.001
    setbackvl: 3

Phase:
    setbackvl: 1
    decay: 0.005

NoSlow:
    threshold: 0.001
    setbackvl: 5
    decay: 0.05

Reach:
    threshold: 0.0005
    block-impossible-hits: true
    enable-post-packet: false

AutoClickerA:
    # Hard CPS cap. No human technique sustains above 30 CPS long-term.
    # Raise only if you host drag-click tournaments; do not lower below 25.
    max-cps: 30
    # Minimum CPS before interval regularity analysis kicks in.
    analysis-cps: 8
    # Minimum interval Coefficient of Variation. Autoclickers: 0.00-0.02. Humans: 0.08+.
    # Keep this low. Clicks only ever land on tick boundaries, so an honest player
    # already looks flatter than they really are, and raising it bans them.
    min-cv: 0.05

AutoClickerB:
    # Minimum mean CPS across 1-second buckets before analysis runs.
    analysis-cps: 8
    # Minimum bucket-CV (std_dev/mean of per-second CPS). Randomized autoclickers: 0.04-0.08.
    # Human butterfly/jitter even at peak CPS: typically 0.15+.
    # 0.10 is the safe middle ground: catches bots, cannot false flag legitimate players.
    min-bucket-cv: 0.10

AutoClickerC:
    # A client queues every click and sends them all on the next tick, so an occasional double click is normal.
    # Drag clicking can keep several per tick going for a while. Keep at 1 and let min-consecutive-ticks filter.
    # Raise it only if drag clicking is allowed on your server.
    max-attacks-per-tick: 1
    # Consecutive ticks with too many attacks before flagging.
    # 3 absorbs one-off double clicks and rare ViaVersion packet reordering without missing real violations.
    min-consecutive-ticks: 3

AutoClickerD:
    # Needs killaura-dedicated-experimental-checks: true. Flags attacking at the earliest tick the weapon is fully charged (or the next one),
    # every time, for 48 attacks in a row. Cooldown-synced killauras do this; a human cannot hold that precision.
    # Attacks needed inside that band out of the last 48 (the maximum). Lower values flag more people: only lower it if you have measured your own players.
    min-in-band: 48
    # Weapons whose full-charge time is below this many ticks are ignored (spam-click rates are not cooldown timing).
    min-floor: 6

AimGcd:
    # Needs killaura-dedicated-experimental-checks: true. Real mouse input moves the camera in fixed steps set by the sensitivity.
    # Killauras send raw trigonometric angles that do not fit that grid. Only rotations around an attack are judged.
    # Off-grid rotations needed in the last 16 combat rotations. Lower catches more and risks cinematic camera, zoom and controllers.
    min-off-grid: 13
    # Ticks around an attack in which rotations are judged.
    combat-ticks: 1
    # Smallest learned sensitivity step (degrees) judged. Tiny steps cannot tell a grid from noise.
    min-step: 0.03
    # Smallest rotation (degrees) judged.
    min-delta: 0.75

AimSnapReturn:
    # Needs killaura-dedicated-experimental-checks: true. Flags a large rotation around an attack that is undone by the next one,
    # the pattern left by killauras that rotate only for the hit and then give the camera back.
    # Snaps needed inside window-ticks before flagging.
    min-hits: 3
    window-ticks: 200
    combat-ticks: 1
    # Smallest snap (degrees) and the largest leftover (degrees) after the return that still counts as undone.
    min-snap: 12
    max-residual: 2
    # Ticks allowed between the snap and the return.
    max-gap-ticks: 6

TimerA:
    setbackvl: 10
    drift: 120

TimerLimit:
    ping-abuse-limit-threshold: 1000

NegativeTimer:
    drift: 1200

VehicleTimer:
    setbackvl: 10

AirLiquidPlace:
    cancelvl: 0

FabricatedPlace:
    cancelvl: 5

FarPlace:
    cancelvl: 5

PositionPlace:
    cancelvl: 5

RotationPlace:
    cancelvl: 5

PacketOrderI:
    # Activer si des joueurs utilisant des mods d'animation 1.7 sont faussement signalés.
    exempt-placing-while-digging: false

exploit:
    allow-sprint-jumping-when-using-elytra: true
    allow-building-on-ghostblocks: true
    distance-to-check-if-ghostblocks: 2

    auto-totem:
        autopunish:
            enabled: false
            action: ban
            duration: "1d"
            reason: |
                &cAutoTotem détecté.
                &7Check: &f%check_name% &8(&dVL %vl%&8)
            # Si true, la commande ci-dessous est executée en console à la place du ban interne.
            prefer-custom-ban: false
            # Modèle de commande. Paramètres: {player}  {duration}  {reason}
            # LiteBans:    "litebans:tempban {player} {duration} {reason}"
            # AdvancedBan: "ban {player} {reason} -t {duration}"
            # EssentialsX: "ban {player} {reason}"
            custom-ban-command: "litebans:tempban {player} {duration} {reason}"

# Sanctions

punishments:

    unban-command: "unban {player}"

    auto-punish:
        enabled: false
        # Violations qu'UN SEUL check doit atteindre avant que Void agisse (pas la somme de tous).
        # Utilise pour tout check sans surcharge dans la section thresholds ci-dessous.
        threshold: 100
        # Surcharges par check, par nom de check.
        # Les checks ne flaguent pas au meme rythme, ils ne peuvent pas partager un seul seuil.
        # Simulation en particulier accumule des violations sur des joueurs parfaitement legitimes
        # (lag, cas limites, ticks manques). Bannir apres quelques flags Simulation
        # supprimera des joueurs legitimes. Augmentez en cas de faux bans ; ne baissez jamais.
        thresholds:
            Simulation: 200
            GroundSpoof: 150
            NoFall: 150
            Timer: 100
            Knockback: 80
            Explosion: 80
            NoSlow: 80
            Post: 80
            Reach: 25
            Hitboxes: 25
        action: ban
        duration: "7d"
        reason: |
            &5VoidAC
            &cCompte Suspendu
            &7Ban ID: &d%ban_id%
            &7Durée: &f%duration%
        support-link: ""
        broadcast-message: "&8[&5Void&8] &f%player% &ca été banni &7pour jeu déloyal."
        # Si true, la commande ci-dessous est executée en console à la place du ban interne.
        prefer-custom-ban: false
        # Modèle de commande. Paramètres: {player}  {duration}  {reason}
        # LiteBans:    "litebans:tempban {player} {duration} {reason}"
        # AdvancedBan: "ban {player} {reason} -t {duration}"
        # EssentialsX: "ban {player} {reason}"
        custom-ban-command: "litebans:tempban {player} {duration} {reason}"

    manual-punish:
        duration: "7d"
        default-reason: "Cheating"
        reason: |
            &5VoidAC
            &cCompte Suspendu
            &7Banni par: &f{issued_by}
            &7Ban ID: &d{ban_id}
            &7Durée: &f{duration}
            &7Raison: &f{reason}
        prefer-custom-ban: false
        custom-ban-command: "litebans:tempban {player} {duration} {reason}"

# Vague de Bans
# /void banwave add <player> [duration] : ajouter à la file
# /void banwave execute                 : bannir tout le monde maintenant

ban-wave:
    enabled: true
    queue-on-auto-punish: false
    auto-execute-days: 7
    duration: "7d"
    default-reason: "Cheating"
    reason: |
        &5VoidAC
        &cCompte Suspendu
        &7Vague de Bans: &d#{wave}
        &7Ban ID: &d{ban_id}
        &7Durée: &f{duration}
        &7Raison: &f{reason}
    broadcast: "&8[&5Void&8] &7Vague de Bans &d#{wave} &7exécutée: &d{count} &7joueurs supprimés."
    prefer-custom-ban: false
    # Modèle de commande. Paramètres: {player}  {duration}  {reason}
    # LiteBans:    "litebans:tempban {player} {duration} {reason}"
    # AdvancedBan: "ban {player} {reason} -t {duration}"
    custom-ban-command: "litebans:tempban {player} {duration} {reason}"

# Anti-ESP and Anti-Freecam

anti-spoof:
    auto-kick: true
    kick-message: "<red>You have been kicked for using a blacklisted client."
    # The lists below are matched as lowercase substrings. Remove an entry to allow that client or mod.
    # Client brand sent on join (minecraft:brand).
    blocked-brands:
        - "meteor-client"
        - "meteor client"
        - "wurst"
        - "impact"
        - "aristois"
        - "inertia"
        - "lambda"
        - "kami blue"
        - "rusherhack"
        - "future"
        - "konas"
        - "phobos"
        - "salhack"
        - "liquidbounce"
        - "fdpclient"
        - "sigma"
        - "exhibition"
        - "ghost"
        - "rise"
        - "vape"
    # Plugin channels the client sends messages on. "xaero" matches Xaero's Minimap and World Map:
    # remove it if your server allows minimaps.
    blocked-channels:
        - "meteor-client"
        - "meteor:client"
        - "meteorclient"
        - "wurst:"
        - "impact:"
        - "aristois:"
        - "liquidbounce:"
        - "rusherhack:"
        - "ghost:"
        - "rise:"
        - "xaero"
    # Channels the client registers (minecraft:register, fabric:register, REGISTER).
    blocked-registrations:
        - "meteor-client:"
        - "meteor-client"
        - "meteor:"
        - "meteorclient:"
        - "meteorclient"
        - "baritone:"
        - "wurst:"
        - "impact:"
        - "aristois:"
        - "liquidbounce:"
        - "rusherhack:"
        - "lambda:"
        - "konas:"
        - "phobos:"
        - "ghost:"
        - "rise:"
    # Text searched inside any other plugin message (up to 2048 bytes).
    blocked-payload-keywords:
        - "meteor-client"
        - "meteorclient"
        - "liquidbounce"
        - "aristois"
        - "rusherhack"

# =============================================================================
# WARNING: ANTIESP IS AN EXPERIMENTAL DEVELOPMENT FEATURE
#
# AntiESP is still under active testing and is not ready for production use.
# Enabling it may cause incorrect blocks, hidden entities, visual glitches,
# compatibility problems, or other serious gameplay issues for players.
# This section is included only for developer testing convenience.
# Keep enabled set to false on every live server.
# =============================================================================
anti-esp:
    enabled: false
    entity-visibility: true
    block-entity-visibility: true
    terrain-masking: true
    hide-below-y: 0
    replacement-block: "air"
    proximity-radius: 16
    line-of-sight-distance: 96
    underground-reveal-radius: 2
    entity-recheck-interval-ticks: 2
    pov-unmasking: true
    pov-distance: 48
    pov-refresh-interval-ticks: 4
    chunk-refresh-cooldown-ticks: 4

# Storage ESP Decoys

storage-esp-decoys:
    enabled: false
    decoys-per-chunk: 20
    include-client-side-blocks: false
    auto-flag-threshold: 16

# Anti-Xray

AntiXray:
    configure-paper: false
    engine-mode: 2
    max-block-height: 320
    update-radius: 16
    hidden-blocks:
        - air
        - copper_ore
        - deepslate_copper_ore
        - raw_copper_block
        - iron_ore
        - deepslate_iron_ore
        - gold_ore
        - deepslate_gold_ore
        - diamond_ore
        - deepslate_diamond_ore
        - emerald_ore
        - deepslate_emerald_ore
        - lapis_ore
        - deepslate_lapis_ore
        - redstone_ore
        - deepslate_redstone_ore
        - coal_ore
        - deepslate_coal_ore
        - nether_quartz_ore
        - nether_gold_ore
        - ancient_debris
        - chest
        - trapped_chest
        - barrel
        - ender_chest
        - shulker_box
        - white_shulker_box
        - orange_shulker_box
        - magenta_shulker_box
        - light_blue_shulker_box
        - yellow_shulker_box
        - lime_shulker_box
        - pink_shulker_box
        - gray_shulker_box
        - light_gray_shulker_box
        - cyan_shulker_box
        - purple_shulker_box
        - blue_shulker_box
        - brown_shulker_box
        - green_shulker_box
        - red_shulker_box
        - black_shulker_box
    replacement-blocks:
        - stone
        - deepslate
        - granite
        - diorite
        - andesite
        - dirt
        - gravel
        - tuff
        - calcite
        - smooth_basalt
        - coal_ore
        - deepslate_coal_ore

# Optimiseur de Seuils

threshold-optimizer:
    enabled: false

# Avancé

packet-spam-threshold: 100
debug-packet-cancel: false
debug-packet-exceptions: false

max-ping-out-of-flying: 1000
max-ping-firework-boost: 1000

disable-pong-cancelling: false
disable-default-resync-handler: false

cancel-duplicate-packet: true
ignore-duplicate-packet-rotation: false

reset-item-usage-on-item-update: true
reset-item-usage-on-attack: true
reset-item-usage-on-slot-change: true
reset-item-usage-on-item-use: true

debug-pipeline-on-join: false

# Send Void's debug info to any player named 22ix or using the developer's UUID when they join.
# It only helps the Void developer debug and does not verify the account. It grants no permissions, access or commands:
# that player only sees the Void version, platform, tracked players, TPS, language and archive status. Set to false to turn it off.
unverified-dev-debug-greet: true
coordinate-offset-compat: false


# Diagnostic Logger
# WARNING: Extremely high CPU and disk I/O cost. Never enable on a production server.
# Enable only on a private test server to collect movement data for engine research.
# Writes one structured log block per prediction tick per player to plugins/Void/diagnostic/.
# Use the logs to distinguish false flags (lerp/slime/edge=Y) from real cheats (all N, offset >> threshold).

diagnostic-logger:
    enabled: false
    # Async write queue depth. Entries are dropped (oldest first) when full.
    queue-capacity: 4096
config-flavor: V2
config-version: 36
