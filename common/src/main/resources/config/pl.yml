# Ogólne

alerts:
    # Wysyłaj alerty o naruszeniach do konsoli oprócz personelu online.
    print-to-console: true
    proxy:
        # Przekazuj alerty do innych serwerów na proxy (BungeeCord/Velocity).
        send: false
        receive: false

verbose:
    print-to-console: false

experimental-checks: false

# Gracze łączący się przez proxy z zainstalowanym ViaVersion mogą powodować
# problemy z tłumaczeniem pakietów generujące fałszywe alarmy.
# allow: ustaw na true, aby zezwolić na wejście zamiast wyrzucania.
# disable-setbacks: utrzymuje alerty aktywne, ale wyłącza setbacki dla tych graczy.
via-proxy:
    allow: false
    disable-setbacks: true

# Tłumienie przesunięcia predykcji między wersjami.
#
# Gdy ViaVersion jest aktywny: zainstalowany na tym serwerze lub proxy: klienci
# z inną wersją Minecraft używają nieznacznie różnych wzorów fizyki. ViaVersion
# wiernie tłumaczy pakiety, ale nie może skompensować tych różnic numerycznych,
# powodując małe systematyczne przesunięcia (~0.001–0.003 bloków/tick) nawet
# u całkowicie legalnych graczy.
#
# Przy włączonym viaversion-attenuation Void odejmuje 0.005 od surowego przesunięcia
# predykcji dla graczy z inną wersją. Cheaty produkują przesunięcia 0.01–1.0+
# (co najmniej 2× tolerancji), wykrywanie pozostaje nienaruszone.
#
# Wyłącz tylko jeśli serwer działa na jednej wersji bez graczy cross-version
# i chcesz użyć najściślejszego możliwego progu wykrywania.
viaversion-attenuation: false

# Tlumienie przesuniecia predykcji specyficzne dla elytra u graczy cross-version.
#
# Fizyka elytra (szybowanie) rozni sie bardziej miedzy wersjami Minecraft niz zwykly ruch
# - opor aerodynamiczny, skalowanie kierunku spojrzenia i akumulacja predkosci na tick
# roznia sie miedzy wersjami. Przy aktywnym ViaVersion legalny gracz szybujacy na elytrze
# moze produkowac surowe przesuniecia do ~0.032 blokow/tick, znacznie powyzej ~0.001-0.003
# podczas normalnego ruchu.
#
# Po wlaczeniu Void stosuje dodatkowe tlumienie 0.03 (oprocz viaversion-attenuation) dla
# graczy cross-version podczas szybowania lub zaraz po ladowaniu. Prawdziwe exploity elytra
# produkuja przesuniecia 0.1+ (3x dodatkowej tolerancji), wykrywanie pozostaje nienaruszone.
#
# Wlacz jesli widzisz falszywe alarmy Simulation u graczy cross-version uzywajacych elytra.
# Nie ma efektu jesli viaversion-attenuation nie jest wlaczone.
viaversion-elytra-attenuation: false

client-brand:
    # Lista regex klientów, których marka jest ignorowana w ciszy.
    ignored-clients:
        - "^vanilla$"
        - "^fabric$"
        - "^quilt$"
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4},(?:fabric|forge)$"
        - "^Feather Fabric$"
        - "^labymod$"
    # Rozłączaj klientów Forge 1.18.2–1.19.3 z wbudowanymi hackami zasięgu.
    disconnect-blacklisted-forge-versions: true

spectators:
    # Ukrywaj widzów z uprawnieniem void.spectator nawet gdy nie obserwują aktywnie.
    hide-regardless: false
    # Ukrywaj widzów tylko w wybranych światach. Puste = wszystkie światy.
    allowed-worlds:
        - ""

# Sekundy przed wyrzuceniem gracza, który przestaje odpowiadać.
max-transaction-time: 60

# Klucz API Pastebin dla /void debug. Puste = zapis lokalny.
pastebin-api-key: ""

# Checki

Simulation:
    setback-decay-multiplier: 0.999
    threshold: 0.001
    immediate-setback-threshold: 0.1
    max-advantage: 1
    max-ceiling: 4
    setback-violation-threshold: 1

Knockback:
    setback-decay-multiplier: 0.999
    threshold: 0.001
    immediate-setback-threshold: 0.1
    max-advantage: 1
    max-ceiling: 4

Explosion:
    threshold: 0.001
    setbackvl: 3

Phase:
    setbackvl: 1
    decay: 0.005

NoSlow:
    threshold: 0.001
    setbackvl: 5
    decay: 0.05

Reach:
    threshold: 0.0005
    block-impossible-hits: true
    enable-post-packet: false

AutoClickerA:
    # Hard CPS cap. No human technique sustains above 30 CPS long-term.
    # Raise only if you host drag-click tournaments; do not lower below 25.
    max-cps: 30
    # Minimum CPS before interval regularity analysis kicks in.
    analysis-cps: 8
    # Minimum interval Coefficient of Variation. Autoclickers: 0.00-0.02. Humans: 0.08+.
    # 0.05 is well below every documented human technique; false flags are essentially impossible.
    min-cv: 0.05

AutoClickerB:
    # Minimum mean CPS across 1-second buckets before analysis runs.
    analysis-cps: 8
    # Minimum bucket-CV (std_dev/mean of per-second CPS). Randomized autoclickers: 0.04-0.08.
    # Human butterfly/jitter even at peak CPS: typically 0.15+.
    # 0.10 is the safe middle ground: catches bots, cannot false flag legitimate players.
    min-bucket-cv: 0.10

AutoClickerC:
    # Vanilla clients send at most 1 attack per tick. Keep at 1.
    max-attacks-per-tick: 1
    # Consecutive ticks with too many attacks before flagging.
    # 3 absorbs rare ViaVersion packet reordering without missing real violations.
    min-consecutive-ticks: 3

TimerA:
    setbackvl: 10
    drift: 120

TimerLimit:
    ping-abuse-limit-threshold: 1000

NegativeTimer:
    drift: 1200

VehicleTimer:
    setbackvl: 10

AirLiquidPlace:
    cancelvl: 0

FabricatedPlace:
    cancelvl: 5

FarPlace:
    cancelvl: 5

PositionPlace:
    cancelvl: 5

RotationPlace:
    cancelvl: 5

PacketOrderI:
    # Włącz jeśli gracze z modami animacji 1.7 są błędnie flagowani.
    exempt-placing-while-digging: false

exploit:
    allow-sprint-jumping-when-using-elytra: true
    allow-building-on-ghostblocks: true
    distance-to-check-if-ghostblocks: 2

    auto-totem:
        autopunish:
            enabled: false
            action: ban
            duration: "1d"
            reason: |
                &cAutoTotem wykryto.
                &7Check: &f%check_name% &8(&dVL %vl%&8)
            # Jesli true, ponizsze polecenie jest wykonywane przez konsole zamiast wewnetrznego bana.
            prefer-custom-ban: false
            # Szablon komendy. Znaczniki: {player}  {duration}  {reason}
            # LiteBans:    "litebans:tempban {player} {duration} {reason}"
            # AdvancedBan: "ban {player} {reason} -t {duration}"
            # EssentialsX: "ban {player} {reason}"
            custom-ban-command: "litebans:tempban {player} {duration} {reason}"

# Kary

punishments:

    auto-punish:
        enabled: false
        # Naruszenia, ktore POJEDYNCZY check musi osiagnac, zanim Void zadziala (nie suma wszystkich).
        # Uzywane dla kazdego checka bez nadpisania w sekcji thresholds ponizej.
        threshold: 100
        # Nadpisania dla poszczegolnych checkow, wedlug nazwy.
        # Checki flaguja z rozna czestotliwoscia, wiec nie moga dzielic jednego progu.
        # Zwlaszcza Simulation zbiera naruszenia u calkowicie uczciwych graczy
        # (lag, przypadki brzegowe, pominiete ticki). Ban po kilku flagach Simulation
        # usunie uczciwych graczy. Zwieksz wartosc przy falszywych banach; nigdy nie zmniejszaj.
        thresholds:
            Simulation: 200
            GroundSpoof: 150
            NoFall: 150
            Timer: 100
            Knockback: 80
            Explosion: 80
            NoSlow: 80
            Post: 80
            Reach: 25
            Hitboxes: 25
        action: ban
        duration: "7d"
        reason: |
            &5VoidAC
            &cKonto Zawieszone
            &7Ban ID: &d%ban_id%
            &7Czas trwania: &f%duration%
        support-link: ""
        broadcast-message: "&8[&5Void&8] &f%player% &czostał zbanowany &7za nieuczciwa gre."
        # Jesli true, ponizsze polecenie jest wykonywane przez konsole zamiast wewnetrznego bana.
        prefer-custom-ban: false
        # Szablon komendy. Znaczniki: {player}  {duration}  {reason}
        # LiteBans:    "litebans:tempban {player} {duration} {reason}"
        # AdvancedBan: "ban {player} {reason} -t {duration}"
        # EssentialsX: "ban {player} {reason}"
        custom-ban-command: "litebans:tempban {player} {duration} {reason}"

    manual-punish:
        duration: "7d"
        reason: |
            &5VoidAC
            &cKonto Zawieszone
            &7Zbanowany przez: &f{issued_by}
            &7Ban ID: &d{ban_id}
            &7Czas trwania: &f{duration}
        prefer-custom-ban: false
        custom-ban-command: "litebans:tempban {player} {duration} {reason}"

# Fala Banów
# /void banwave add <player> [duration] : dodaj do kolejki
# /void banwave execute                 : zbanuj wszystkich teraz

ban-wave:
    enabled: true
    queue-on-auto-punish: false
    auto-execute-days: 7
    duration: "7d"
    reason: |
        &5VoidAC
        &cKonto Zawieszone
        &7Fala Banów: &d#{wave}
        &7Ban ID: &d{ban_id}
        &7Czas trwania: &f{duration}
    broadcast: "&8[&5Void&8] &7Fala Banów &d#{wave} &7wykonana: &d{count} &7graczy usuniętych."
    prefer-custom-ban: false
    # Szablon komendy. Znaczniki: {player}  {duration}  {reason}
    # LiteBans:    "litebans:tempban {player} {duration} {reason}"
    # AdvancedBan: "ban {player} {reason} -t {duration}"
    custom-ban-command: "litebans:tempban {player} {duration} {reason}"

# Storage ESP Decoys

storage-esp-decoys:
    enabled: false
    decoys-per-chunk: 20
    include-client-side-blocks: false
    auto-flag-threshold: 16

