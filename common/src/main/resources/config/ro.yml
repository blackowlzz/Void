# General

alerts:
    # Trimite alertele de violare și în consolă pe lângă stafful online.
    print-to-console: true
    proxy:
        # Redirecționează alertele către alte servere din proxy (BungeeCord/Velocity).
        send: false
        receive: false

verbose:
    print-to-console: false

experimental-checks: false

# Jucătorii care se conectează printr-un proxy cu ViaVersion instalat pot cauza
# probleme de traducere a pachetelor ce declanșează fals pozitive.
# allow: setează la true pentru a permite accesul în loc să fie kickați.
# disable-setbacks: păstrează alertele active dar dezactivează setbackurile pentru
#   acești jucători, evitând perturbarea jucătorilor legitimi.
via-proxy:
    allow: false
    disable-setbacks: true

# Atenuarea offset-ului de predicție între versiuni.
#
# Când ViaVersion este activ: instalat pe acest server sau pe un proxy:
# clienții cu o versiune Minecraft diferită folosesc formule fizice ușor diferite.
# ViaVersion traduce pachetele fidel dar nu poate compensa aceste diferențe numerice,
# cauzând mici offset-uri sistematice (~0.001–0.003 blocuri/tick) chiar și la
# jucătorii complet legitimi.
#
# Cu viaversion-attenuation activat, Void scade 0.005 din offset-ul brut de predicție
# pentru orice jucător a cărui versiune diferă de server. Cheaturile reale produc
# offset-uri de 0.01–1.0+ (cel puțin 2× toleranța), detecția rămâne intactă.
#
# Dezactivează doar dacă serverul tău rulează o singură versiune fără jucători
# cross-version și dorești pragul de detecție cel mai strict posibil.
viaversion-attenuation: false

# Atenuarea specifica elytra a offset-ului de predictie pentru jucatorii cross-version.
#
# Fizica elytra (planare) difera mai semnificativ intre versiunile Minecraft decat miscarea
# normala - rezistenta aerodinamica, scalarea directiei de privire si acumularea vitezei
# per tick difera intre versiuni. Cu ViaVersion activ, un jucator legitim care planeaza
# cu elytra poate produce offset-uri brute de pana la ~0.032 blocuri/tick, mult peste
# ~0.001-0.003 la miscarea normala.
#
# Cand este activat, Void aplica o atenuare suplimentara de 0.03 (pe langa
# viaversion-attenuation) pentru jucatori cross-version in timp ce planeaza sau imediat
# dupa aterizare. Exploatarile reale de elytra produc offset-uri de 0.1+ (de 3x toleranta
# suplimentara), deci detectia ramane complet intacta.
#
# Activeaza daca vezi fals pozitive Simulation la jucatori cross-version cu elytra.
# Nu are efect daca viaversion-attenuation nu este activat.
viaversion-elytra-attenuation: false

client-brand:
    # Listă regex de clienți al căror brand este ignorat silențios.
    ignored-clients:
        - "^vanilla$"
        - "^fabric$"
        - "^quilt$"
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4},(?:fabric|forge)$"
        - "^Feather Fabric$"
        - "^labymod$"
    # Deconectează clienții Forge 1.18.2–1.19.3 cu reach hacks integrate.
    disconnect-blacklisted-forge-versions: true

spectators:
    # Ascunde spectatorii cu permisiunea void.spectator chiar dacă nu spectează activ.
    hide-regardless: false
    # Restrânge ascunderea la lumi specifice. Gol = toate lumile.
    allowed-worlds:
        - ""

# Secunde înainte de a kicca un jucător care nu mai răspunde.
max-transaction-time: 60

# Cheie API Pastebin pentru /void debug. Gol = salvare locală.
pastebin-api-key: ""

# Verificări

Simulation:
    setback-decay-multiplier: 0.999
    threshold: 0.001
    immediate-setback-threshold: 0.1
    max-advantage: 1
    max-ceiling: 4
    setback-violation-threshold: 1

Knockback:
    setback-decay-multiplier: 0.999
    threshold: 0.001
    immediate-setback-threshold: 0.1
    max-advantage: 1
    max-ceiling: 4

Explosion:
    threshold: 0.001
    setbackvl: 3

Phase:
    setbackvl: 1
    decay: 0.005

NoSlow:
    threshold: 0.001
    setbackvl: 5
    decay: 0.05

Reach:
    threshold: 0.0005
    block-impossible-hits: true
    enable-post-packet: false

AutoClickerA:
    # Hard CPS cap. No human technique sustains above 30 CPS long-term.
    # Raise only if you host drag-click tournaments; do not lower below 25.
    max-cps: 30
    # Minimum CPS before interval regularity analysis kicks in.
    analysis-cps: 8
    # Minimum interval Coefficient of Variation. Autoclickers: 0.00-0.02. Humans: 0.08+.
    # 0.05 is well below every documented human technique; false flags are essentially impossible.
    min-cv: 0.05

AutoClickerB:
    # Minimum mean CPS across 1-second buckets before analysis runs.
    analysis-cps: 8
    # Minimum bucket-CV (std_dev/mean of per-second CPS). Randomized autoclickers: 0.04-0.08.
    # Human butterfly/jitter even at peak CPS: typically 0.15+.
    # 0.10 is the safe middle ground: catches bots, cannot false flag legitimate players.
    min-bucket-cv: 0.10

AutoClickerC:
    # Vanilla clients send at most 1 attack per tick. Keep at 1.
    max-attacks-per-tick: 1
    # Consecutive ticks with too many attacks before flagging.
    # 3 absorbs rare ViaVersion packet reordering without missing real violations.
    min-consecutive-ticks: 3

TimerA:
    setbackvl: 10
    drift: 120

TimerLimit:
    ping-abuse-limit-threshold: 1000

NegativeTimer:
    drift: 1200

VehicleTimer:
    setbackvl: 10

AirLiquidPlace:
    cancelvl: 0

FabricatedPlace:
    cancelvl: 5

FarPlace:
    cancelvl: 5

PositionPlace:
    cancelvl: 5

RotationPlace:
    cancelvl: 5

PacketOrderI:
    # Activează dacă jucătorii cu moduri de animație 1.7 sunt marcați greșit.
    exempt-placing-while-digging: false

exploit:
    allow-sprint-jumping-when-using-elytra: true
    allow-building-on-ghostblocks: true
    distance-to-check-if-ghostblocks: 2

    auto-totem:
        autopunish:
            enabled: false
            action: ban
            duration: "1d"
            reason: |
                &cAutoTotem detectat.
                &7Check: &f%check_name% &8(&dVL %vl%&8)
            # Dacă true, comanda de mai jos este executată prin consolă în loc de banul intern.
            prefer-custom-ban: false
            # Șablon comandă. Marcatori: {player}  {duration}  {reason}
            # LiteBans:    "litebans:tempban {player} {duration} {reason}"
            # AdvancedBan: "ban {player} {reason} -t {duration}"
            # EssentialsX: "ban {player} {reason}"
            custom-ban-command: "litebans:tempban {player} {duration} {reason}"

# Pedepse

punishments:

    auto-punish:
        enabled: false
        threshold: 10
        action: ban
        duration: "7d"
        reason: |
            &5VoidAC
            &cCont Suspendat
            &7Ban ID: &d%ban_id%
            &7Durată: &f%duration%
        support-link: ""
        broadcast-message: "&8[&5Void&8] &f%player% &ca fost banat &7pentru joc neloial."
        # Dacă true, comanda de mai jos este executată prin consolă în loc de banul intern.
        prefer-custom-ban: false
        # Șablon comandă. Marcatori: {player}  {duration}  {reason}
        # LiteBans:    "litebans:tempban {player} {duration} {reason}"
        # AdvancedBan: "ban {player} {reason} -t {duration}"
        # EssentialsX: "ban {player} {reason}"
        custom-ban-command: "litebans:tempban {player} {duration} {reason}"

    manual-punish:
        duration: "7d"
        reason: |
            &5VoidAC
            &cCont Suspendat
            &7Banat de: &f{issued_by}
            &7Ban ID: &d{ban_id}
            &7Durată: &f{duration}
        prefer-custom-ban: false
        custom-ban-command: "litebans:tempban {player} {duration} {reason}"

# Valul de Banuri
# /void banwave add <player> [duration] : adaugă în coadă
# /void banwave execute                 : banează pe toți acum

ban-wave:
    enabled: true
    queue-on-auto-punish: false
    auto-execute-days: 7
    duration: "7d"
    reason: |
        &5VoidAC
        &cCont Suspendat
        &7Valul de Banuri: &d#{wave}
        &7Ban ID: &d{ban_id}
        &7Durată: &f{duration}
    broadcast: "&8[&5Void&8] &7Valul de Banuri &d#{wave} &7executat: &d{count} &7cheateri eliminați."
    prefer-custom-ban: false
    # Șablon comandă. Marcatori: {player}  {duration}  {reason}
    # LiteBans:    "litebans:tempban {player} {duration} {reason}"
    # AdvancedBan: "ban {player} {reason} -t {duration}"
    custom-ban-command: "litebans:tempban {player} {duration} {reason}"

# Storage ESP Decoys

storage-esp-decoys:
    enabled: false
    decoys-per-chunk: 20
    include-client-side-blocks: false
    auto-flag-threshold: 16

