# General

alerts:
    # Enviar alertas de violación también a la consola además del staff en línea.
    print-to-console: true
    proxy:
        # Reenviar alertas a otros servidores del proxy (BungeeCord/Velocity).
        send: false
        receive: false

verbose:
    print-to-console: false

experimental-checks: false

# Los jugadores que se conectan a través de un proxy con ViaVersion instalado pueden
# causar problemas de traducción de paquetes que generen falsos positivos.
# allow: establece en true para permitir el acceso en lugar de expulsarlos.
# disable-setbacks: mantiene las alertas activas pero deshabilita los setbacks para
#   estos jugadores, evitando interrumpir a los jugadores legítimos.
via-proxy:
    allow: false
    disable-setbacks: true

# Atenuación del offset de predicción entre versiones.
#
# Cuando ViaVersion está activo: instalado en este servidor o en un proxy:
# los clientes con una versión de Minecraft diferente usan fórmulas físicas ligeramente
# distintas. ViaVersion traduce paquetes fielmente pero no puede compensar estas
# diferencias numéricas, causando pequeños offsets sistemáticos (~0.001-0.003 bloques/tick)
# incluso en jugadores completamente legítimos.
#
# Con viaversion-attenuation habilitado, Void resta 0.005 del offset bruto de predicción
# para los jugadores cuya versión difiere del servidor. Los speed hacks y fly hacks
# producen offsets de 0.01-1.0+ (al menos 2× la tolerancia), la detección no se ve afectada.
#
# Deshabilita solo si tu servidor usa una única versión sin jugadores cross-version
# y quieres recuperar el umbral de detección más ajustado posible.
viaversion-attenuation: false

# Atenuacion especifica de elytra para jugadores cross-version.
#
# La fisica del elytra (planeo) diverge mas entre versiones de Minecraft que el movimiento
# normal - resistencia aerodinamica, escalado de direccion de vista y acumulacion de
# velocidad por tick difieren entre versiones. Con ViaVersion activo, un jugador legitimo
# planeando con elytra puede producir offsets brutos de hasta ~0.032 bloques/tick, muy
# por encima de los ~0.001-0.003 del movimiento normal.
#
# Cuando esta activado, Void aplica una atenuacion extra de 0.03 (ademas de
# viaversion-attenuation) para jugadores cross-version mientras planean o justo despues
# de aterrizar. Los exploits reales de elytra producen offsets de 0.1+ (3x la tolerancia
# extra), por lo que la deteccion permanece intacta.
#
# Activa si ves falsos positivos de Simulation en jugadores cross-version usando elytra.
# No tiene efecto si viaversion-attenuation no esta activado.
viaversion-elytra-attenuation: false

client-brand:
    # Lista de regex de clientes cuya marca se ignora silenciosamente y no se transmite a los ops.
    ignored-clients:
        - "^vanilla$"
        - "^fabric$"
        - "^quilt$"
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4},(?:fabric|forge)$"
        - "^Feather Fabric$"
        - "^labymod$"
    # Desconectar clientes Forge 1.18.2-1.19.3 que incluyen reach hacks integrados.
    disconnect-blacklisted-forge-versions: true

spectators:
    # Ocultar espectadores con permiso void.spectator aunque no estén espectando activamente.
    hide-regardless: false
    # Restringir el ocultamiento de espectadores a mundos específicos. Vacío = todos.
    allowed-worlds:
        - ""

# Segundos antes de expulsar a un jugador que deja de responder.
max-transaction-time: 60

# Clave API de Pastebin para /void debug. Dejar vacío para guardar logs localmente.
pastebin-api-key: ""

# Checks

Simulation:
    setback-decay-multiplier: 0.999
    threshold: 0.001
    immediate-setback-threshold: 0.1
    max-advantage: 1
    max-ceiling: 4
    setback-violation-threshold: 1

Knockback:
    setback-decay-multiplier: 0.999
    threshold: 0.001
    immediate-setback-threshold: 0.1
    max-advantage: 1
    max-ceiling: 4

Explosion:
    threshold: 0.001
    setbackvl: 3

Phase:
    setbackvl: 1
    decay: 0.005

NoSlow:
    threshold: 0.001
    setbackvl: 5
    decay: 0.05

Reach:
    threshold: 0.0005
    block-impossible-hits: true
    enable-post-packet: false

AutoClickerA:
    # Hard CPS cap. No human technique sustains above 30 CPS long-term.
    # Raise only if you host drag-click tournaments; do not lower below 25.
    max-cps: 30
    # Minimum CPS before interval regularity analysis kicks in.
    analysis-cps: 8
    # Minimum interval Coefficient of Variation. Autoclickers: 0.00-0.02. Humans: 0.08+.
    # Keep this low. Clicks only ever land on tick boundaries, so an honest player
    # already looks flatter than they really are, and raising it bans them.
    min-cv: 0.05

AutoClickerB:
    # Minimum mean CPS across 1-second buckets before analysis runs.
    analysis-cps: 8
    # Minimum bucket-CV (std_dev/mean of per-second CPS). Randomized autoclickers: 0.04-0.08.
    # Human butterfly/jitter even at peak CPS: typically 0.15+.
    # 0.10 is the safe middle ground: catches bots, cannot false flag legitimate players.
    min-bucket-cv: 0.10

AutoClickerC:
    # Vanilla clients send at most 1 attack per tick. Keep at 1.
    max-attacks-per-tick: 1
    # Consecutive ticks with too many attacks before flagging.
    # 3 absorbs rare ViaVersion packet reordering without missing real violations.
    min-consecutive-ticks: 3

TimerA:
    setbackvl: 10
    drift: 120

TimerLimit:
    ping-abuse-limit-threshold: 1000

NegativeTimer:
    drift: 1200

VehicleTimer:
    setbackvl: 10

AirLiquidPlace:
    cancelvl: 0

FabricatedPlace:
    cancelvl: 5

FarPlace:
    cancelvl: 5

PositionPlace:
    cancelvl: 5

RotationPlace:
    cancelvl: 5

PacketOrderI:
    # Activar si jugadores con mods de animación 1.7 son marcados incorrectamente.
    exempt-placing-while-digging: false

exploit:
    allow-sprint-jumping-when-using-elytra: true
    allow-building-on-ghostblocks: true
    distance-to-check-if-ghostblocks: 2

    auto-totem:
        autopunish:
            enabled: false
            action: ban
            duration: "1d"
            reason: |
                &cAutoTotem detectado.
                &7Check: &f%check_name% &8(&dVL %vl%&8)
            # Si es true, el comando de abajo se ejecuta por consola en lugar del ban interno.
            prefer-custom-ban: false
            # Plantilla de comando. Marcadores: {player}  {duration}  {reason}
            # LiteBans:    "litebans:tempban {player} {duration} {reason}"
            # AdvancedBan: "ban {player} {reason} -t {duration}"
            # EssentialsX: "ban {player} {reason}"
            custom-ban-command: "litebans:tempban {player} {duration} {reason}"

# Castigos

punishments:

    auto-punish:
        enabled: false
        # Violaciones que UN SOLO check debe alcanzar antes de que Void actue (no la suma de todos).
        # Se usa para cualquier check sin anulacion en la seccion thresholds de abajo.
        threshold: 100
        # Anulaciones por check, por nombre de check.
        # Los checks no marcan al mismo ritmo, asi que no pueden compartir un solo umbral.
        # Simulation en particular acumula violaciones en jugadores totalmente legitimos
        # (lag, casos limite, ticks perdidos). Banear tras unos pocos flags de Simulation
        # eliminara jugadores legitimos. Sube el valor si ves baneos falsos; nunca lo bajes.
        thresholds:
            Simulation: 200
            GroundSpoof: 150
            NoFall: 150
            Timer: 100
            Knockback: 80
            Explosion: 80
            NoSlow: 80
            Post: 80
            Reach: 25
            Hitboxes: 25
        action: ban
        duration: "7d"
        reason: |
            &5VoidAC
            &cCuenta Suspendida
            &7Ban ID: &d%ban_id%
            &7Duración: &f%duration%
        support-link: ""
        broadcast-message: "&8[&5Void&8] &f%player% &cfue baneado &7por juego deshonesto."
        # Si es true, el comando de abajo se ejecuta por consola en lugar del ban interno.
        prefer-custom-ban: false
        # Plantilla de comando. Marcadores: {player}  {duration}  {reason}
        # LiteBans:    "litebans:tempban {player} {duration} {reason}"
        # AdvancedBan: "ban {player} {reason} -t {duration}"
        # EssentialsX: "ban {player} {reason}"
        custom-ban-command: "litebans:tempban {player} {duration} {reason}"

    manual-punish:
        duration: "7d"
        reason: |
            &5VoidAC
            &cCuenta Suspendida
            &7Baneado por: &f{issued_by}
            &7Ban ID: &d{ban_id}
            &7Duración: &f{duration}
        prefer-custom-ban: false
        custom-ban-command: "litebans:tempban {player} {duration} {reason}"

# Ola de Bans
# /void banwave add <player> [duration] : añadir a la cola
# /void banwave execute                 : banear a todos ahora

ban-wave:
    enabled: true
    queue-on-auto-punish: false
    auto-execute-days: 7
    duration: "7d"
    reason: |
        &5VoidAC
        &cCuenta Suspendida
        &7Ola de Bans: &d#{wave}
        &7Ban ID: &d{ban_id}
        &7Duración: &f{duration}
    broadcast: "&8[&5Void&8] &7Ola de Bans &d#{wave} &7ejecutada: &d{count} &7jugadores eliminados."
    prefer-custom-ban: false
    # Plantilla de comando. Marcadores: {player}  {duration}  {reason}
    # LiteBans:    "litebans:tempban {player} {duration} {reason}"
    # AdvancedBan: "ban {player} {reason} -t {duration}"
    custom-ban-command: "litebans:tempban {player} {duration} {reason}"

# Storage ESP Decoys

storage-esp-decoys:
    enabled: false
    decoys-per-chunk: 20
    include-client-side-blocks: false
    auto-flag-threshold: 16

