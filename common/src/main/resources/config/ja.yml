# 一般設定

alerts:
    # 違反アラートをオンラインスタッフだけでなくコンソールにも送信する。
    print-to-console: true
    proxy:
        # プロキシの他のサーバーにアラートを転送する (BungeeCord/Velocity)。
        send: false
        receive: false

verbose:
    print-to-console: false

experimental-checks: false

# ViaVersionがインストールされたプロキシ経由で接続するプレイヤーは、
# パケット変換の問題により誤検知が発生することがあります。
# allow: trueに設定するとキックせず接続を許可します。
# disable-setbacks: アラートを維持しつつ、これらのプレイヤーへのセットバックを無効化します。
via-proxy:
    allow: false
    disable-setbacks: true

# バージョン間予測オフセット減衰。
#
# ViaVersionが有効な場合（このサーバーまたはプロキシにインストール済み）、
# サーバーと異なるバージョンのクライアントは物理計算式が微妙に異なります。
# ViaVersionはパケットを忠実に変換しますが、この数値差を補正できないため、
# 正当なプレイヤーでも一定の小さなオフセット（~0.001-0.003ブロック/tick）が発生します。
#
# viaversion-attenuationを有効にすると、バージョンが異なるプレイヤーの予測オフセットから
# 0.005を差し引きます。実際のチートは0.01-1.0+のオフセットを生成します（許容値の2倍以上）。
#
# サーバーが単一バージョンのみで運用されており、クロスバージョンプレイヤーがいない場合のみ
# 無効化してください。
viaversion-attenuation: false

# クロスバージョンプレイヤー向けのエリトラ専用予測オフセット減衰。
#
# エリトラ（グライド）の物理は通常の移動よりもMinecraftバージョン間で大きく異なります
#: 空気抵抗、視線方向のスケーリング、ティックごとの速度蓄積がバージョン間で異なります。
# ViaVersionが有効な場合、エリトラで滑空している正規プレイヤーは生予測オフセットが
# 最大~0.032ブロック/ティックになることがあり、通常移動の~0.001-0.003を大きく上回ります。
#
# 有効にすると、Voidはグライド中またはグライド直後のクロスバージョンプレイヤーに
# 追加で0.03の減衰を適用します（viaversion-attenuationに加えて）。
# 実際のエリトラエクスプロイトは0.1以上のオフセットを生成するため、検出は機能し続けます。
#
# クロスバージョンプレイヤーがエリトラ使用中にSimulationの誤検知が発生する場合に有効化。
# viaversion-attenuationが有効でない場合は効果がありません。
viaversion-elytra-attenuation: false

client-brand:
    # 無視するクライアントブランドの正規表現リスト（OPに通知しない）。
    ignored-clients:
        - "^vanilla$"
        - "^fabric$"
        - "^quilt$"
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4},(?:fabric|forge)$"
        - "^Feather Fabric$"
        - "^labymod$"
    # 内蔵リーチハックを持つForge 1.18.2-1.19.3クライアントを切断する。
    disconnect-blacklisted-forge-versions: true

spectators:
    # void.spectatorパーミッションを持つ観戦者を常に非表示にする。
    hide-regardless: false
    # 観戦者を非表示にするワールドを指定。空白=全ワールド。
    allowed-worlds:
        - ""

# キープアライブに応答しなくなったプレイヤーをキックするまでの秒数。
max-transaction-time: 60

# /void debug アップロード用PastebinaAPIキー。空白でローカル保存。
pastebin-api-key: ""

# チェック

Simulation:
    setback-decay-multiplier: 0.999
    threshold: 0.001
    immediate-setback-threshold: 0.1
    max-advantage: 1
    max-ceiling: 4
    setback-violation-threshold: 1

Knockback:
    setback-decay-multiplier: 0.999
    threshold: 0.001
    immediate-setback-threshold: 0.1
    max-advantage: 1
    max-ceiling: 4

Explosion:
    threshold: 0.001
    setbackvl: 3

Phase:
    setbackvl: 1
    decay: 0.005

NoSlow:
    threshold: 0.001
    setbackvl: 5
    decay: 0.05

Reach:
    threshold: 0.0005
    block-impossible-hits: true
    enable-post-packet: false

AutoClickerA:
    # Hard CPS cap. No human technique sustains above 30 CPS long-term.
    # Raise only if you host drag-click tournaments; do not lower below 25.
    max-cps: 30
    # Minimum CPS before interval regularity analysis kicks in.
    analysis-cps: 8
    # Minimum interval Coefficient of Variation. Autoclickers: 0.00-0.02. Humans: 0.08+.
    # Keep this low. Clicks only ever land on tick boundaries, so an honest player
    # already looks flatter than they really are, and raising it bans them.
    min-cv: 0.05

AutoClickerB:
    # Minimum mean CPS across 1-second buckets before analysis runs.
    analysis-cps: 8
    # Minimum bucket-CV (std_dev/mean of per-second CPS). Randomized autoclickers: 0.04-0.08.
    # Human butterfly/jitter even at peak CPS: typically 0.15+.
    # 0.10 is the safe middle ground: catches bots, cannot false flag legitimate players.
    min-bucket-cv: 0.10

AutoClickerC:
    # Vanilla clients send at most 1 attack per tick. Keep at 1.
    max-attacks-per-tick: 1
    # Consecutive ticks with too many attacks before flagging.
    # 3 absorbs rare ViaVersion packet reordering without missing real violations.
    min-consecutive-ticks: 3

TimerA:
    setbackvl: 10
    drift: 120

TimerLimit:
    ping-abuse-limit-threshold: 1000

NegativeTimer:
    drift: 1200

VehicleTimer:
    setbackvl: 10

AirLiquidPlace:
    cancelvl: 0

FabricatedPlace:
    cancelvl: 5

FarPlace:
    cancelvl: 5

PositionPlace:
    cancelvl: 5

RotationPlace:
    cancelvl: 5

PacketOrderI:
    # 1.7アニメーションModを使用しているプレイヤーが誤検知される場合に有効化。
    exempt-placing-while-digging: false

exploit:
    allow-sprint-jumping-when-using-elytra: true
    allow-building-on-ghostblocks: true
    distance-to-check-if-ghostblocks: 2

    auto-totem:
        autopunish:
            enabled: false
            action: ban
            duration: "1d"
            reason: |
                &cAutoTotemが検出されました。
                &7Check: &f%check_name% &8(&dVL %vl%&8)
            # trueの場合、内部banの代わりに以下のコマンドをコンソールで実行します。
            prefer-custom-ban: false
            # コマンドテンプレート。プレースホルダー: {player}  {duration}  {reason}
            # LiteBans:    "litebans:tempban {player} {duration} {reason}"
            # AdvancedBan: "ban {player} {reason} -t {duration}"
            # EssentialsX: "ban {player} {reason}"
            custom-ban-command: "litebans:tempban {player} {duration} {reason}"

# 処罰

punishments:

    auto-punish:
        enabled: false
        # Voidが動作する前に「単一の」チェックが到達すべき違反数（全チェックの合計ではありません）。
        # 下の thresholds セクションに設定がないチェックに使用されます。
        threshold: 100
        # チェックごとの上書き設定（チェック名で指定）。
        # チェックごとに検知頻度が異なるため、1つのしきい値を共有してはいけません。
        # 特に Simulation は完全に正当なプレイヤーでも違反が蓄積します
        # （ラグ、境界ケース、ティックスキップ）。少数の Simulation フラグでBANすると
        # 正当なプレイヤーが処罰されます。誤BANが出たら値を上げてください。決して下げないこと。
        thresholds:
            Simulation: 200
            GroundSpoof: 150
            NoFall: 150
            Timer: 100
            Knockback: 80
            Explosion: 80
            NoSlow: 80
            Post: 80
            Reach: 25
            Hitboxes: 25
        action: ban
        duration: "7d"
        reason: |
            &5VoidAC
            &cアカウント停止
            &7BAN ID: &d%ban_id%
            &7期間: &f%duration%
        support-link: ""
        broadcast-message: "&8[&5Void&8] &f%player% &cが不正行為のためBANされました。"
        # trueの場合、内部banの代わりに以下のコマンドをコンソールで実行します。
        prefer-custom-ban: false
        # コマンドテンプレート。プレースホルダー: {player}  {duration}  {reason}
        # LiteBans:    "litebans:tempban {player} {duration} {reason}"
        # AdvancedBan: "ban {player} {reason} -t {duration}"
        # EssentialsX: "ban {player} {reason}"
        custom-ban-command: "litebans:tempban {player} {duration} {reason}"

    manual-punish:
        duration: "7d"
        reason: |
            &5VoidAC
            &cアカウント停止
            &7BANした人: &f{issued_by}
            &7BAN ID: &d{ban_id}
            &7期間: &f{duration}
        prefer-custom-ban: false
        custom-ban-command: "litebans:tempban {player} {duration} {reason}"

# BAN WAVE
# /void banwave add <player> [duration] : キューに追加
# /void banwave execute                 : 今すぐ全員BAN

ban-wave:
    enabled: true
    queue-on-auto-punish: false
    auto-execute-days: 7
    duration: "7d"
    reason: |
        &5VoidAC
        &cアカウント停止
        &7BAN WAVE: &d#{wave}
        &7BAN ID: &d{ban_id}
        &7期間: &f{duration}
    broadcast: "&8[&5Void&8] &7BAN WAVE &d#{wave} &7実行完了: &d{count} &7人のプレイヤーが削除されました。"
    prefer-custom-ban: false
    # コマンドテンプレート。プレースホルダー: {player}  {duration}  {reason}
    # LiteBans:    "litebans:tempban {player} {duration} {reason}"
    # AdvancedBan: "ban {player} {reason} -t {duration}"
    custom-ban-command: "litebans:tempban {player} {duration} {reason}"

# Storage ESP Decoys

storage-esp-decoys:
    enabled: false
    decoys-per-chunk: 20
    include-client-side-blocks: false
    auto-flag-threshold: 16

# Anti-Xray

AntiXray:
    configure-paper: false
    engine-mode: 2
    max-block-height: 320
    update-radius: 16
    hidden-blocks:
        - air
        - copper_ore
        - deepslate_copper_ore
        - raw_copper_block
        - iron_ore
        - deepslate_iron_ore
        - gold_ore
        - deepslate_gold_ore
        - diamond_ore
        - deepslate_diamond_ore
        - emerald_ore
        - deepslate_emerald_ore
        - lapis_ore
        - deepslate_lapis_ore
        - redstone_ore
        - deepslate_redstone_ore
        - coal_ore
        - deepslate_coal_ore
        - nether_quartz_ore
        - nether_gold_ore
        - ancient_debris
        - chest
        - trapped_chest
        - barrel
        - ender_chest
        - shulker_box
        - white_shulker_box
        - orange_shulker_box
        - magenta_shulker_box
        - light_blue_shulker_box
        - yellow_shulker_box
        - lime_shulker_box
        - pink_shulker_box
        - gray_shulker_box
        - light_gray_shulker_box
        - cyan_shulker_box
        - purple_shulker_box
        - blue_shulker_box
        - brown_shulker_box
        - green_shulker_box
        - red_shulker_box
        - black_shulker_box
    replacement-blocks:
        - stone
        - deepslate
        - granite
        - diorite
        - andesite
        - dirt
        - gravel
        - tuff
        - calcite
        - smooth_basalt
        - coal_ore
        - deepslate_coal_ore

# 閾値オプティマイザー

threshold-optimizer:
    enabled: false

# 詳細設定

packet-spam-threshold: 100
debug-packet-cancel: false

max-ping-out-of-flying: 1000
max-ping-firework-boost: 1000

disable-pong-cancelling: false
disable-default-resync-handler: false

cancel-duplicate-packet: true
ignore-duplicate-packet-rotation: false

reset-item-usage-on-item-update: true
reset-item-usage-on-attack: true
reset-item-usage-on-slot-change: true
reset-item-usage-on-item-use: true

debug-pipeline-on-join: false


# Diagnostic Logger
# WARNING: Extremely high CPU and disk I/O cost. Never enable on a production server.
# Enable only on a private test server to collect movement data for engine research.
# Writes one structured log block per prediction tick per player to plugins/Void/diagnostic/.
# Use the logs to distinguish false flags (lerp/slime/edge=Y) from real cheats (all N, offset >> threshold).

diagnostic-logger:
    enabled: false
    # Async write queue depth. Entries are dropped (oldest first) when full.
    queue-capacity: 4096
config-flavor: V2
config-version: 22
