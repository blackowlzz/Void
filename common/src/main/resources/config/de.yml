# Allgemein

alerts:
    # Warnungen zusätzlich zur Ausgabe an Online-Staff auch in der Konsole anzeigen.
    print-to-console: true
    proxy:
        # Warnungen an andere Proxy-Server weiterleiten (BungeeCord/Velocity).
        # Erfordert bungee-plugin-message-channel in der Velocity-Konfiguration.
        send: false
        receive: false

verbose:
    print-to-console: false

experimental-checks: false

# Spieler, die sich über einen Proxy mit ViaVersion verbinden, können Paketübersetzungsprobleme
# verursachen, die Fehlalarme auslösen.
# allow: auf true setzen, um sie einzulassen statt zu kicken.
# disable-setbacks: Alerts bleiben aktiv, Setbacks werden für diese Spieler deaktiviert.
via-proxy:
    allow: false
    disable-setbacks: true

# Versionsübergreifende Vorhersage-Offset-Dämpfung.
#
# Wenn ViaVersion aktiv ist: auf diesem Server oder einem Proxy installiert:
# verwenden Clients mit einer anderen Minecraft-Version leicht abweichende Physikformeln.
# ViaVersion übersetzt Pakete korrekt, kann diese numerischen Unterschiede jedoch nicht
# ausgleichen, was zu kleinen systematischen Offsets (~0.001-0.003 Blöcke/Tick) führt,
# selbst bei vollständig legitimen Spielern.
#
# Mit aktiviertem viaversion-attenuation zieht Void 0.005 vom Roh-Vorhersage-Offset
# für Spieler mit einer abweichenden Version ab. Speed- und Fly-Hacks erzeugen Offsets
# von 0.01-1.0+ (mindestens 2× die Toleranz), die Erkennung bleibt unberührt.
#
# Deaktiviere nur, wenn dein Server eine einzige Version ohne Cross-Version-Spieler
# betreibt und du die strengste mögliche Erkennungsschwelle nutzen möchtest.
viaversion-attenuation: false

# Elytra-spezifische Vorhersage-Offset-Daempfung fuer Cross-Version-Spieler.
#
# Die Elytra-Physik (Gleiten) weicht zwischen Minecraft-Versionen staerker ab als normale
# Bewegungen - aerodynamischer Widerstand, Blickrichtungsskalierung und die per-Tick
# Geschwindigkeitsakkumulation unterscheiden sich zwischen Versionen. Mit aktivem ViaVersion
# kann ein legitimer Spieler, der mit der Elytra gleitet, rohe Vorhersage-Offsets bis zu
# ~0.032 Bloecke/Tick erzeugen, weit ueber den ~0.001-0.003 bei normaler Bewegung.
#
# Wenn aktiviert, wendet Void eine zusaetzliche Daempfung von 0.03 an (zusaetzlich zu
# viaversion-attenuation) fuer Cross-Version-Spieler waehrend des Gleitens oder direkt
# nach der Landung. Echte Elytra-Exploits erzeugen Offsets von 0.1+, die Erkennung
# bleibt also vollstaendig intakt.
#
# Aktivieren, wenn Simulation-Falschmeldungen bei Cross-Version-Spielern mit Elytra auftreten.
# Hat keine Wirkung, wenn viaversion-attenuation nicht aktiviert ist.
viaversion-elytra-attenuation: false

client-brand:
    # Regex-Liste von Clients, deren Brand stillschweigend ignoriert und nicht an Ops übermittelt wird.
    ignored-clients:
        - "^vanilla$"
        - "^fabric$"
        - "^quilt$"
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4},(?:fabric|forge)$"
        - "^Feather Fabric$"
        - "^labymod$"
    # Forge 1.18.2-1.19.3 trennen; diese Versionen enthalten eingebaute Reach-Hacks.
    disconnect-blacklisted-forge-versions: true

spectators:
    # Zuschauer mit void.spectator-Berechtigung auch dann verstecken, wenn sie nicht aktiv zuschauen.
    hide-regardless: false
    # Zuschauer nur in diesen Welten verstecken. Leer lassen für alle Welten.
    allowed-worlds:
        - ""

# Sekunden bis ein Spieler wegen Zeitüberschreitung gekickt wird.
max-transaction-time: 60

# Pastebin-API-Schlüssel für /void debug. Leer lassen, um Logs lokal zu speichern.
pastebin-api-key: ""

# Checks

Simulation:
    # Abbaumultiplikator für akkumulierten Vorteil bei legitimem Spieler.
    setback-decay-multiplier: 0.999
    # Mindestversatz für eine Verletzung. Niedriger = strenger.
    threshold: 0.001
    # Versatz in einem Tick, der sofortigen Setback auslöst. -1 zum Deaktivieren.
    immediate-setback-threshold: 0.1
    # Gesamtvorteil bevor Setbacks beginnen. -1 zum Deaktivieren.
    max-advantage: 1
    # Harte Obergrenze für akkumulierten Vorteil.
    max-ceiling: 4
    setback-violation-threshold: 1

Knockback:
    setback-decay-multiplier: 0.999
    threshold: 0.001
    immediate-setback-threshold: 0.1
    max-advantage: 1
    max-ceiling: 4

Explosion:
    threshold: 0.001
    setbackvl: 3

Phase:
    setbackvl: 1
    decay: 0.005

NoSlow:
    threshold: 0.001
    setbackvl: 5
    decay: 0.05

Reach:
    # Hitbox-Erweiterung zur Reach-Erkennung. 0.0005 erkennt alles über 3.0005 Blöcke.
    threshold: 0.0005
    block-impossible-hits: true
    # Zusätzliches Paket pro Tick für bessere Reichweitenerkennung.
    # Erhöht Bandbreite leicht. Nur für 1.8-PvP-Server empfohlen.
    enable-post-packet: false

AutoClickerA:
    # Hard CPS cap. No human technique sustains above 30 CPS long-term.
    # Raise only if you host drag-click tournaments; do not lower below 25.
    max-cps: 30
    # Minimum CPS before interval regularity analysis kicks in.
    analysis-cps: 8
    # Minimum interval Coefficient of Variation. Autoclickers: 0.00-0.02. Humans: 0.08+.
    # Keep this low. Clicks only ever land on tick boundaries, so an honest player
    # already looks flatter than they really are, and raising it bans them.
    min-cv: 0.05

AutoClickerB:
    # Minimum mean CPS across 1-second buckets before analysis runs.
    analysis-cps: 8
    # Minimum bucket-CV (std_dev/mean of per-second CPS). Randomized autoclickers: 0.04-0.08.
    # Human butterfly/jitter even at peak CPS: typically 0.15+.
    # 0.10 is the safe middle ground: catches bots, cannot false flag legitimate players.
    min-bucket-cv: 0.10

AutoClickerC:
    # Vanilla clients send at most 1 attack per tick. Keep at 1.
    max-attacks-per-tick: 1
    # Consecutive ticks with too many attacks before flagging.
    # 3 absorbs rare ViaVersion packet reordering without missing real violations.
    min-consecutive-ticks: 3

TimerA:
    setbackvl: 10
    # Millisekunden Timer-Balance, die ein Spieler ansammeln kann.
    drift: 120

TimerLimit:
    # Ping-Schwellenwert ab dem der Timer-Balance-Begrenzer aktiv wird. -1 zum Deaktivieren.
    ping-abuse-limit-threshold: 1000

NegativeTimer:
    # Millisekunden Bewegungsdefizit vor Flagging. -1 zum Deaktivieren.
    drift: 1200

VehicleTimer:
    setbackvl: 10

AirLiquidPlace:
    cancelvl: 0

FabricatedPlace:
    cancelvl: 5

FarPlace:
    cancelvl: 5

PositionPlace:
    cancelvl: 5

RotationPlace:
    cancelvl: 5

PacketOrderI:
    # Aktivieren, wenn Spieler mit 1.7-Animationsmods fälschlicherweise gemeldet werden.
    exempt-placing-while-digging: false

exploit:
    # Elytra-Sprint-Jump-Geschwindigkeitsexploit verhindern.
    allow-sprint-jumping-when-using-elytra: true
    # Spieler resynchronisieren, wenn er auf Geisterblöcken baut.
    allow-building-on-ghostblocks: true
    # Prüfabstand für Geisterblöcke. Gültiger Bereich: 2-4.
    distance-to-check-if-ghostblocks: 2

    auto-totem:
        autopunish:
            enabled: false
            # kick oder ban
            action: ban
            duration: "1d"
            # Platzhalter: %check_name%  %vl%
            reason: |
                &cAutoTotem erkannt.
                &7Check: &f%check_name% &8(&dVL %vl%&8)
            # Wenn true, wird der folgende Befehl per Konsole ausgeführt statt dem internen Bann.
            prefer-custom-ban: false
            # Befehlsvorlage. Platzhalter: {player}  {duration}  {reason}
            # LiteBans:    "litebans:tempban {player} {duration} {reason}"
            # AdvancedBan: "ban {player} {reason} -t {duration}"
            # EssentialsX: "ban {player} {reason}"
            custom-ban-command: "litebans:tempban {player} {duration} {reason}"

# Bestrafungen

punishments:

    auto-punish:
        enabled: false
        # Violations, die EIN EINZELNER Check erreichen muss, bevor Void handelt (nicht die Summe aller Checks).
        # Gilt fuer jeden Check ohne Eintrag im Abschnitt thresholds unten.
        threshold: 100
        # Ueberschreibungen pro Check, nach Check-Name.
        # Checks flaggen unterschiedlich haeufig und duerfen sich daher keinen Wert teilen.
        # Besonders Simulation sammelt Violations auch bei voellig legitimen Spielern
        # (Lag, Grenzfaelle, uebersprungene Ticks). Ein Bann nach wenigen Simulation-Flags
        # trifft echte Spieler. Wert erhoehen bei Falschbanns, nie unter den Alert-Wert senken.
        thresholds:
            Simulation: 200
            GroundSpoof: 150
            NoFall: 150
            Timer: 100
            Knockback: 80
            Explosion: 80
            NoSlow: 80
            Post: 80
            Reach: 25
            Hitboxes: 25
        # kick oder ban
        action: ban
        # Dauer: "7d", "30d", "24h", "permanent"
        duration: "7d"
        # Platzhalter: %check_name%  %vl%  %ban_id%  %date%  %duration%
        reason: |
            &5VoidAC
            &cKonto gesperrt
            &7Ban-ID: &d%ban_id%
            &7Dauer: &f%duration%
        support-link: ""
        broadcast-message: "&8[&5Void&8] &f%player% &cwurde gebannt &7wegen unfairen Spiels."
        # Wenn true, wird der folgende Befehl per Konsole ausgeführt statt dem internen Bann.
        prefer-custom-ban: false
        # Befehlsvorlage. Platzhalter: {player}  {duration}  {reason}
        # LiteBans:    "litebans:tempban {player} {duration} {reason}"
        # AdvancedBan: "ban {player} {reason} -t {duration}"
        # EssentialsX: "ban {player} {reason}"
        custom-ban-command: "litebans:tempban {player} {duration} {reason}"

    manual-punish:
        # Standard-Bann-Dauer für /void punish ohne Angabe.
        duration: "7d"
        # Platzhalter: {player}  {issued_by}  {duration}  {ban_id}  {date}
        reason: |
            &5VoidAC
            &cKonto gesperrt
            &7Gebannt von: &f{issued_by}
            &7Ban-ID: &d{ban_id}
            &7Dauer: &f{duration}
        # Wenn true, wird der folgende Befehl per Konsole ausgeführt statt dem internen Bann.
        prefer-custom-ban: false
        # Befehlsvorlage. Platzhalter: {player}  {duration}  {reason}
        custom-ban-command: "litebans:tempban {player} {duration} {reason}"

# Ban-Welle
# Spieler in eine Warteschlange stellen und alle auf einmal bannen.
# /void banwave add <player> [duration] : zur Warteschlange hinzufügen
# /void banwave execute                 : alle jetzt bannen

ban-wave:
    enabled: true
    queue-on-auto-punish: false
    # Tage zwischen automatischen Ausführungen. 0 = nur manuell.
    auto-execute-days: 7
    duration: "7d"
    # Platzhalter: {wave}  {player}  {check}  {ban_id}  {date}  {duration}
    reason: |
        &5VoidAC
        &cKonto gesperrt
        &7Ban-Welle: &d#{wave}
        &7Ban-ID: &d{ban_id}
        &7Dauer: &f{duration}
    # Platzhalter: {wave}  {count}
    broadcast: "&8[&5Void&8] &7Ban-Welle &d#{wave} &7ausgeführt: &d{count} &7Spieler entfernt."
    # Wenn true, wird der folgende Befehl per Konsole ausgeführt statt dem internen Bann.
    prefer-custom-ban: false
    # Befehlsvorlage. Platzhalter: {player}  {duration}  {reason}
    # LiteBans:    "litebans:tempban {player} {duration} {reason}"
    # AdvancedBan: "ban {player} {reason} -t {duration}"
    custom-ban-command: "litebans:tempban {player} {duration} {reason}"

# Storage ESP Decoys

storage-esp-decoys:
    # Gefälschte Storage-Blöcke senden, um ESP-Clients zu verwirren.
    enabled: false
    decoys-per-chunk: 20
    include-client-side-blocks: false
    auto-flag-threshold: 16

# Anti-Xray
# Konfiguriert Papers eingebautes Anti-Xray beim Start. Nur Paper-Server.
# Erfordert einen vollständigen Neustart.

AntiXray:
    configure-paper: false
    # 1 = Erze client-seitig ersetzen (schwächer). 2 = Fake-Blöcke senden (empfohlen).
    engine-mode: 2
    max-block-height: 320
    update-radius: 16
    hidden-blocks:
        - air
        - copper_ore
        - deepslate_copper_ore
        - raw_copper_block
        - iron_ore
        - deepslate_iron_ore
        - gold_ore
        - deepslate_gold_ore
        - diamond_ore
        - deepslate_diamond_ore
        - emerald_ore
        - deepslate_emerald_ore
        - lapis_ore
        - deepslate_lapis_ore
        - redstone_ore
        - deepslate_redstone_ore
        - coal_ore
        - deepslate_coal_ore
        - nether_quartz_ore
        - nether_gold_ore
        - ancient_debris
        - chest
        - trapped_chest
        - barrel
        - ender_chest
        - shulker_box
        - white_shulker_box
        - orange_shulker_box
        - magenta_shulker_box
        - light_blue_shulker_box
        - yellow_shulker_box
        - lime_shulker_box
        - pink_shulker_box
        - gray_shulker_box
        - light_gray_shulker_box
        - cyan_shulker_box
        - purple_shulker_box
        - blue_shulker_box
        - brown_shulker_box
        - green_shulker_box
        - red_shulker_box
        - black_shulker_box
    replacement-blocks:
        - stone
        - deepslate
        - granite
        - diorite
        - andesite
        - dirt
        - gravel
        - tuff
        - calcite
        - smooth_basalt
        - coal_ore
        - deepslate_coal_ore

# Schwellenwert-Optimierer
# Analysiert Live-Flags und schlägt sicherere Bestrafungsschwellen vor.
# Befehle: /void optimizer start | stop | status | save | discard

threshold-optimizer:
    enabled: false

# Erweitert

# Max. illegale Paket-Abbrüche/Sek. bevor der Spieler gekickt wird.
packet-spam-threshold: 100
debug-packet-cancel: false

# Max. Ping (ms) für nicht-fliegende Spieler. -1 zum Deaktivieren.
max-ping-out-of-flying: 1000
# Max. Ping (ms) bei aktivem Elytra-Feuerwerks-Boost. -1 zum Deaktivieren.
max-ping-firework-boost: 1000

# Verhindert, dass Void Pong-Pakete abbricht.
disable-pong-cancelling: false

# Deaktiviert den Standard-Block-Resync-Handler.
disable-default-resync-handler: false

# Doppelte Bewegungspakete von 1.17-1.20.5-Clients auf 1.8-Servern abbrechen.
cancel-duplicate-packet: true
ignore-duplicate-packet-rotation: false

# Item-Nutzungs-Tracking bei diesen Ereignissen zurücksetzen.
reset-item-usage-on-item-update: true
reset-item-usage-on-attack: true
reset-item-usage-on-slot-change: true
reset-item-usage-on-item-use: true

debug-pipeline-on-join: false


# Diagnostic Logger
# WARNING: Extremely high CPU and disk I/O cost. Never enable on a production server.
# Enable only on a private test server to collect movement data for engine research.
# Writes one structured log block per prediction tick per player to plugins/Void/diagnostic/.
# Use the logs to distinguish false flags (lerp/slime/edge=Y) from real cheats (all N, offset >> threshold).

diagnostic-logger:
    enabled: false
    # Async write queue depth. Entries are dropped (oldest first) when full.
    queue-capacity: 4096
config-flavor: V2
config-version: 21
