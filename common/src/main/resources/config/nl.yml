        - deepslate_diamond_ore
        - emerald_ore
        - deepslate_emerald_ore
        - lapis_ore
        - deepslate_lapis_ore
        - redstone_ore
        - deepslate_redstone_ore
        - coal_ore
        - deepslate_coal_ore
        - nether_quartz_ore
        - nether_gold_ore
        - ancient_debris
        - chest
        - trapped_chest
        - barrel
        - ender_chest
        - shulker_box
        - white_shulker_box
        - orange_shulker_box
        - magenta_shulker_box
        - light_blue_shulker_box
        - yellow_shulker_box
        - lime_shulker_box
        - pink_shulker_box
        - gray_shulker_box
        - light_gray_shulker_box
        - cyan_shulker_box
        - purple_shulker_box
        - blue_shulker_box
        - brown_shulker_box
        - green_shulker_box
        - red_shulker_box
        - black_shulker_box
    replacement-blocks:
