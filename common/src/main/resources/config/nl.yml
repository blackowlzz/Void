# Drempeloptimalisator

threshold-optimizer:
    enabled: false

# Geavanceerd

packet-spam-threshold: 100
debug-packet-cancel: false

max-ping-out-of-flying: 1000
max-ping-firework-boost: 1000

disable-pong-cancelling: false
disable-default-resync-handler: false

cancel-duplicate-packet: true
ignore-duplicate-packet-rotation: false

reset-item-usage-on-item-update: true
reset-item-usage-on-attack: true
reset-item-usage-on-slot-change: true
reset-item-usage-on-item-use: true

debug-pipeline-on-join: false


# Diagnostic Logger
# WARNING: Extremely high CPU and disk I/O cost. Never enable on a production server.
# Enable only on a private test server to collect movement data for engine research.
# Writes one structured log block per prediction tick per player to plugins/Void/diagnostic/.
# Use the logs to distinguish false flags (lerp/slime/edge=Y) from real cheats (all N, offset >> threshold).

diagnostic-logger:
    enabled: false
    # Async write queue depth. Entries are dropped (oldest first) when full.
    queue-capacity: 4096
config-flavor: V2
config-version: 21
