# Algemeen

alerts:
    # Overtredingswaarschuwingen ook naar de console sturen naast online staff.
    print-to-console: true
    proxy:
        # Waarschuwingen doorsturen naar andere proxy-servers (BungeeCord/Velocity).
        send: false
        receive: false

verbose:
    print-to-console: false

experimental-checks: false

# Dedicated killaura detection (AimGcd, AimSnapReturn, AutoClickerD). Off by default, independent of experimental-checks.
# These checks are new and only tested against a few clients: they can false flag. Their flags are alert-only and never reach punishments.yml or auto-punish.
# Enable it on servers whose owners accept that risk. See docs/killaura-experimental.md.
killaura-dedicated-experimental-checks: false

# Toont Void-berichten in kleine hoofdletters (ᴠᴏɪᴅ-ѕᴛɪᴊʟ). Vereist een clientlettertype met deze tekens: zie je vakjes in plaats van letters, laat dit dan uit.
# Alleen bedoeld voor Engels: talen met accenten of niet-Latijnse schriften (Italiaans, Russisch, Chinees, ...) tonen gemengde of niet-gestileerde tekst, en staff met void.alerts krijgt 5 seconden na het joinen een waarschuwing in het spel.
small-caps: false

# Spelers die verbinding maken via een proxy met ViaVersion kunnen
# pakketvertaalproblemen veroorzaken die fout-positieven genereren.
# allow: stel in op true om ze toe te laten in plaats van te kicken.
# disable-setbacks: houdt alerts actief maar schakelt setbacks uit voor deze spelers.
via-proxy:
    allow: false
    disable-setbacks: true

viaproxy-warn-on-join: true

# Cross-versie voorspellings-offset demping.
#
# Wanneer ViaVersion actief is: geïnstalleerd op deze server of op een proxy:
# gebruiken clients met een andere Minecraft-versie licht afwijkende fysicaformules.
# ViaVersion vertaalt pakketten getrouw maar kan deze numerieke verschillen niet
# compenseren, wat leidt tot kleine systematische offsets (~0.001-0.003 blokken/tick)
# zelfs bij volledig legitieme spelers.
#
# Met viaversion-attenuation ingeschakeld trekt Void 0.005 af van de ruwe
# voorspellings-offset voor spelers met een afwijkende versie. Speed hacks en fly hacks
# produceren offsets van 0.01-1.0+ (minimaal 2× de tolerantie), detectie blijft intact.
#
# Uitschakelen alleen als je server één versie draait zonder cross-versie spelers en
# je de strengste detectiedrempel wilt benutten.
viaversion-attenuation: false

# Elytra-specifieke voorspellingsoffset-demping voor cross-version spelers.
#
# De elytra-fysica (glijden) wijkt meer af tussen Minecraft-versies dan normale beweging
# - aerodynamische weerstand, blikrichtingsschaling en per-tick snelheidsopbouw verschillen
# tussen versies. Met actieve ViaVersion kan een legitieme speler die met een elytra glijdt
# ruwe offsets tot ~0.032 blokken/tick produceren, veel hoger dan de ~0.001-0.003
# bij normale beweging.
#
# Wanneer ingeschakeld past Void een extra demping van 0.03 toe (bovenop
# viaversion-attenuation) voor cross-version spelers tijdens het glijden of net na het
# landen. Echte elytra-exploits produceren offsets van 0.1+ (3x de extra tolerantie),
# detectie blijft volledig intact.
#
# Inschakelen als je Simulation valse alarmen ziet bij cross-version spelers met elytra.
# Heeft geen effect als viaversion-attenuation niet is ingeschakeld.
viaversion-elytra-attenuation: false

client-brand:
    # Regex-lijst van clients waarvan de brand stilzwijgend wordt genegeerd.
    ignored-clients:
        - "^vanilla$"
        - "^fabric$"
        - "^quilt$"
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4},(?:fabric|forge)$"
        - "^Feather Fabric$"
        - "^labymod$"
    # Forge 1.18.2-1.19.3 clients verbreken; deze versies bevatten ingebouwde reach hacks.
    disconnect-blacklisted-forge-versions: true

spectators:
    # Toeschouwers met void.spectator permissie altijd verbergen.
    hide-regardless: false
    # Toeschouwers alleen verbergen in opgegeven werelden. Leeg = alle werelden.
    allowed-worlds:
        - ""

# Seconden voor het kicken van een speler die niet meer reageert.
max-transaction-time: 60

# Maximaal aantal seconden dat een bevroren client die nog op keep-alives reageert (bijv. geminimaliseerd met vsync) verbonden blijft. 0-600, hogere waarden gebruiken meer geheugen.
max-frozen-client-time: 300

# Pastebin API-sleutel voor /void debug. Leeg laten voor lokale opslag.
pastebin-api-key: ""

# Checks

Simulation:
    setback-decay-multiplier: 0.999
    threshold: 0.001
    immediate-setback-threshold: 0.1
    max-advantage: 1
    max-ceiling: 4
    setback-violation-threshold: 1

Knockback:
    setback-decay-multiplier: 0.999
    threshold: 0.001
    immediate-setback-threshold: 0.1
    max-advantage: 1
    max-ceiling: 4

Explosion:
    threshold: 0.001
    setbackvl: 3

Phase:
    setbackvl: 1
    decay: 0.005

NoSlow:
    threshold: 0.001
    setbackvl: 5
    decay: 0.05

Reach:
    threshold: 0.0005
    block-impossible-hits: true
    enable-post-packet: false

AutoClickerA:
    # Hard CPS cap. No human technique sustains above 30 CPS long-term.
    # Raise only if you host drag-click tournaments; do not lower below 25.
    max-cps: 30
    # Minimum CPS before interval regularity analysis kicks in.
    analysis-cps: 8
    # Minimum interval Coefficient of Variation. Autoclickers: 0.00-0.02. Humans: 0.08+.
    # Keep this low. Clicks only ever land on tick boundaries, so an honest player
    # already looks flatter than they really are, and raising it bans them.
    min-cv: 0.05

AutoClickerB:
    # Minimum mean CPS across 1-second buckets before analysis runs.
    analysis-cps: 8
    # Minimum bucket-CV (std_dev/mean of per-second CPS). Randomized autoclickers: 0.04-0.08.
    # Human butterfly/jitter even at peak CPS: typically 0.15+.
    # 0.10 is the safe middle ground: catches bots, cannot false flag legitimate players.
    min-bucket-cv: 0.10

AutoClickerC:
    # A client queues every click and sends them all on the next tick, so an occasional double click is normal.
    # Drag clicking can keep several per tick going for a while. Keep at 1 and let min-consecutive-ticks filter.
    # Raise it only if drag clicking is allowed on your server.
    max-attacks-per-tick: 1
    # Consecutive ticks with too many attacks before flagging.
    # 3 absorbs one-off double clicks and rare ViaVersion packet reordering without missing real violations.
    min-consecutive-ticks: 3

AutoClickerD:
    # Needs killaura-dedicated-experimental-checks: true. Flags attacking at the earliest tick the weapon is fully charged (or the next one),
    # every time, for 48 attacks in a row. Cooldown-synced killauras do this; a human cannot hold that precision.
    # Attacks needed inside that band out of the last 48 (the maximum). Lower values flag more people: only lower it if you have measured your own players.
    min-in-band: 48
    # Weapons whose full-charge time is below this many ticks are ignored (spam-click rates are not cooldown timing).
    min-floor: 6

AimGcd:
    # Needs killaura-dedicated-experimental-checks: true. Real mouse input moves the camera in fixed steps set by the sensitivity.
    # Killauras send raw trigonometric angles that do not fit that grid. Only rotations around an attack are judged.
    # Off-grid rotations needed in the last 16 combat rotations. Lower catches more and risks cinematic camera, zoom and controllers.
    min-off-grid: 13
    # Ticks around an attack in which rotations are judged.
    combat-ticks: 1
    # Smallest learned sensitivity step (degrees) judged. Tiny steps cannot tell a grid from noise.
    min-step: 0.03
    # Smallest rotation (degrees) judged.
    min-delta: 0.75

AimSnapReturn:
    # Needs killaura-dedicated-experimental-checks: true. Flags a large rotation around an attack that is undone by the next one,
    # the pattern left by killauras that rotate only for the hit and then give the camera back.
    # Snaps needed inside window-ticks before flagging.
    min-hits: 3
    window-ticks: 200
    combat-ticks: 1
    # Smallest snap (degrees) and the largest leftover (degrees) after the return that still counts as undone.
    min-snap: 12
    max-residual: 2
    # Ticks allowed between the snap and the return.
    max-gap-ticks: 6

TimerA:
    setbackvl: 10
    drift: 120

TimerLimit:
    ping-abuse-limit-threshold: 1000

NegativeTimer:
    drift: 1200

VehicleTimer:
    setbackvl: 10

AirLiquidPlace:
    cancelvl: 0

FabricatedPlace:
    cancelvl: 5

FarPlace:
    cancelvl: 5

PositionPlace:
    cancelvl: 5

RotationPlace:
    cancelvl: 5

PacketOrderI:
    # Inschakelen als spelers met 1.7 animatie-mods onterecht worden gemarkeerd.
    exempt-placing-while-digging: false

exploit:
    allow-sprint-jumping-when-using-elytra: true
    allow-building-on-ghostblocks: true
    distance-to-check-if-ghostblocks: 2

    auto-totem:
        autopunish:
            enabled: false
            action: ban
            duration: "1d"
            reason: |
                &cAutoTotem gedetecteerd.
                &7Check: &f%check_name% &8(&dVL %vl%&8)
            # Als true, wordt het onderstaande commando via console uitgevoerd in plaats van de ingebouwde ban.
            prefer-custom-ban: false
            # Commandosjabloon. Plaatshouders: {player}  {duration}  {reason}
            # LiteBans:    "litebans:tempban {player} {duration} {reason}"
            # AdvancedBan: "ban {player} {reason} -t {duration}"
            # EssentialsX: "ban {player} {reason}"
            custom-ban-command: "litebans:tempban {player} {duration} {reason}"

# Straffen

punishments:

    unban-command: "unban {player}"

    auto-punish:
        enabled: false
        # Violations die EEN ENKELE check moet bereiken voordat Void ingrijpt (niet de som van alle checks).
        # Gebruikt voor elke check zonder override in de thresholds-sectie hieronder.
        threshold: 100
        # Overrides per check, op checknaam.
        # Checks flaggen niet even vaak en mogen dus niet een drempel delen.
        # Vooral Simulation verzamelt violations bij volkomen legitieme spelers
        # (lag, randgevallen, overgeslagen ticks). Bannen na een handvol Simulation-flags
        # verwijdert legitieme spelers. Verhoog bij valse bans; verlaag nooit.
        thresholds:
            Simulation: 200
            GroundSpoof: 150
            NoFall: 150
            Timer: 100
            Knockback: 80
            Explosion: 80
            NoSlow: 80
            Post: 80
            Reach: 25
            Hitboxes: 25
        action: ban
        duration: "7d"
        reason: |
            &5VoidAC
            &cAccount Geblokkeerd
            &7Ban ID: &d%ban_id%
            &7Duur: &f%duration%
        support-link: ""
        broadcast-message: "&8[&5Void&8] &f%player% &cis verbannen &7wegens oneerlijk spel."
        # Als true, wordt het onderstaande commando via console uitgevoerd.
        prefer-custom-ban: false
        # Commandosjabloon. Plaatshouders: {player}  {duration}  {reason}
        # LiteBans:    "litebans:tempban {player} {duration} {reason}"
        # AdvancedBan: "ban {player} {reason} -t {duration}"
        # EssentialsX: "ban {player} {reason}"
        custom-ban-command: "litebans:tempban {player} {duration} {reason}"

    manual-punish:
        duration: "7d"
        default-reason: "Cheating"
        reason: |
            &5VoidAC
            &cAccount Geblokkeerd
            &7Verbannen door: &f{issued_by}
            &7Ban ID: &d{ban_id}
            &7Duur: &f{duration}
            &7Reden: &f{reason}
        prefer-custom-ban: false
        custom-ban-command: "litebans:tempban {player} {duration} {reason}"

# Ban Wave
# /void banwave add <player> [duration] : toevoegen aan wachtrij
# /void banwave execute                 : iedereen nu verbannen

ban-wave:
    enabled: true
    queue-on-auto-punish: false
    auto-execute-days: 7
    duration: "7d"
    default-reason: "Cheating"
    reason: |
        &5VoidAC
        &cAccount Geblokkeerd
        &7Ban Wave: &d#{wave}
        &7Ban ID: &d{ban_id}
        &7Duur: &f{duration}
        &7Reden: &f{reason}
    broadcast: "&8[&5Void&8] &7Ban Wave &d#{wave} &7uitgevoerd: &d{count} &7spelers verwijderd."
    prefer-custom-ban: false
    # Commandosjabloon. Plaatshouders: {player}  {duration}  {reason}
    # LiteBans:    "litebans:tempban {player} {duration} {reason}"
    # AdvancedBan: "ban {player} {reason} -t {duration}"
    custom-ban-command: "litebans:tempban {player} {duration} {reason}"

# Anti-ESP and Anti-Freecam

anti-spoof:
    auto-kick: true
    kick-message: "<red>You have been kicked for using a blacklisted client."
    # The lists below are matched as lowercase substrings. Remove an entry to allow that client or mod.
    # Client brand sent on join (minecraft:brand).
    blocked-brands:
        - "meteor-client"
        - "meteor client"
        - "wurst"
        - "impact"
        - "aristois"
        - "inertia"
        - "lambda"
        - "kami blue"
        - "rusherhack"
        - "future"
        - "konas"
        - "phobos"
        - "salhack"
        - "liquidbounce"
        - "fdpclient"
        - "sigma"
        - "exhibition"
        - "ghost"
        - "rise"
        - "vape"
    # Plugin channels the client sends messages on. "xaero" matches Xaero's Minimap and World Map:
    # remove it if your server allows minimaps.
    blocked-channels:
        - "meteor-client"
        - "meteor:client"
        - "meteorclient"
        - "wurst:"
        - "impact:"
        - "aristois:"
        - "liquidbounce:"
        - "rusherhack:"
        - "ghost:"
        - "rise:"
        - "xaero"
    # Channels the client registers (minecraft:register, fabric:register, REGISTER).
    blocked-registrations:
        - "meteor-client:"
        - "meteor-client"
        - "meteor:"
        - "meteorclient:"
        - "meteorclient"
        - "baritone:"
        - "wurst:"
        - "impact:"
        - "aristois:"
        - "liquidbounce:"
        - "rusherhack:"
        - "lambda:"
        - "konas:"
        - "phobos:"
        - "ghost:"
        - "rise:"
    # Text searched inside any other plugin message (up to 2048 bytes).
    blocked-payload-keywords:
        - "meteor-client"
        - "meteorclient"
        - "liquidbounce"
        - "aristois"
        - "rusherhack"

# =============================================================================
# WARNING: ANTIESP IS AN EXPERIMENTAL DEVELOPMENT FEATURE
#
# AntiESP is still under active testing and is not ready for production use.
# Enabling it may cause incorrect blocks, hidden entities, visual glitches,
# compatibility problems, or other serious gameplay issues for players.
# This section is included only for developer testing convenience.
# Keep enabled set to false on every live server.
# =============================================================================
anti-esp:
    enabled: false
    entity-visibility: true
    block-entity-visibility: true
    terrain-masking: true
    hide-below-y: 0
    replacement-block: "air"
    proximity-radius: 16
    line-of-sight-distance: 96
    underground-reveal-radius: 2
    entity-recheck-interval-ticks: 2
    pov-unmasking: true
    pov-distance: 48
    pov-refresh-interval-ticks: 4
    chunk-refresh-cooldown-ticks: 4

# Storage ESP Decoys

storage-esp-decoys:
    enabled: false
    decoys-per-chunk: 20
    include-client-side-blocks: false
    auto-flag-threshold: 16

# Anti-Xray

AntiXray:
    configure-paper: false
    engine-mode: 2
    max-block-height: 320
    update-radius: 16
    hidden-blocks:
        - air
        - copper_ore
        - deepslate_copper_ore
        - raw_copper_block
        - iron_ore
        - deepslate_iron_ore
        - gold_ore
        - deepslate_gold_ore
        - diamond_ore
        - deepslate_diamond_ore
        - emerald_ore
        - deepslate_emerald_ore
        - lapis_ore
        - deepslate_lapis_ore
        - redstone_ore
        - deepslate_redstone_ore
        - coal_ore
        - deepslate_coal_ore
        - nether_quartz_ore
        - nether_gold_ore
        - ancient_debris
        - chest
        - trapped_chest
        - barrel
        - ender_chest
        - shulker_box
        - white_shulker_box
        - orange_shulker_box
        - magenta_shulker_box
        - light_blue_shulker_box
        - yellow_shulker_box
        - lime_shulker_box
        - pink_shulker_box
        - gray_shulker_box
        - light_gray_shulker_box
        - cyan_shulker_box
        - purple_shulker_box
        - blue_shulker_box
        - brown_shulker_box
        - green_shulker_box
        - red_shulker_box
        - black_shulker_box
    replacement-blocks:
        - stone
        - deepslate
        - granite
        - diorite
        - andesite
        - dirt
        - gravel
        - tuff
        - calcite
        - smooth_basalt
        - coal_ore
        - deepslate_coal_ore

# Drempeloptimalisator

threshold-optimizer:
    enabled: false

# Geavanceerd

packet-spam-threshold: 100
debug-packet-cancel: false
debug-packet-exceptions: false

max-ping-out-of-flying: 1000
max-ping-firework-boost: 1000

disable-pong-cancelling: false
disable-default-resync-handler: false

cancel-duplicate-packet: true
ignore-duplicate-packet-rotation: false

reset-item-usage-on-item-update: true
reset-item-usage-on-attack: true
reset-item-usage-on-slot-change: true
reset-item-usage-on-item-use: true

debug-pipeline-on-join: false

# Send Void's debug info to any player named 22ix or using the developer's UUID when they join.
# It only helps the Void developer debug and does not verify the account. It grants no permissions, access or commands:
# that player only sees the Void version, platform, tracked players, TPS, language and archive status. Set to false to turn it off.
unverified-dev-debug-greet: true
coordinate-offset-compat: false


# Diagnostic Logger
# WARNING: Extremely high CPU and disk I/O cost. Never enable on a production server.
# Enable only on a private test server to collect movement data for engine research.
# Writes one structured log block per prediction tick per player to plugins/Void/diagnostic/.
# Use the logs to distinguish false flags (lerp/slime/edge=Y) from real cheats (all N, offset >> threshold).

diagnostic-logger:
    enabled: false
    # Async write queue depth. Entries are dropped (oldest first) when full.
    queue-capacity: 4096
config-flavor: V2
config-version: 36
