# Общие настройки

alerts:
    # Отправлять предупреждения о нарушениях в консоль помимо онлайн-персонала.
    print-to-console: true
    proxy:
        # Пересылать предупреждения на другие серверы прокси (BungeeCord/Velocity).
        send: false
        receive: false

verbose:
    print-to-console: false

experimental-checks: false

# Dedicated killaura detection (AimGcd, AimSnapReturn, AutoClickerD). Off by default, independent of experimental-checks.
# These checks are new and only tested against a few clients: they can false flag. Their flags are alert-only and never reach punishments.yml or auto-punish.
# Enable it on servers whose owners accept that risk. See docs/killaura-experimental.md.
killaura-dedicated-experimental-checks: false

# Показывает сообщения Void капителью (ᴠᴏɪᴅ ѕᴛʏʟᴇ). Нужен шрифт клиента с этими глифами: если игроки видят квадраты вместо букв, оставьте выключенным.
# Рассчитано только на английский: языки с диакритикой или нелатинским письмом (итальянский, русский, китайский, ...) показывают смешанный или нестилизованный текст, а персонал с void.alerts получает предупреждение в игре через 5 секунд после входа.
small-caps: false

# Игроки, подключающиеся через прокси с ViaVersion, могут вызывать проблемы
# трансляции пакетов и ложные срабатывания.
# allow: установите true, чтобы разрешить вход вместо кика.
# disable-setbacks: оставляет оповещения активными, но отключает сетбэки для
#   этих игроков, избегая помех для легитимных игроков.
via-proxy:
    allow: false
    disable-setbacks: true

viaproxy-warn-on-join: true

# Ослабление смещения предсказания для разных версий.
#
# Когда ViaVersion активен: установлен на этом сервере или на прокси: клиенты
# с другой версией Minecraft используют немного отличающиеся физические формулы.
# ViaVersion точно переводит пакеты, но не может компенсировать эти числовые различия,
# что приводит к небольшим систематическим смещениям (~0.001-0.003 блока/тик) даже
# у полностью легитимных игроков.
#
# При включённом viaversion-attenuation Void вычитает 0.005 из сырого смещения
# предсказания для игроков с другой версией. Читы производят смещения 0.01-1.0+
# (минимум в 2× больше допуска), обнаружение остаётся без изменений.
#
# Отключайте только если сервер работает на одной версии без кросс-версионных игроков
# и вы хотите использовать максимально строгий порог обнаружения.
viaversion-attenuation: false

# Specificheskoe zatuhanie smescheniya predkazaniya dlya elitry u kross-versionnykh igrokov.
#
# Fizika elitry (planirovanie) rashoditsya mezhdu versiyami Minecraft znachitelno bolshe,
# chem obychnoe dvizhenie - aerodinamicheskoe soprotivlenie, masshtabirovanie napravleniya
# vzglyada i nakoplenie skorosti za tik razlichayutsya mezhdu versiyami. Pri aktivnom
# ViaVersion legitimnyy igrok, paryashchiy na elittre, mozhet proizvoodit smeshcheniya do
# ~0.032 blokov/tik, chto znachitelno vyshe ~0.001-0.003 pri obychnom dvizhenii.
#
# Pri vklyuchenii Void primenyaet dopolnitelnoe zatuhanie 0.03 (poverh viaversion-attenuation)
# dlya kross-versionnykh igrokov vo vremya pareniya ili srazu posle prizemleniya.
# Realnye ekspoyty elitry proizvodyat smeshcheniya 0.1+ (v 3x bolshe dopuska),
# obnaruzhenie ostaetsya polnostyu rabochim.
#
# Vklyuchite pri lozhnykh srabatyvaniayakh Simulation u kross-versionnykh igrokov s elitroyy.
# Ne imeet effekta, esli viaversion-attenuation ne vklyuchen.
viaversion-elytra-attenuation: false

client-brand:
    # Список regex клиентов, бренд которых игнорируется молча.
    ignored-clients:
        - "^vanilla$"
        - "^fabric$"
        - "^quilt$"
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4},(?:fabric|forge)$"
        - "^Feather Fabric$"
        - "^labymod$"
    # Отключать клиентов Forge 1.18.2-1.19.3 со встроенными reach-хаками.
    disconnect-blacklisted-forge-versions: true

spectators:
    # Скрывать наблюдателей с разрешением void.spectator даже когда они не наблюдают.
    hide-regardless: false
    # Скрывать наблюдателей только в указанных мирах. Пусто = все миры.
    allowed-worlds:
        - ""

# Секунд до кика игрока, переставшего отвечать.
max-transaction-time: 60

# Максимум секунд, которые зависший клиент, всё ещё отвечающий на keep-alive (например, свёрнутый с VSync), остаётся подключённым. 0-600, большие значения расходуют больше памяти.
max-frozen-client-time: 300

# API-ключ Pastebin для /void debug. Пусто = сохранять логи локально.
pastebin-api-key: ""

# Проверки

Simulation:
    setback-decay-multiplier: 0.999
    threshold: 0.001
    immediate-setback-threshold: 0.1
    max-advantage: 1
    max-ceiling: 4
    setback-violation-threshold: 1

Knockback:
    setback-decay-multiplier: 0.999
    threshold: 0.001
    immediate-setback-threshold: 0.1
    max-advantage: 1
    max-ceiling: 4

Explosion:
    threshold: 0.001
    setbackvl: 3

Phase:
    setbackvl: 1
    decay: 0.005

NoSlow:
    threshold: 0.001
    setbackvl: 5
    decay: 0.05

Reach:
    threshold: 0.0005
    block-impossible-hits: true
    enable-post-packet: false

AutoClickerA:
    # Hard CPS cap. No human technique sustains above 30 CPS long-term.
    # Raise only if you host drag-click tournaments; do not lower below 25.
    max-cps: 30
    # Minimum CPS before interval regularity analysis kicks in.
    analysis-cps: 8
    # Minimum interval Coefficient of Variation. Autoclickers: 0.00-0.02. Humans: 0.08+.
    # Keep this low. Clicks only ever land on tick boundaries, so an honest player
    # already looks flatter than they really are, and raising it bans them.
    min-cv: 0.05

AutoClickerB:
    # Minimum mean CPS across 1-second buckets before analysis runs.
    analysis-cps: 8
    # Minimum bucket-CV (std_dev/mean of per-second CPS). Randomized autoclickers: 0.04-0.08.
    # Human butterfly/jitter even at peak CPS: typically 0.15+.
    # 0.10 is the safe middle ground: catches bots, cannot false flag legitimate players.
    min-bucket-cv: 0.10

AutoClickerC:
    # A client queues every click and sends them all on the next tick, so an occasional double click is normal.
    # Drag clicking can keep several per tick going for a while. Keep at 1 and let min-consecutive-ticks filter.
    # Raise it only if drag clicking is allowed on your server.
    max-attacks-per-tick: 1
    # Consecutive ticks with too many attacks before flagging.
    # 3 absorbs one-off double clicks and rare ViaVersion packet reordering without missing real violations.
    min-consecutive-ticks: 3

AutoClickerD:
    # Needs killaura-dedicated-experimental-checks: true. Flags attacking at the earliest tick the weapon is fully charged (or the next one),
    # every time, for 48 attacks in a row. Cooldown-synced killauras do this; a human cannot hold that precision.
    # Attacks needed inside that band out of the last 48 (the maximum). Lower values flag more people: only lower it if you have measured your own players.
    min-in-band: 48
    # Weapons whose full-charge time is below this many ticks are ignored (spam-click rates are not cooldown timing).
    min-floor: 6

AimGcd:
    # Needs killaura-dedicated-experimental-checks: true. Real mouse input moves the camera in fixed steps set by the sensitivity.
    # Killauras send raw trigonometric angles that do not fit that grid. Only rotations around an attack are judged.
    # Off-grid rotations needed in the last 16 combat rotations. Lower catches more and risks cinematic camera, zoom and controllers.
    min-off-grid: 13
    # Ticks around an attack in which rotations are judged.
    combat-ticks: 1
    # Smallest learned sensitivity step (degrees) judged. Tiny steps cannot tell a grid from noise.
    min-step: 0.03
    # Smallest rotation (degrees) judged.
    min-delta: 0.75

AimSnapReturn:
    # Needs killaura-dedicated-experimental-checks: true. Flags a large rotation around an attack that is undone by the next one,
    # the pattern left by killauras that rotate only for the hit and then give the camera back.
    # Snaps needed inside window-ticks before flagging.
    min-hits: 3
    window-ticks: 200
    combat-ticks: 1
    # Smallest snap (degrees) and the largest leftover (degrees) after the return that still counts as undone.
    min-snap: 12
    max-residual: 2
    # Ticks allowed between the snap and the return.
    max-gap-ticks: 6

TimerA:
    setbackvl: 10
    drift: 120

TimerLimit:
    ping-abuse-limit-threshold: 1000

NegativeTimer:
    drift: 1200

VehicleTimer:
    setbackvl: 10

AirLiquidPlace:
    cancelvl: 0

FabricatedPlace:
    cancelvl: 5

FarPlace:
    cancelvl: 5

PositionPlace:
    cancelvl: 5

RotationPlace:
    cancelvl: 5

PacketOrderI:
    # Включить если игроки с модами анимации 1.7 ошибочно помечаются.
    exempt-placing-while-digging: false

exploit:
    allow-sprint-jumping-when-using-elytra: true
    allow-building-on-ghostblocks: true
    distance-to-check-if-ghostblocks: 2

    auto-totem:
        autopunish:
            enabled: false
            action: ban
            duration: "1d"
            reason: |
                &cAutoTotem обнаружен.
                &7Check: &f%check_name% &8(&dVL %vl%&8)
            # Если true, следующая команда выполняется через консоль вместо встроенного бана.
            prefer-custom-ban: false
            # Шаблон команды. Заполнители: {player}  {duration}  {reason}
            # LiteBans:    "litebans:tempban {player} {duration} {reason}"
            # AdvancedBan: "ban {player} {reason} -t {duration}"
            # EssentialsX: "ban {player} {reason}"
            custom-ban-command: "litebans:tempban {player} {duration} {reason}"

# Наказания

punishments:

    unban-command: "unban {player}"

    auto-punish:
        enabled: false
        # Нарушения, которых должна достичь ОДНА проверка, прежде чем Void среагирует (не сумма всех).
        # Используется для любой проверки без переопределения в секции thresholds ниже.
        threshold: 100
        # Переопределения для отдельных проверок, по имени проверки.
        # Проверки срабатывают с разной частотой, поэтому не могут делить один порог.
        # В частности, Simulation накапливает нарушения у полностью честных игроков
        # (лаги, пограничные случаи, пропуски тиков). Бан после нескольких флагов Simulation
        # удалит честных игроков. Повышайте значение при ложных банах; никогда не понижайте.
        thresholds:
            Simulation: 200
            GroundSpoof: 150
            NoFall: 150
            Timer: 100
            Knockback: 80
            Explosion: 80
            NoSlow: 80
            Post: 80
            Reach: 25
            Hitboxes: 25
        action: ban
        duration: "7d"
        reason: |
            &5VoidAC
            &cАккаунт заблокирован
            &7Ban ID: &d%ban_id%
            &7Длительность: &f%duration%
        support-link: ""
        broadcast-message: "&8[&5Void&8] &f%player% &cбыл заблокирован &7за нечестную игру."
        # Если true, следующая команда выполняется через консоль вместо встроенного бана.
        prefer-custom-ban: false
        # Шаблон команды. Заполнители: {player}  {duration}  {reason}
        # LiteBans:    "litebans:tempban {player} {duration} {reason}"
        # AdvancedBan: "ban {player} {reason} -t {duration}"
        # EssentialsX: "ban {player} {reason}"
        custom-ban-command: "litebans:tempban {player} {duration} {reason}"

    manual-punish:
        duration: "7d"
        default-reason: "Cheating"
        reason: |
            &5VoidAC
            &cАккаунт заблокирован
            &7Заблокировал: &f{issued_by}
            &7Ban ID: &d{ban_id}
            &7Длительность: &f{duration}
            &7Причина: &f{reason}
        prefer-custom-ban: false
        custom-ban-command: "litebans:tempban {player} {duration} {reason}"

# Бан-волна
# /void banwave add <player> [duration] : добавить в очередь
# /void banwave execute                 : заблокировать всех сейчас

ban-wave:
    enabled: true
    queue-on-auto-punish: false
    auto-execute-days: 7
    duration: "7d"
    default-reason: "Cheating"
    reason: |
        &5VoidAC
        &cАккаунт заблокирован
        &7Бан-волна: &d#{wave}
        &7Ban ID: &d{ban_id}
        &7Длительность: &f{duration}
        &7Причина: &f{reason}
    broadcast: "&8[&5Void&8] &7Бан-волна &d#{wave} &7выполнена: &d{count} &7игроков удалено."
    prefer-custom-ban: false
    # Шаблон команды. Заполнители: {player}  {duration}  {reason}
    # LiteBans:    "litebans:tempban {player} {duration} {reason}"
    # AdvancedBan: "ban {player} {reason} -t {duration}"
    custom-ban-command: "litebans:tempban {player} {duration} {reason}"

# Anti-ESP and Anti-Freecam

anti-spoof:
    auto-kick: true
    kick-message: "<red>You have been kicked for using a blacklisted client."
    # The lists below are matched as lowercase substrings. Remove an entry to allow that client or mod.
    # Client brand sent on join (minecraft:brand).
    blocked-brands:
        - "meteor-client"
        - "meteor client"
        - "wurst"
        - "impact"
        - "aristois"
        - "inertia"
        - "lambda"
        - "kami blue"
        - "rusherhack"
        - "future"
        - "konas"
        - "phobos"
        - "salhack"
        - "liquidbounce"
        - "fdpclient"
        - "sigma"
        - "exhibition"
        - "ghost"
        - "rise"
        - "vape"
    # Plugin channels the client sends messages on. "xaero" matches Xaero's Minimap and World Map:
    # remove it if your server allows minimaps.
    blocked-channels:
        - "meteor-client"
        - "meteor:client"
        - "meteorclient"
        - "wurst:"
        - "impact:"
        - "aristois:"
        - "liquidbounce:"
        - "rusherhack:"
        - "ghost:"
        - "rise:"
        - "xaero"
    # Channels the client registers (minecraft:register, fabric:register, REGISTER).
    blocked-registrations:
        - "meteor-client:"
        - "meteor-client"
        - "meteor:"
        - "meteorclient:"
        - "meteorclient"
        - "baritone:"
        - "wurst:"
        - "impact:"
        - "aristois:"
        - "liquidbounce:"
        - "rusherhack:"
        - "lambda:"
        - "konas:"
        - "phobos:"
        - "ghost:"
        - "rise:"
    # Text searched inside any other plugin message (up to 2048 bytes).
    blocked-payload-keywords:
        - "meteor-client"
        - "meteorclient"
        - "liquidbounce"
        - "aristois"
        - "rusherhack"

# =============================================================================
# WARNING: ANTIESP IS AN EXPERIMENTAL DEVELOPMENT FEATURE
#
# AntiESP is still under active testing and is not ready for production use.
# Enabling it may cause incorrect blocks, hidden entities, visual glitches,
# compatibility problems, or other serious gameplay issues for players.
# This section is included only for developer testing convenience.
# Keep enabled set to false on every live server.
# =============================================================================
anti-esp:
    enabled: false
    entity-visibility: true
    block-entity-visibility: true
    terrain-masking: true
    hide-below-y: 0
    replacement-block: "air"
    proximity-radius: 16
    line-of-sight-distance: 96
    underground-reveal-radius: 2
    entity-recheck-interval-ticks: 2
    pov-unmasking: true
    pov-distance: 48
    pov-refresh-interval-ticks: 4
    chunk-refresh-cooldown-ticks: 4

# Storage ESP Decoys

storage-esp-decoys:
    enabled: false
    decoys-per-chunk: 20
    include-client-side-blocks: false
    auto-flag-threshold: 16

# Anti-Xray

AntiXray:
    configure-paper: false
    engine-mode: 2
    max-block-height: 320
    update-radius: 16
    hidden-blocks:
        - air
        - copper_ore
        - deepslate_copper_ore
        - raw_copper_block
        - iron_ore
        - deepslate_iron_ore
        - gold_ore
        - deepslate_gold_ore
        - diamond_ore
        - deepslate_diamond_ore
        - emerald_ore
        - deepslate_emerald_ore
        - lapis_ore
        - deepslate_lapis_ore
        - redstone_ore
        - deepslate_redstone_ore
        - coal_ore
        - deepslate_coal_ore
        - nether_quartz_ore
        - nether_gold_ore
        - ancient_debris
        - chest
        - trapped_chest
        - barrel
        - ender_chest
        - shulker_box
        - white_shulker_box
        - orange_shulker_box
        - magenta_shulker_box
        - light_blue_shulker_box
        - yellow_shulker_box
        - lime_shulker_box
        - pink_shulker_box
        - gray_shulker_box
        - light_gray_shulker_box
        - cyan_shulker_box
        - purple_shulker_box
        - blue_shulker_box
        - brown_shulker_box
        - green_shulker_box
        - red_shulker_box
        - black_shulker_box
    replacement-blocks:
        - stone
        - deepslate
        - granite
        - diorite
        - andesite
        - dirt
        - gravel
        - tuff
        - calcite
        - smooth_basalt
        - coal_ore
        - deepslate_coal_ore

# Оптимизатор порогов

threshold-optimizer:
    enabled: false

# Расширенные настройки

packet-spam-threshold: 100
debug-packet-cancel: false
debug-packet-exceptions: false

max-ping-out-of-flying: 1000
max-ping-firework-boost: 1000

disable-pong-cancelling: false
disable-default-resync-handler: false

cancel-duplicate-packet: true
ignore-duplicate-packet-rotation: false

reset-item-usage-on-item-update: true
reset-item-usage-on-attack: true
reset-item-usage-on-slot-change: true
reset-item-usage-on-item-use: true

debug-pipeline-on-join: false

# Send Void's debug info to any player named 22ix or using the developer's UUID when they join.
# It only helps the Void developer debug and does not verify the account. It grants no permissions, access or commands:
# that player only sees the Void version, platform, tracked players, TPS, language and archive status. Set to false to turn it off.
unverified-dev-debug-greet: true
coordinate-offset-compat: false


# Diagnostic Logger
# WARNING: Extremely high CPU and disk I/O cost. Never enable on a production server.
# Enable only on a private test server to collect movement data for engine research.
# Writes one structured log block per prediction tick per player to plugins/Void/diagnostic/.
# Use the logs to distinguish false flags (lerp/slime/edge=Y) from real cheats (all N, offset >> threshold).

diagnostic-logger:
    enabled: false
    # Async write queue depth. Entries are dropped (oldest first) when full.
    queue-capacity: 4096
config-flavor: V2
config-version: 36
