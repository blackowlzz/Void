    configure-paper: false
    engine-mode: 2
    max-block-height: 320
    update-radius: 16
    hidden-blocks:
        - air
        - copper_ore
        - deepslate_copper_ore
        - raw_copper_block
        - iron_ore
        - deepslate_iron_ore
        - gold_ore
        - deepslate_gold_ore
        - diamond_ore
        - deepslate_diamond_ore
        - emerald_ore
        - deepslate_emerald_ore
        - lapis_ore
        - deepslate_lapis_ore
        - redstone_ore
        - deepslate_redstone_ore
        - coal_ore
        - deepslate_coal_ore
        - nether_quartz_ore
        - nether_gold_ore
        - ancient_debris
        - chest
        - trapped_chest
        - barrel
        - ender_chest
        - shulker_box
        - white_shulker_box
        - orange_shulker_box
        - magenta_shulker_box
        - light_blue_shulker_box
        - yellow_shulker_box
        - lime_shulker_box
        - pink_shulker_box
        - gray_shulker_box
        - light_gray_shulker_box
        - cyan_shulker_box
        - purple_shulker_box
        - blue_shulker_box
        - brown_shulker_box
        - green_shulker_box
        - red_shulker_box
        - black_shulker_box
    replacement-blocks:
        - stone
        - deepslate
        - granite
        - diorite
        - andesite
        - dirt
        - gravel
        - tuff
        - calcite
        - smooth_basalt
        - coal_ore
        - deepslate_coal_ore

# ─── Оптимизатор порогов ─────────────────────────────────────────────────────

threshold-optimizer:
    enabled: false

# ─── Расширенные настройки ────────────────────────────────────────────────────

packet-spam-threshold: 100
debug-packet-cancel: false

max-ping-out-of-flying: 1000
max-ping-firework-boost: 1000

disable-pong-cancelling: false
disable-default-resync-handler: false

cancel-duplicate-packet: true
ignore-duplicate-packet-rotation: false

reset-item-usage-on-item-update: true
reset-item-usage-on-attack: true
reset-item-usage-on-slot-change: true
reset-item-usage-on-item-use: true

debug-pipeline-on-join: false

config-flavor: V2
config-version: 19
