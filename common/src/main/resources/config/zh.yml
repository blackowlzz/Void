# 常规设置

alerts:
    # 除了向在线管理员发送违规警告外，也同时输出至控制台。
    print-to-console: true
    proxy:
        # 将警告转发至代理中的其他服务器 (BungeeCord/Velocity)。
        send: false
        receive: false

verbose:
    print-to-console: false

experimental-checks: false

# 以小型大写字母显示 Void 的消息 (ᴠᴏɪᴅ ѕᴛʏʟᴇ)。需要客户端字体包含这些字形：如果玩家看到方框而不是字母，请保持关闭。
# 仅适用于英语：带重音或非拉丁文字的语言（意大利语、俄语、中文等）会显示混合或未样式化的文本，拥有 void.alerts 权限的管理员会在加入 5 秒后收到游戏内警告。
small-caps: false

# 通过安装了ViaVersion的代理服务器连接的玩家可能导致数据包转换问题，触发误报。
# allow: 设为true以允许进入而非踢出。
# disable-setbacks: 保持警报活跃但对这些玩家禁用setback，避免影响合法玩家。
via-proxy:
    allow: false
    disable-setbacks: true

viaproxy-warn-on-join: true

# 跨版本预测偏移衰减。
#
# 当ViaVersion处于活跃状态（安装在此服务器或代理上），使用不同Minecraft版本的客户端
# 内部使用略有不同的物理公式。ViaVersion忠实地转换数据包，但无法补偿这些数值差异，
# 导致即使是完全合法的玩家也会产生微小但持续的偏移（约0.001-0.003方块/tick）。
#
# 启用viaversion-attenuation后，Void将为版本与服务器不同的玩家的原始预测偏移减去0.005。
# 真正的作弊软件会产生0.01-1.0+的偏移（至少是容差的2倍），因此检测不受影响。
#
# 仅在服务器运行单一版本且没有跨版本玩家，且希望使用最严格检测阈值时才禁用。
viaversion-attenuation: false

# 跨版本玩家的鞘翅专用预测偏移衰减。
#
# 鞘翅（滑翔）物理在Minecraft版本之间的差异比普通移动更为显著:空气阻力、视线方向
# 缩放以及每刻速度累积在版本之间均有所不同。启用ViaVersion时，合法使用鞘翅滑翔的玩家
# 可能产生高达~0.032方块/刻的原始预测偏移，远高于正常移动的~0.001-0.003。
#
# 启用后，Void会在跨版本玩家滑翔或刚落地时额外施加0.03的衰减（在viaversion-attenuation
# 基础上叠加）。真实的鞘翅漏洞会产生0.1以上的偏移（额外容限的3倍），检测完全有效。
#
# 如果在使用鞘翅的跨版本玩家上看到Simulation误报，请启用此选项。
# 若viaversion-attenuation未启用则无效果。
viaversion-elytra-attenuation: false

client-brand:
    # 静默忽略的客户端品牌正则表达式列表（不向OP广播）。
    ignored-clients:
        - "^vanilla$"
        - "^fabric$"
        - "^quilt$"
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4},(?:fabric|forge)$"
        - "^Feather Fabric$"
        - "^labymod$"
    # 断开含有内置 Reach 漏洞的 Forge 1.18.2-1.19.3 客户端。
    disconnect-blacklisted-forge-versions: true

spectators:
    # 始终隐藏拥有 void.spectator 权限的旁观者，即使未主动旁观。
    hide-regardless: false
    # 仅在以下世界中隐藏旁观者，留空则适用于全部世界。
    allowed-worlds:
        - ""

# 玩家停止响应后被踢出前的等待秒数。
max-transaction-time: 60

# 仍在响应 keep-alive 的冻结客户端（例如开启垂直同步时最小化）可保持连接的最长秒数。0-600，数值越大占用内存越多。
max-frozen-client-time: 300

# /void debug 上传用 Pastebin API 密钥。留空则保存至本地。
pastebin-api-key: ""

# 检测项目

Simulation:
    setback-decay-multiplier: 0.999
    threshold: 0.001
    immediate-setback-threshold: 0.1
    max-advantage: 1
    max-ceiling: 4
    setback-violation-threshold: 1

Knockback:
    setback-decay-multiplier: 0.999
    threshold: 0.001
    immediate-setback-threshold: 0.1
    max-advantage: 1
    max-ceiling: 4

Explosion:
    threshold: 0.001
    setbackvl: 3

Phase:
    setbackvl: 1
    decay: 0.005

NoSlow:
    threshold: 0.001
    setbackvl: 5
    decay: 0.05

Reach:
    threshold: 0.0005
    block-impossible-hits: true
    enable-post-packet: false

AutoClickerA:
    # Hard CPS cap. No human technique sustains above 30 CPS long-term.
    # Raise only if you host drag-click tournaments; do not lower below 25.
    max-cps: 30
    # Minimum CPS before interval regularity analysis kicks in.
    analysis-cps: 8
    # Minimum interval Coefficient of Variation. Autoclickers: 0.00-0.02. Humans: 0.08+.
    # Keep this low. Clicks only ever land on tick boundaries, so an honest player
    # already looks flatter than they really are, and raising it bans them.
    min-cv: 0.05

AutoClickerB:
    # Minimum mean CPS across 1-second buckets before analysis runs.
    analysis-cps: 8
    # Minimum bucket-CV (std_dev/mean of per-second CPS). Randomized autoclickers: 0.04-0.08.
    # Human butterfly/jitter even at peak CPS: typically 0.15+.
    # 0.10 is the safe middle ground: catches bots, cannot false flag legitimate players.
    min-bucket-cv: 0.10

AutoClickerC:
    # A client queues every click and sends them all on the next tick, so an occasional double click is normal.
    # Drag clicking can keep several per tick going for a while. Keep at 1 and let min-consecutive-ticks filter.
    # Raise it only if drag clicking is allowed on your server.
    max-attacks-per-tick: 1
    # Consecutive ticks with too many attacks before flagging.
    # 3 absorbs one-off double clicks and rare ViaVersion packet reordering without missing real violations.
    min-consecutive-ticks: 3

TimerA:
    setbackvl: 10
    drift: 120

TimerLimit:
    ping-abuse-limit-threshold: 1000

NegativeTimer:
    drift: 1200

VehicleTimer:
    setbackvl: 10

AirLiquidPlace:
    cancelvl: 0

FabricatedPlace:
    cancelvl: 5

FarPlace:
    cancelvl: 5

PositionPlace:
    cancelvl: 5

RotationPlace:
    cancelvl: 5

PacketOrderI:
    # 若使用 1.7 动画 Mod 的玩家被误检，请启用此项。
    exempt-placing-while-digging: false

exploit:
    allow-sprint-jumping-when-using-elytra: true
    allow-building-on-ghostblocks: true
    distance-to-check-if-ghostblocks: 2

    auto-totem:
        autopunish:
            enabled: false
            action: ban
            duration: "1d"
            reason: |
                &cAutoTotem 已检测到。
                &7Check: &f%check_name% &8(&dVL %vl%&8)
            # 若为 true，以下命令通过控制台执行，替代内置封禁系统。
            prefer-custom-ban: false
            # 命令模板。占位符：{player}  {duration}  {reason}
            # LiteBans:    "litebans:tempban {player} {duration} {reason}"
            # AdvancedBan: "ban {player} {reason} -t {duration}"
            # EssentialsX: "ban {player} {reason}"
            custom-ban-command: "litebans:tempban {player} {duration} {reason}"

# 处罚系统

punishments:

    unban-command: "unban {player}"

    auto-punish:
        enabled: false
        # Void 采取行动前，「单个」检测必须达到的违规数（不是所有检测的总和）。
        # 用于下方 thresholds 部分中没有单独设置的所有检测。
        threshold: 100
        # 按检测名称设置的单独覆盖值。
        # 各检测的触发频率差异很大，因此不能共用同一个阈值。
        # 尤其是 Simulation，在完全正常的玩家身上也会累积违规
        # （延迟、边界情况、跳过的 tick）。仅凭少量 Simulation 标记就封禁
        # 会误封正常玩家。出现误封请调高数值；切勿调低。
        thresholds:
            Simulation: 200
            GroundSpoof: 150
            NoFall: 150
            Timer: 100
            Knockback: 80
            Explosion: 80
            NoSlow: 80
            Post: 80
            Reach: 25
            Hitboxes: 25
        action: ban
        duration: "7d"
        reason: |
            &5VoidAC
            &c账号已封禁
            &7封禁 ID: &d%ban_id%
            &7时长: &f%duration%
        support-link: ""
        broadcast-message: "&8[&5Void&8] &f%player% &c因不公平游戏被封禁。"
        # 若为 true，以下命令通过控制台执行，替代内置封禁系统。
        prefer-custom-ban: false
        # 命令模板。占位符：{player}  {duration}  {reason}
        # LiteBans:    "litebans:tempban {player} {duration} {reason}"
        # AdvancedBan: "ban {player} {reason} -t {duration}"
        # EssentialsX: "ban {player} {reason}"
        custom-ban-command: "litebans:tempban {player} {duration} {reason}"

    manual-punish:
        duration: "7d"
        default-reason: "Cheating"
        reason: |
            &5VoidAC
            &c账号已封禁
            &7封禁者: &f{issued_by}
            &7封禁 ID: &d{ban_id}
            &7时长: &f{duration}
            &7原因: &f{reason}
        prefer-custom-ban: false
        custom-ban-command: "litebans:tempban {player} {duration} {reason}"

# 封禁浪潮
# /void banwave add <player> [duration] : 加入队列
# /void banwave execute                 : 立即封禁所有人

ban-wave:
    enabled: true
    queue-on-auto-punish: false
    auto-execute-days: 7
    duration: "7d"
    default-reason: "Cheating"
    reason: |
        &5VoidAC
        &c账号已封禁
        &7封禁浪潮: &d#{wave}
        &7封禁 ID: &d{ban_id}
        &7时长: &f{duration}
        &7原因: &f{reason}
    broadcast: "&8[&5Void&8] &7封禁浪潮 &d#{wave} &7已执行: &d{count} &7名玩家已被移除。"
    prefer-custom-ban: false
    # 命令模板。占位符：{player}  {duration}  {reason}
    # LiteBans:    "litebans:tempban {player} {duration} {reason}"
    # AdvancedBan: "ban {player} {reason} -t {duration}"
    custom-ban-command: "litebans:tempban {player} {duration} {reason}"

# Anti-ESP and Anti-Freecam

anti-spoof:
    auto-kick: true
    kick-message: "<red>You have been kicked for using a blacklisted client."

# =============================================================================
# WARNING: ANTIESP IS AN EXPERIMENTAL DEVELOPMENT FEATURE
#
# AntiESP is still under active testing and is not ready for production use.
# Enabling it may cause incorrect blocks, hidden entities, visual glitches,
# compatibility problems, or other serious gameplay issues for players.
# This section is included only for developer testing convenience.
# Keep enabled set to false on every live server.
# =============================================================================
anti-esp:
    enabled: false
    entity-visibility: true
    block-entity-visibility: true
    terrain-masking: true
    hide-below-y: 0
    replacement-block: "air"
    proximity-radius: 16
    line-of-sight-distance: 96
    underground-reveal-radius: 2
    entity-recheck-interval-ticks: 2
    pov-unmasking: true
    pov-distance: 48
    pov-refresh-interval-ticks: 4
    chunk-refresh-cooldown-ticks: 4

# Storage ESP Decoys

storage-esp-decoys:
    enabled: false
    decoys-per-chunk: 20
    include-client-side-blocks: false
    auto-flag-threshold: 16

# 反矿透

AntiXray:
    configure-paper: false
    engine-mode: 2
    max-block-height: 320
    update-radius: 16
    hidden-blocks:
        - air
        - copper_ore
        - deepslate_copper_ore
        - raw_copper_block
        - iron_ore
        - deepslate_iron_ore
