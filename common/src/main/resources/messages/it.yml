# === /void history ===
# UI cronologia basata sulle sessioni. Tutte le righe sotto sono pienamente
# configurabili; i placeholder sono documentati per ciascuna chiave. Il testo
# in hover delle righe di sessione e violazione è costruito dal renderer dai
# dati grezzi (verbose, ripartizione check) e non richiede un template: ma
# puoi aggiungere <hover:show_text:'...'> a qualsiasi riga per sovrapporre
# tooltip aggiuntivi.

void-history-load-failure: "%prefix% &c✖ &7<sc>Impossibile caricare l'archivio, controlla la console per gli errori</sc>"
void-history-disabled: "%prefix% &c✖ &7<sc>L'archivio è disabilitato</sc>"
void-history-failed: "%prefix% &c✖ &7<sc>Caricamento dell'archivio fallito:</sc> &f%error%"
void-history-unknown-player: "%prefix% &c✖ &7<sc>Giocatore sconosciuto:</sc> &f%player%"
void-history-no-sessions: "%prefix% &7<sc>Nessuna sessione per</sc> &f%player%"
void-history-session-not-found: "%prefix% &c✖ &7<sc>Sessione</sc> &f%ordinal% &7<sc>non trovata per</sc> &f%player%"

# Lista sessioni: placeholder validi: %prefix% %player% %page% %max_pages%
void-history-header: "%prefix% &5<sc>Sessioni</sc> &8─ &f%player% &8[&d%page%&8/&d%max_pages%&8]"
# Riga di riepilogo singola sessione: placeholder validi:
#   %prefix% %player% %ordinal% %void_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %crashed_marker%
# %crashed_marker% si espande in void-history-crashed-marker per sessioni la
# cui connessione è caduta senza chiusura pulita (crash del server, kill -9,
# RST del canale che non ha attivato UserDisconnectEvent). Stringa vuota per
# sessioni in corso o chiuse correttamente.
void-history-session: "  &8▸ &d#%ordinal% &8│ &f%duration% &8│ &d%violations% &7<sc>flag</sc> &8(&d%unique_checks%&8) &8│ &7%timeago% <sc>fa</sc> &8│ &5%client_version% &8│ &7%server_name%%crashed_marker%"

# Marcatore inline sostituito in %crashed_marker% per sessioni il cui
# closed_at == last_activity (cioè marcate dallo sweep di crash al successivo
# avvio, non dal percorso di disconnessione). Include uno spazio iniziale
# perché il marcatore si legga naturalmente quando presente e scompaia
# pulito quando vuoto.
void-history-crashed-marker: " &8(&c<sc>crash</sc>&8)"

# Dettaglio sessione: placeholder validi:
#   %prefix% %player% %ordinal% %void_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %bucket_size%
void-history-detail-header: "%prefix% &5<sc>Sessione</sc> &d#%ordinal% &8─ &f%player%"
void-history-detail-meta1: "  &8▸ &7<sc>Versione</sc> &f%void_version% &8│ &7<sc>Server</sc> &f%server_name% &8│ &7<sc>Durata</sc> &f%duration% &8│ &7%timeago% <sc>fa</sc>"
void-history-detail-meta2: "  &8▸ &7<sc>Client</sc> &f%client_version% &8│ &7<sc>Brand</sc> &f%client_brand%"
void-history-detail-violations-header: "  &8▸ &d%violations% &7<sc>violazioni</sc> &8(&d%unique_checks% &7<sc>uniche</sc>&8)"
void-history-detail-empty: "  &8▸ &7(<sc>nessuna</sc>)"
# Riga raggruppata (predefinito): placeholder validi: %prefix% %offset% %checks_list%
#   %checks_list% è costruita unendo voci void-history-check-count con ", "
void-history-detail-group: "  &8▸ %checks_list% &8(&5%offset%&8)"
# Riga di violazione singola (--detailed): placeholder validi:
#   %prefix% %offset% %check% %vl% %verbose%
void-history-detail-entry: "  &8▸ &f%check% &8(&5%offset%&8)&7 %verbose%"
# Formato interno per ogni check in %checks_list%: placeholder validi: %check_name% %count%
void-history-check-count: "&f%check_name%&7 x&d%count%"

# Marcatori di schema: vedi il commento di intestazione in config.yml.
config-flavor: V2
verbose-join-reminder: "%prefix% &e⚠ &7<sc>Verbose è</sc> &c<sc>disattivato</sc>&7<sc>: vedi solo i flag effettivi.</sc> &5/void verbose &7<sc>mostra anche i casi vicini alla soglia.</sc>"
config-version: 2
