    - "  &8▸ &7Versión        &f%version%"
    - "  &8▸ &7Marca          &f%brand%"
    - "  &8▸ &7Sensibilidad   &fH %h_sensitivity%% &8│ &fV %v_sensitivity%%"
    - "  &8▸ &7FastMath       &f%fast_math%"
    - ""
help:
    - "  &5/void alerts              &8│ &7Activar/desactivar alertas"
    - "  &5/void verbose             &8│ &7Activar/desactivar verbose"
    - "  &5/void brands              &8│ &7Monitorear marcas de cliente"
    - "  &5/void profile &8<jugador>   &8│ &7Inspeccionar perfil de jugador"
    - "  &5/void debug &8<jugador>     &8│ &7Ver debug trace"
    - "  &5/void spectate &8<jugador>  &8│ &7Espectar a un jugador"
    - "  &5/void history &8<jugador>   &8│ &7Historial de sesiones"
    - "  &5/void log &8[0-255]         &8│ &7Subir log de debug"
    - "  &5/void perf                &8│ &7Ver tiempos de predicción"
    - "  &5/void reload              &8│ &7Recargar configuración"
    - "  &5/void version             &8│ &7Buscar actualizaciones"
    - "  &5/void punish &8<jugador>    &8│ &7Castigar manualmente a un jugador"
    - "  &5/void banwave             &8│ &7Gestionar la ola de bans"
