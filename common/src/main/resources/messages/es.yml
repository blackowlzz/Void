# === /void history ===
# UI de historial basada en sesiones. Todas las líneas siguientes son
# configurables; los placeholders se documentan en cada clave. El texto en
# hover de las líneas de sesión y violación lo construye el renderer a partir
# de los datos brutos (verbose, desglose de checks) y no necesita plantilla;
# pero puedes añadir <hover:show_text:'...'> a cualquier línea para sumar
# tooltips adicionales.

void-history-load-failure: "%prefix% &c✖ &7<sc>No se pudo cargar el historial, revisa la consola en busca de errores</sc>"
void-history-disabled: "%prefix% &c✖ &7<sc>El historial está deshabilitado</sc>"
void-history-failed: "%prefix% &c✖ &7<sc>Error al cargar el historial:</sc> &f%error%"
void-history-unknown-player: "%prefix% &c✖ &7<sc>Jugador desconocido:</sc> &f%player%"
void-history-no-sessions: "%prefix% &7<sc>Sin sesiones para</sc> &f%player%"
void-history-session-not-found: "%prefix% &c✖ &7<sc>Sesión</sc> &f%ordinal% &7<sc>no encontrada para</sc> &f%player%"

# Lista de sesiones: placeholders válidos: %prefix% %player% %page% %max_pages%
void-history-header: "%prefix% &5<sc>Sesiones</sc> &8─ &f%player% &8[&d%page%&8/&d%max_pages%&8]"
# Línea de resumen de una sesión: placeholders válidos:
#   %prefix% %player% %ordinal% %void_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %crashed_marker%
# %crashed_marker% se expande a void-history-crashed-marker para sesiones cuya
# conexión cayó sin cierre limpio (caída del servidor, kill -9, RST de canal
# que no disparó UserDisconnectEvent). Cadena vacía para sesiones en curso o
# cerradas correctamente.
void-history-session: "  &8▸ &d#%ordinal% &8│ &f%duration% &8│ &d%violations% &7<sc>flags</sc> &8(&d%unique_checks%&8) &8│ &7<sc>hace</sc> %timeago% &8│ &5%client_version% &8│ &7%server_name%%crashed_marker%"

# Marcador en línea sustituido en %crashed_marker% para sesiones cuyo
# closed_at == last_activity (es decir, marcadas por el barrido de cierre del
# siguiente arranque, no por la ruta de desconexión). Incluye un espacio
# inicial para que el marcador se lea natural cuando aparece y desaparezca
# limpiamente cuando está vacío.
void-history-crashed-marker: " &8(&c<sc>crash</sc>&8)"

# Detalle de sesión: placeholders válidos:
#   %prefix% %player% %ordinal% %void_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %bucket_size%
void-history-detail-header: "%prefix% &5<sc>Sesión</sc> &d#%ordinal% &8─ &f%player%"
void-history-detail-meta1: "  &8▸ &7<sc>Versión</sc> &f%void_version% &8│ &7<sc>Servidor</sc> &f%server_name% &8│ &7<sc>Duración</sc> &f%duration% &8│ &7<sc>hace</sc> %timeago%"
void-history-detail-meta2: "  &8▸ &7<sc>Cliente</sc> &f%client_version% &8│ &7<sc>Marca</sc> &f%client_brand%"
void-history-detail-violations-header: "  &8▸ &d%violations% &7<sc>violaciones</sc> &8(&d%unique_checks% &7<sc>únicas</sc>&8)"
void-history-detail-empty: "  &8▸ &7(<sc>ninguna</sc>)"
# Fila agrupada (predeterminado): placeholders válidos: %prefix% %offset% %checks_list%
#   %checks_list% se construye uniendo entradas void-history-check-count con ", "
void-history-detail-group: "  &8▸ %checks_list% &8(&5%offset%&8)"
# Fila de violación bruta (--detailed): placeholders válidos:
#   %prefix% %offset% %check% %vl% %verbose%
void-history-detail-entry: "  &8▸ &f%check% &8(&5%offset%&8)&7 %verbose%"
# Formato interno por check dentro de %checks_list%: placeholders válidos: %check_name% %count%
void-history-check-count: "&f%check_name%&7 x&d%count%"

# Marcadores de esquema: ver el comentario de cabecera en config.yml.
config-flavor: V2
verbose-join-reminder: "%prefix% &e⚠ &7<sc>Verbose está</sc> &c<sc>desactivado</sc>&7<sc>, así que solo ves las alertas realmente generadas.</sc> &5/void verbose &7<sc>muestra también los casos cercanos al límite.</sc>"
config-version: 2
