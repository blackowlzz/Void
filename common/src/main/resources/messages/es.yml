verbose-enabled: "%prefix% &a✔ &7<sc>Verbose</sc> &a<sc>activado</sc>"
verbose-disabled: "%prefix% &c✖ &7<sc>Verbose</sc> &c<sc>desactivado</sc>"
brands-enabled: "%prefix% &a✔ &7<sc>Monitoreo de marcas</sc> &a<sc>activado</sc>"
brands-disabled: "%prefix% &c✖ &7<sc>Monitoreo de marcas</sc> &c<sc>desactivado</sc>"
client-brand-format: "%prefix% &f%player% &8▸ &7%brand%"
malformed-packet-format: "%prefix% &c✖ &f%player% &7<sc>envió un paquete ilegible y fue expulsado</sc> &8(&7<sc>posible crasher</sc>&8)"
console-specify-target: "%prefix% &c✖ &7<sc>La consola debe especificar un objetivo</sc>"
reloading: "%prefix% &7<sc>Recargando configuración...</sc>"
reloaded: "%prefix% &a✔ &7<sc>Configuración</sc> &a<sc>recargada</sc>"
reload-failed: "%prefix% &c✖ &7<sc>Recarga de la configuración</sc> &c<sc>fallida</sc>&7<sc>, revisa la consola para más detalles</sc>"
player-not-found: "%prefix% &c✖ &7<sc>No se pudo encontrar a ese jugador</sc>"
player-not-this-server: "%prefix% &c✖ &7<sc>Ese jugador no está en este servidor</sc>"
sender-not-found: "%prefix% &c✖ &7<sc>Los usuarios exentos no pueden usar este comando</sc>"
spectate-return: "<click:run_command:/void stopspectating><hover:show_text:\"/void stopspectating\">%prefix% &7<sc>Haz clic para volver</sc> &8▸ &5/void stopspectating</hover></click>"
cannot-spectate-return: "%prefix% &c✖ &7<sc>Solo puedes hacer esto después de espectar a un jugador</sc>"
cannot-run-on-self: "%prefix% &c✖ &7<sc>No puedes usar este comando en ti mismo</sc>"
upload-log: "%prefix% &a✔ &7<sc>Registro guardado</sc> &8▸ &f%url%"
upload-log-start: "%prefix% &7<sc>Guardando registro...</sc>"
upload-log-not-found: "%prefix% &c✖ &7<sc>No se encontró ningún registro</sc>"
upload-log-upload-failure: "%prefix% &c✖ &7<sc>Error al guardar el registro, revisa la consola para más detalles</sc>"
disconnect:
    timeout: "<lang:disconnect.timeout>"
    closed: "<lang:disconnect.closed>"
    error: "<red>An error occurred whilst processing packets. Please contact the administrators."
    blacklisted-forge: "<red>Your forge version is blacklisted due to inbuilt reach hacks.<newline><gold>Versions affected: 1.18.2-1.19.3<newline><newline><red>Please see https://github.com/MinecraftForge/MinecraftForge/issues/9309."
run-as-player: "%prefix% &c✖ &7<sc>Solo los jugadores pueden usar este comando</sc>"
run-as-player-or-console: "%prefix% &c✖ &7<sc>Solo los jugadores o la consola pueden usar este comando</sc>"
webhook-not-enabled: "%prefix% &c✖ &7<sc>Los webhooks no están activados</sc>"
webhook-test-message: "void signal test"
webhook-test-succeeded: "%prefix% &a✔ &7<sc>Mensaje de prueba del webhook entregado</sc>"
webhook-test-failed: "%prefix% &c✖ &7<sc>La prueba del webhook falló, revisa la consola para más detalles</sc>"

# Placeholders validos:
# %prefix%
# %player%
# %check_name%
# %description%
# %experimental%
# %vl% - violaciones
# %verbose% - información extra de la comprobación como compensaciones. No todas añadirán informacion.
alerts-format: "%prefix% &f%player% &8▸ &5%check_name%%experimental% &8(&d%vl%&8)&7 %verbose%"
alerts-format-proxy: "%prefix% &8[&7%server%&8] &f%player% &8▸ &5%check_name%%experimental% &8(&d%vl%&8)&7 %verbose%"
experimental-symbol: "*"
small-caps-language-warning: "%prefix% &e⚠ &7Las versalitas están activadas pero no se muestran bien en este idioma. Establece &fsmall-caps: false &7en config.yml."

profile:
