# \u00BB é » (>> duplo), ANSI e UTF-8 interpretam isso diferentemente... você pode acabar vendo '?' por conta disso.
prefix: "&8[&5Void&8]"

alerts-enabled: "%prefix% &a✔ &7<sc>Alertas</sc> &a<sc>ativados</sc>"
alerts-disabled: "%prefix% &c✖ &7<sc>Alertas</sc> &c<sc>desativados</sc>"
verbose-enabled: "%prefix% &a✔ &7<sc>Verbose</sc> &a<sc>ativado</sc>"
verbose-disabled: "%prefix% &c✖ &7<sc>Verbose</sc> &c<sc>desativado</sc>"
brands-enabled: "%prefix% &a✔ &7<sc>Rastreamento de marcas</sc> &a<sc>ativado</sc>"
brands-disabled: "%prefix% &c✖ &7<sc>Rastreamento de marcas</sc> &c<sc>desativado</sc>"
client-brand-format: "%prefix% &f%player% &8▸ &7%brand%"
malformed-packet-format: "%prefix% &c✖ &f%player% &7<sc>enviou um pacote ilegível e foi expulso</sc> &8(&7<sc>possível crasher</sc>&8)"
console-specify-target: "%prefix% &c✖ &7<sc>O console deve especificar um alvo</sc>"
reloading: "%prefix% &7<sc>Recarregando a configuração...</sc>"
reloaded: "%prefix% &a✔ &7<sc>Configuração</sc> &a<sc>recarregada</sc>"
reload-failed: "%prefix% &c✖ &7<sc>Recarga da configuração</sc> &c<sc>falhou</sc>&7<sc>, veja o console para mais detalhes</sc>"
player-not-found: "%prefix% &c✖ &7<sc>Não foi possível encontrar esse jogador</sc>"
player-not-this-server: "%prefix% &c✖ &7<sc>Esse jogador não está neste servidor</sc>"
sender-not-found: "%prefix% &c✖ &7<sc>Usuários isentos não podem usar este comando</sc>"
spectate-return: "<click:run_command:/void stopspectating><hover:show_text:\"/void stopspectating\">%prefix% &7<sc>Clique para voltar</sc> &8▸ &5/void stopspectating</hover></click>"
cannot-spectate-return: "%prefix% &c✖ &7<sc>Você só pode fazer isso depois de espectar um jogador</sc>"
cannot-run-on-self: "%prefix% &c✖ &7<sc>Você não pode usar este comando em si mesmo</sc>"
upload-log: "%prefix% &a✔ &7<sc>Registro salvo</sc> &8▸ &f%url%"
upload-log-start: "%prefix% &7<sc>Salvando registro...</sc>"
upload-log-not-found: "%prefix% &c✖ &7<sc>Nenhum registro encontrado</sc>"
upload-log-upload-failure: "%prefix% &c✖ &7<sc>Falha ao salvar o registro, veja o console para mais detalhes</sc>"
disconnect:
    timeout: "<lang:disconnect.timeout>"
    closed: "<lang:disconnect.closed>"
    error: "<red>An error occurred whilst processing packets. Please contact the administrators."
    blacklisted-forge: "<red>Your forge version is blacklisted due to inbuilt reach hacks.<newline><gold>Versions affected: 1.18.2-1.19.3<newline><newline><red>Please see https://github.com/MinecraftForge/MinecraftForge/issues/9309."
run-as-player: "%prefix% &c✖ &7<sc>Apenas jogadores podem usar este comando</sc>"
run-as-player-or-console: "%prefix% &c✖ &7<sc>Apenas jogadores ou o console podem usar este comando</sc>"
webhook-not-enabled: "%prefix% &c✖ &7<sc>Os webhooks não estão ativados</sc>"
webhook-test-message: "void signal test"
webhook-test-succeeded: "%prefix% &a✔ &7<sc>Mensagem de teste do webhook entregue</sc>"
webhook-test-failed: "%prefix% &c✖ &7<sc>O teste do webhook falhou, veja o console para mais detalhes</sc>"

# Placeholders válidos:
# %prefix%
# %player%
# %check_name%
# %experimental%
# %vl% - violações
# %verbose% - Informação extra da verificação, como os desalinhamentos, nem todas as verifiações terão essa informação.
alerts-format: "%prefix% &f%player% &8▸ &5%check_name%%experimental% &8(&d%vl%&8)&7 %verbose%"
alerts-format-proxy: "%prefix% &8[&7%server%&8] &f%player% &8▸ &5%check_name%%experimental% &8(&d%vl%&8)&7 %verbose%"
experimental-symbol: "*"
small-caps-language-warning: "%prefix% &e⚠ &7As versaletes estão ativadas mas não são exibidas corretamente neste idioma. Defina &fsmall-caps: false &7no config.yml."
profile:
    - ""
    - "  %prefix% &5<sc>Perfil</sc> &8─ &f%player%"
    - "  &8▸ &7<sc>Ping</sc> &8│ &f%ping% ms"
    - "  &8▸ &7<sc>Versão</sc> &8│ &f%version%"
    - "  &8▸ &7<sc>Marca</sc> &8│ &f%brand%"
    - "  &8▸ &7<sc>Sensibilidade</sc> &8│ &fH %h_sensitivity%% &8/ &fV %v_sensitivity%%"
    - "  &8▸ &7<sc>FastMath</sc> &8│ &f%fast_math%"
    - ""
help:
    - "  <click:suggest_command:'/void alerts'>&f/void alerts</click> &8· &7<sc>Ativar/desativar alertas</sc>"
    - "  <click:suggest_command:'/void verbose'>&f/void verbose</click> &8· &7<sc>Ativar/desativar verbose</sc>"
    - "  <click:suggest_command:'/void brands'>&f/void brands</click> &8· &7<sc>Monitorar marcas de cliente</sc>"
    - "  <click:suggest_command:'/void profile '>&f/void profile</click> &7<jogador> &8· &7<sc>Inspecionar o perfil de um jogador</sc>"
    - "  <click:suggest_command:'/void debug '>&f/void debug</click> &7<jogador> &8· &7<sc>Ver o debug trace</sc>"
    - "  <click:suggest_command:'/void spectate '>&f/void spectate</click> &7<jogador> &8· &7<sc>Espectar um jogador em silêncio</sc>"
    - "  <click:suggest_command:'/void history '>&f/void history</click> &7<jogador> &8· &7<sc>Navegar pelo histórico de sessões</sc>"
    - "  <click:suggest_command:'/void punish '>&f/void punish</click> &7<jogador> &8· &7<sc>Punir manualmente um jogador</sc>"
    - "  <click:suggest_command:'/void banwave'>&f/void banwave</click> &8· &7<sc>Gerenciar a fila da ban wave</sc>"
    - "  <click:suggest_command:'/void punishments '>&f/void punishments</click> &7<busca> &8· &7<sc>Buscar registros de punições</sc>"
    - "  <click:suggest_command:'/void log '>&f/void log</click> &7[0-255] &8· &7<sc>Enviar o log de debug</sc>"
    - "  <click:suggest_command:'/void perf'>&f/void perf</click> &8· &7<sc>Ver tempos de predição</sc>"
    - "  <click:suggest_command:'/void reload'>&f/void reload</click> &8· &7<sc>Recarregar a configuração</sc>"
    - "  <click:suggest_command:'/void version'>&f/void version</click> &8· &7<sc>Verificar atualizações</sc>"

# === /void history ===
# UI de histórico baseada em sessões. Todas as linhas abaixo são totalmente
# configuráveis; os placeholders estão documentados em cada chave. O texto de
# hover das linhas de sessão e violação é construído pelo renderer a partir
# dos dados brutos (verbose, divisão de checks) e não precisa de template:
# mas você pode adicionar <hover:show_text:'...'> a qualquer linha para
# sobrepor tooltips adicionais.

void-history-load-failure: "%prefix% &c✖ &7<sc>Não foi possível carregar o histórico, verifique o console por erros</sc>"
void-history-disabled: "%prefix% &c✖ &7<sc>O histórico está desativado</sc>"
void-history-failed: "%prefix% &c✖ &7<sc>Falha ao carregar o histórico:</sc> &f%error%"
void-history-unknown-player: "%prefix% &c✖ &7<sc>Jogador desconhecido:</sc> &f%player%"
void-history-no-sessions: "%prefix% &7<sc>Sem sessões para</sc> &f%player%"
void-history-session-not-found: "%prefix% &c✖ &7<sc>Sessão</sc> &f%ordinal% &7<sc>não encontrada para</sc> &f%player%"

# Lista de sessões: placeholders válidos: %prefix% %player% %page% %max_pages%
void-history-header: "%prefix% &5<sc>Sessões</sc> &8─ &f%player% &8[&d%page%&8/&d%max_pages%&8]"
# Linha de resumo de sessão: placeholders válidos:
#   %prefix% %player% %ordinal% %void_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %crashed_marker%
# %crashed_marker% expande para void-history-crashed-marker em sessões cuja
# conexão caiu sem fechamento limpo (queda do servidor, kill -9, RST de canal
# que não disparou UserDisconnectEvent). String vazia para sessões em curso
# ou encerradas normalmente.
void-history-session: "  &8▸ &d#%ordinal% &8│ &f%duration% &8│ &d%violations% &7<sc>flags</sc> &8(&d%unique_checks%&8) &8│ &7%timeago% <sc>atrás</sc> &8│ &5%client_version% &8│ &7%server_name%%crashed_marker%"

# Marcador inline substituído em %crashed_marker% para sessões cujo
# closed_at == last_activity (ou seja, marcadas pelo varrimento de queda no
# próximo arranque, não pelo caminho de desconexão). Inclui um espaço inicial
# para que o marcador leia naturalmente quando presente e desapareça
# limpamente quando vazio.
void-history-crashed-marker: " &8(&c<sc>crash</sc>&8)"

# Detalhe de sessão: placeholders válidos:
#   %prefix% %player% %ordinal% %void_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %bucket_size%
void-history-detail-header: "%prefix% &5<sc>Sessão</sc> &d#%ordinal% &8─ &f%player%"
void-history-detail-meta1: "  &8▸ &7<sc>Versão</sc> &f%void_version% &8│ &7<sc>Servidor</sc> &f%server_name% &8│ &7<sc>Duração</sc> &f%duration% &8│ &7%timeago% <sc>atrás</sc>"
void-history-detail-meta2: "  &8▸ &7<sc>Cliente</sc> &f%client_version% &8│ &7<sc>Marca</sc> &f%client_brand%"
void-history-detail-violations-header: "  &8▸ &d%violations% &7<sc>violações</sc> &8(&d%unique_checks% &7<sc>únicas</sc>&8)"
void-history-detail-empty: "  &8▸ &7(<sc>nenhuma</sc>)"
# Linha agrupada (padrão): placeholders válidos: %prefix% %offset% %checks_list%
#   %checks_list% é construída unindo entradas void-history-check-count com ", "
void-history-detail-group: "  &8▸ %checks_list% &8(&5%offset%&8)"
# Linha de violação bruta (--detailed): placeholders válidos:
#   %prefix% %offset% %check% %vl% %verbose%
void-history-detail-entry: "  &8▸ &f%check% &8(&5%offset%&8)&7 %verbose%"
# Formato interno por check em %checks_list%: placeholders válidos: %check_name% %count%
void-history-check-count: "&f%check_name%&7 x&d%count%"

# Marcadores de esquema: ver o comentário do cabeçalho em config.yml.
config-flavor: V2
verbose-join-reminder: "%prefix% &e⚠ &7<sc>Verbose está</sc> &c<sc>desativado</sc>&7<sc>, então você só vê os alertas realmente disparados.</sc> &5/void verbose &7<sc>também mostra os casos próximos do limite.</sc>"
config-version: 2
