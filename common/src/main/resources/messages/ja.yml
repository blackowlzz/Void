    - "  &5/void profile &8<player>    &8│ &7プレイヤープロファイルを表示"
    - "  &5/void debug &8<player>      &8│ &7デバッグトレースを表示"
    - "  &5/void spectate &8<player>   &8│ &7プレイヤーを観戦"
    - "  &5/void history &8<player>    &8│ &7セッション履歴"
    - "  &5/void log &8[0-255]         &8│ &7デバッグログをアップロード"
    - "  &5/void perf                &8│ &7予測タイミングを表示"
    - "  &5/void reload              &8│ &7設定をリロード"
    - "  &5/void version             &8│ &7アップデートを確認"
