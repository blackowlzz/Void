    - "  &5/void punishments &8<query> &8│ &7処罰記録を検索"

# === /void history ===
# セッション単位の履歴 UI です。下記すべての行は自由に書き換え可能で、
# プレースホルダはキーごとにコメントで説明しています。セッション行と違反行の
# ホバー文は、生データ（verbose、チェック内訳）からレンダラーが自動生成するため
# テンプレートは不要です。任意の行に <hover:show_text:'...'> を追加すると
# ツールチップを重ねて表示できます。

void-history-load-failure: "%prefix% &c履歴サブシステムの読み込みに失敗しました！サーバーコンソールでエラーを確認してください。"
void-history-disabled: "%prefix% &c履歴サブシステムは無効です！"
void-history-failed: "%prefix% &c履歴の読み込みに失敗しました：&7%error%"
void-history-unknown-player: "%prefix% &c不明なプレイヤー：&f%player%"
void-history-no-sessions: "%prefix% &7&f%player% &7のセッション履歴はありません。"
void-history-session-not-found: "%prefix% &c&f%player% &cの第 &f%ordinal% &c回セッションが見つかりません。"

# セッション一覧: 有効なプレースホルダ: %prefix% %player% %page% %max_pages%
void-history-header: "%prefix% &5Sessions &8─ &f%player% &8[&d%page%&8/&d%max_pages%&8]"
# セッション概要行: 有効なプレースホルダ:
#   %prefix% %player% %ordinal% %void_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %crashed_marker%
# サーバークラッシュ・kill -9・UserDisconnectEvent を発火しないチャネル RST など、
# 接続が正常終了せずに失われたセッションでは %crashed_marker% が
# void-history-crashed-marker に展開されます。継続中／正常終了したセッションでは
# 空文字列になります。
void-history-session: "  &8▸ &d#%ordinal% &8│ &f%duration% &8│ &d%violations% &7flags &8(&d%unique_checks%&8) &8│ &7%timeago% ago &8│ &5%client_version% &8│ &7%server_name%%crashed_marker%"

# closed_at == last_activity のセッション（つまり次回起動時のクラッシュ掃引で
# スタンプされ、切断パスを通っていない行）に対して %crashed_marker% に
# 差し込まれるインラインマーカーです。先頭にスペースを含めることで、
# 表示時は自然に読め、空のときはきれいに消えます。
void-history-crashed-marker: " &8(&ccrashed&8)"

# セッション詳細: 有効なプレースホルダ:
#   %prefix% %player% %ordinal% %void_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %bucket_size%
void-history-detail-header: "%prefix% &5Session &d#%ordinal% &8─ &f%player%"
void-history-detail-meta1: "  &8▸ &7Version &f%void_version% &8│ &7Server &f%server_name% &8│ &7Duration &f%duration% &8│ &7%timeago% ago"
void-history-detail-meta2: "  &8▸ &7クライアント &f%client_version% &8│ &7ブランド &f%client_brand%"
void-history-detail-violations-header: "  &8▸ &d%violations% &7違反 &8(&d%unique_checks% &7種類&8)"
void-history-detail-empty: "  &8▸ &7(なし)"
# グループ化された行（デフォルト）: 有効なプレースホルダ: %prefix% %offset% %checks_list%
#   %checks_list% は void-history-check-count の項目を ", " で連結したものです
void-history-detail-group: "  &8▸ %checks_list% &8(&5%offset%&8)"
# 単一の生違反行（--detailed）: 有効なプレースホルダ:
#   %prefix% %offset% %check% %vl% %verbose%
void-history-detail-entry: "  &8▸ &f%check% &8(&5%offset%&8)&7 %verbose%"
# %checks_list% の各チェック項目の内部書式: 有効なプレースホルダ: %check_name% %count%
void-history-check-count: "&f%check_name%&7 x&d%count%"

# スキーマ用マーカー: config.yml のヘッダーコメントを参照。
config-flavor: V2
config-version: 2
