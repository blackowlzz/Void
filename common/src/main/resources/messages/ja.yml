# 使用可能なプレースホルダー:
# %prefix%
# %player%
# %check_name%
# %description%
# %experimental%
# %vl% - 違反回数
# %verbose% - チェックからの追加情報（全てのチェックが情報を追加するわけではありません）
alerts-format: "%prefix% &f%player% &8▸ &5%check_name%%experimental% &8(&d%vl%&8)&7 %verbose%"
alerts-format-proxy: "%prefix% &8[&7proxy&8] &f%player% &8▸ &5%check_name%%experimental% &8(&d%vl%&8)&7 %verbose%"
experimental-symbol: "*"

profile:
    - ""
    - "  %prefix% &5プロファイル &8─ &f%player%"
    - "  &8▸ &7Ping       &f%ping% ms"
    - "  &8▸ &7バージョン &f%version%"
    - "  &8▸ &7ブランド   &f%brand%"
    - "  &8▸ &7感度       &fH %h_sensitivity%% &8│ &fV %v_sensitivity%%"
    - "  &8▸ &7FastMath   &f%fast_math%"
    - ""
help:
