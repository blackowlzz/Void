# Gültige Platzhalter:
# %prefix%
# %player%
# %check_name%
# %description%
# %experimental%
# %vl% - Verstöße
# %verbose% - zusätzliche Informationen von der Prüfung, nicht alle Prüfungen liefern zusätzliche Informationen
alerts-format: "%prefix% &f%player% &8▸ &5%check_name%%experimental% &8(&d%vl%&8)&7 %verbose%"
alerts-format-proxy: "%prefix% &8[&7%server%&8] &f%player% &8▸ &5%check_name%%experimental% &8(&d%vl%&8)&7 %verbose%"
experimental-symbol: "*"
small-caps-language-warning: "%prefix% &e⚠ &7Kapitälchen sind aktiviert, werden in dieser Sprache aber nicht korrekt dargestellt. Setze &fsmall-caps: false &7in der config.yml."

profile:
