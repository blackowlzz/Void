# \u00BB 表示 » (相当于缩小版的 >>), ANSI和UTF-8的显示方式有所不同,有时你甚至可以看到乱码.
prefix: "&8[&5Void&8]"

alerts-enabled: "%prefix% &a✔ &7<sc>警报</sc> &a<sc>已开启</sc>"
alerts-disabled: "%prefix% &c✖ &7<sc>警报</sc> &c<sc>已关闭</sc>"
verbose-enabled: "%prefix% &a✔ &7<sc>详细模式</sc> &a<sc>已开启</sc>"
verbose-disabled: "%prefix% &c✖ &7<sc>详细模式</sc> &c<sc>已关闭</sc>"
brands-enabled: "%prefix% &a✔ &7<sc>品牌追踪</sc> &a<sc>已开启</sc>"
brands-disabled: "%prefix% &c✖ &7<sc>品牌追踪</sc> &c<sc>已关闭</sc>"
client-brand-format: "%prefix% &f%player% &8▸ &7%brand%"
malformed-packet-format: "%prefix% &c✖ &f%player% &7<sc>发送了无法读取的数据包并被踢出</sc> &8(&7<sc>疑似崩服</sc>&8)"
console-specify-target: "%prefix% &c✖ &7<sc>控制台必须指定目标</sc>"
reloading: "%prefix% &7<sc>正在重载配置...</sc>"
reloaded: "%prefix% &a✔ &7<sc>配置</sc> &a<sc>已重载</sc>"
reload-failed: "%prefix% &c✖ &7<sc>配置重载</sc> &c<sc>失败</sc>&7<sc>，详情请查看控制台</sc>"
player-not-found: "%prefix% &c✖ &7<sc>找不到该玩家</sc>"
player-not-this-server: "%prefix% &c✖ &7<sc>该玩家不在此服务器上</sc>"
sender-not-found: "%prefix% &c✖ &7<sc>被豁免的用户无法使用此命令</sc>"
spectate-return: "<click:run_command:/void stopspectating><hover:show_text:\"/void stopspectating\">%prefix% &7<sc>点击返回</sc> &8▸ &5/void stopspectating</hover></click>"
cannot-spectate-return: "%prefix% &c✖ &7<sc>只有在旁观玩家后才能执行此操作</sc>"
cannot-run-on-self: "%prefix% &c✖ &7<sc>你不能对自己使用此命令</sc>"
upload-log: "%prefix% &a✔ &7<sc>日志已保存</sc> &8▸ &f%url%"
upload-log-start: "%prefix% &7<sc>正在保存日志...</sc>"
upload-log-not-found: "%prefix% &c✖ &7<sc>找不到日志</sc>"
upload-log-upload-failure: "%prefix% &c✖ &7<sc>日志保存失败，详情请查看控制台</sc>"
disconnect:
    timeout: "<lang:disconnect.timeout>"
    closed: "<lang:disconnect.closed>"
    error: "<red>An error occurred whilst processing packets. Please contact the administrators."
    blacklisted-forge: "<red>Your forge version is blacklisted due to inbuilt reach hacks.<newline><gold>Versions affected: 1.18.2-1.19.3<newline><newline><red>Please see https://github.com/MinecraftForge/MinecraftForge/issues/9309."
run-as-player: "%prefix% &c✖ &7<sc>只有玩家可以使用此命令</sc>"
run-as-player-or-console: "%prefix% &c✖ &7<sc>只有玩家或控制台可以使用此命令</sc>"
webhook-not-enabled: "%prefix% &c✖ &7<sc>Webhook 未启用</sc>"
webhook-test-message: "void signal test"
webhook-test-succeeded: "%prefix% &a✔ &7<sc>Webhook 测试消息已送达</sc>"
webhook-test-failed: "%prefix% &c✖ &7<sc>Webhook 测试失败，详情请查看控制台</sc>"

# 变量:
# %prefix% - 前缀
# %player% - 玩家
# %check_name% - 检查名字
# %description% - 检查的介绍
# %experimental% - 检查是否是实验性
# %vl% - VL值
# %verbose% - 检查中的额外信息说明，例如偏移量，并非所有检查都会添加信息
alerts-format: "%prefix% &f%player% &8▸ &5%check_name%%experimental% &8(&d%vl%&8)&7 %verbose%"
alerts-format-proxy: "%prefix% &8[&7%server%&8] &f%player% &8▸ &5%check_name%%experimental% &8(&d%vl%&8)&7 %verbose%"
experimental-symbol: "*"
small-caps-language-warning: "%prefix% &e⚠ &7小型大写字母已启用，但在此语言下无法正确显示。请在 config.yml 中设置 &fsmall-caps: false&7。"

profile:
    - ""
    - "  %prefix% &5<sc>档案</sc> &8─ &f%player%"
    - "  &8▸ &7<sc>延迟</sc> &8│ &f%ping% ms"
    - "  &8▸ &7<sc>版本</sc> &8│ &f%version%"
    - "  &8▸ &7<sc>品牌</sc> &8│ &f%brand%"
    - "  &8▸ &7<sc>灵敏度</sc> &8│ &f横 %h_sensitivity%% &8/ &f纵 %v_sensitivity%%"
    - "  &8▸ &7<sc>FastMath</sc> &8│ &f%fast_math%"
    - ""
