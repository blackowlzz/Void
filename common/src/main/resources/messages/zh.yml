# === /void history ===
# 基于会话的历史界面。下方所有行均可自定义；每个键的占位符在注释中说明。
# 会话和违规行的悬停文本由渲染器根据原始数据（verbose、检查统计）自动构建，
# 无需模板: 但你可以在任意行加 <hover:show_text:'...'> 叠加额外提示。

void-history-load-failure: "%prefix% &c✖ &7<sc>无法加载历史，请查看控制台中的错误</sc>"
void-history-disabled: "%prefix% &c✖ &7<sc>历史已禁用</sc>"
void-history-failed: "%prefix% &c✖ &7<sc>历史加载失败:</sc> &f%error%"
void-history-unknown-player: "%prefix% &c✖ &7<sc>未知玩家:</sc> &f%player%"
void-history-no-sessions: "%prefix% &7<sc>没有</sc> &f%player% &7<sc>的会话</sc>"
void-history-session-not-found: "%prefix% &c✖ &7<sc>未找到</sc> &f%player% &7<sc>的第</sc> &f%ordinal% &7<sc>次会话</sc>"

# 会话列表: 可用占位符: %prefix% %player% %page% %max_pages%
void-history-header: "%prefix% &5<sc>会话</sc> &8─ &f%player% &8[&d%page%&8/&d%max_pages%&8]"
# 单条会话摘要: 可用占位符:
#   %prefix% %player% %ordinal% %void_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %crashed_marker%
# 当会话因服务器崩溃、kill -9 或未触发 UserDisconnectEvent 的连接重置而非正常关闭时，
# %crashed_marker% 会展开为 void-history-crashed-marker；正在进行或正常关闭的会话则为空字符串。
void-history-session: "  &8▸ &d#%ordinal% &8│ &f%duration% &8│ &d%violations% &7<sc>标记</sc> &8(&d%unique_checks%&8) &8│ &7%timeago% <sc>前</sc> &8│ &5%client_version% &8│ &7%server_name%%crashed_marker%"

# 替换到 %crashed_marker% 的内联标记：仅对 closed_at == last_activity 的会话显示
# （即由下次启动的崩溃扫描而非正常断开路径标记的会话）。包含前导空格，
# 这样存在时读起来自然，缺失时也会消失。
void-history-crashed-marker: " &8(&c<sc>崩溃</sc>&8)"

# 会话详情: 可用占位符:
#   %prefix% %player% %ordinal% %void_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %bucket_size%
void-history-detail-header: "%prefix% &5<sc>会话</sc> &d#%ordinal% &8─ &f%player%"
void-history-detail-meta1: "  &8▸ &7<sc>版本</sc> &f%void_version% &8│ &7<sc>服务器</sc> &f%server_name% &8│ &7<sc>时长</sc> &f%duration% &8│ &7%timeago% <sc>前</sc>"
void-history-detail-meta2: "  &8▸ &7<sc>客户端</sc> &f%client_version% &8│ &7<sc>品牌</sc> &f%client_brand%"
void-history-detail-violations-header: "  &8▸ &d%violations% &7<sc>违规</sc> &8(&d%unique_checks% &7<sc>种类</sc>&8)"
void-history-detail-empty: "  &8▸ &7(<sc>无</sc>)"
# 分组行（默认）: 可用占位符: %prefix% %offset% %checks_list%
#   %checks_list% 是用 ", " 拼接 void-history-check-count 项构成的列表
void-history-detail-group: "  &8▸ %checks_list% &8(&5%offset%&8)"
# 单条原始违规行（--detailed）: 可用占位符:
#   %prefix% %offset% %check% %vl% %verbose%
void-history-detail-entry: "  &8▸ &f%check% &8(&5%offset%&8)&7 %verbose%"
# %checks_list% 中每个检查项的内部格式: 可用占位符: %check_name% %count%
void-history-check-count: "&f%check_name%&7 x&d%count%"

# 模式标记: 参见 config.yml 顶部的注释。
config-flavor: V2
verbose-join-reminder: "%prefix% &e⚠ &7<sc>详细模式当前</sc> &c<sc>已关闭</sc>&7<sc>，因此只会显示已触发的警报。</sc> &5/void verbose &7<sc>还会显示接近检测阈值的情况。</sc>"
config-version: 2
