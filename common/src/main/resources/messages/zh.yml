    - "  <click:suggest_command:'/void profile '>&f/void profile</click> &7<玩家> &8· &7<sc>查看玩家档案</sc>"
    - "  <click:suggest_command:'/void debug '>&f/void debug</click> &7<玩家> &8· &7<sc>查看调试跟踪</sc>"
    - "  <click:suggest_command:'/void spectate '>&f/void spectate</click> &7<玩家> &8· &7<sc>悄悄旁观玩家</sc>"
    - "  <click:suggest_command:'/void history '>&f/void history</click> &7<玩家> &8· &7<sc>浏览会话历史</sc>"
    - "  <click:suggest_command:'/void punish '>&f/void punish</click> &7<玩家> &8· &7<sc>手动处罚玩家</sc>"
    - "  <click:suggest_command:'/void banwave'>&f/void banwave</click> &8· &7<sc>管理封禁浪潮队列</sc>"
