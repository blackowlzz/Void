# === /void history ===
# UI d'historique basée sur les sessions. Toutes les lignes ci-dessous sont
# entièrement configurables ; les placeholders sont documentés à chaque clé.
# Le texte au survol des lignes de session et de violation est construit par
# le renderer à partir des données brutes (verbose, ventilation des checks)
# et n'a pas besoin de modèle: mais vous pouvez ajouter
# <hover:show_text:'...'> sur n'importe quelle ligne pour superposer des
# tooltips supplémentaires.

void-history-load-failure: "%prefix% &cLe sous-système d'historique n'a pas pu être chargé ! Vérifiez la console du serveur pour les erreurs."
void-history-disabled: "%prefix% &cLe sous-système d'historique est désactivé !"
void-history-failed: "%prefix% &cÉchec du chargement de l'historique : &7%error%"
void-history-unknown-player: "%prefix% &cJoueur inconnu : &f%player%"
void-history-no-sessions: "%prefix% &7Pas d'historique de sessions pour &f%player%&7."
void-history-session-not-found: "%prefix% &cSession &f%ordinal%&c introuvable pour &f%player%&c."

# Liste des sessions: placeholders valides : %prefix% %player% %page% %max_pages%
void-history-header: "%prefix% &5Sessions &8─ &f%player% &8[&d%page%&8/&d%max_pages%&8]"
# Ligne de résumé d'une session: placeholders valides :
#   %prefix% %player% %ordinal% %void_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %crashed_marker%
# %crashed_marker% s'étend en void-history-crashed-marker pour les sessions
# dont la connexion a disparu sans fermeture propre (crash serveur, kill -9,
# RST de canal sans UserDisconnectEvent). Chaîne vide pour les sessions en
# cours ou closes proprement.
void-history-session: "  &8▸ &d#%ordinal% &8│ &f%duration% &8│ &d%violations% &7flags &8(&d%unique_checks%&8) &8│ &7%timeago% ago &8│ &5%client_version% &8│ &7%server_name%%crashed_marker%"

# Marqueur en ligne substitué dans %crashed_marker% pour les sessions dont
# closed_at == last_activity (c.-à-d. estampillées par le balayage de crash
# au prochain démarrage, et non par le chemin de déconnexion). Inclut un
# espace de tête pour que le marqueur se lise naturellement quand il est
# présent et disparaisse proprement quand il est vide.
void-history-crashed-marker: " &8(&ccrashed&8)"

# Détail de session: placeholders valides :
#   %prefix% %player% %ordinal% %void_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %bucket_size%
void-history-detail-header: "%prefix% &5Session &d#%ordinal% &8─ &f%player%"
void-history-detail-meta1: "  &8▸ &7Version &f%void_version% &8│ &7Server &f%server_name% &8│ &7Duration &f%duration% &8│ &7%timeago% ago"
void-history-detail-meta2: "  &8▸ &7Client &f%client_version% &8│ &7Marque &f%client_brand%"
void-history-detail-violations-header: "  &8▸ &d%violations% &7violations &8(&d%unique_checks% &7uniques&8)"
void-history-detail-empty: "  &8▸ &7(aucune)"
# Ligne groupée (par défaut): placeholders valides : %prefix% %offset% %checks_list%
#   %checks_list% est construite en joignant les entrées void-history-check-count avec ", "
void-history-detail-group: "  &8▸ %checks_list% &8(&5%offset%&8)"
# Ligne de violation brute (--detailed): placeholders valides :
#   %prefix% %offset% %check% %vl% %verbose%
void-history-detail-entry: "  &8▸ &f%check% &8(&5%offset%&8)&7 %verbose%"
# Format interne pour chaque check dans %checks_list%: placeholders valides : %check_name% %count%
void-history-check-count: "&f%check_name%&7 x&d%count%"

# Marqueurs de schéma: voir le commentaire d'en-tête dans config.yml.
config-flavor: V2
config-version: 1
