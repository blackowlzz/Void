    - "  <click:suggest_command:'/void profile '>&f/void profile</click> &7<joueur> &8· &7<sc>Inspecter le profil d'un joueur</sc>"
    - "  <click:suggest_command:'/void debug '>&f/void debug</click> &7<joueur> &8· &7<sc>Voir le debug trace</sc>"
    - "  <click:suggest_command:'/void spectate '>&f/void spectate</click> &7<joueur> &8· &7<sc>Observer un joueur discrètement</sc>"
    - "  <click:suggest_command:'/void history '>&f/void history</click> &7<joueur> &8· &7<sc>Parcourir l'historique des sessions</sc>"
    - "  <click:suggest_command:'/void punish '>&f/void punish</click> &7<joueur> &8· &7<sc>Punir manuellement un joueur</sc>"
    - "  <click:suggest_command:'/void banwave'>&f/void banwave</click> &8· &7<sc>Gérer la file de la vague de bans</sc>"
