    - "  &8▸ &7Version      &f%version%"
    - "  &8▸ &7Marque       &f%brand%"
    - "  &8▸ &7Sensibilité  &fH %h_sensitivity%% &8│ &fV %v_sensitivity%%"
    - "  &8▸ &7FastMath     &f%fast_math%"
    - ""
help:
    - "  &5/void alerts              &8│ &7Activer/désactiver les alertes"
    - "  &5/void verbose             &8│ &7Activer/désactiver le verbose"
    - "  &5/void brands              &8│ &7Surveiller les marques clients"
