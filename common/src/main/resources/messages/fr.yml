# \u00BB se traduit par » (double >>). Les interprétations diffèrent entre les normes ANSI et UTF-8... vous pouvez même voir ? en raison de cela
prefix: "&8[&5Void&8]"

alerts-enabled: "%prefix% &a✔ &7<sc>Alertes</sc> &a<sc>activées</sc>"
alerts-disabled: "%prefix% &c✖ &7<sc>Alertes</sc> &c<sc>désactivées</sc>"
verbose-enabled: "%prefix% &a✔ &7<sc>Verbose</sc> &a<sc>activé</sc>"
verbose-disabled: "%prefix% &c✖ &7<sc>Verbose</sc> &c<sc>désactivé</sc>"
brands-enabled: "%prefix% &a✔ &7<sc>Suivi des marques</sc> &a<sc>activé</sc>"
brands-disabled: "%prefix% &c✖ &7<sc>Suivi des marques</sc> &c<sc>désactivé</sc>"
client-brand-format: "%prefix% &f%player% &8▸ &7%brand%"
malformed-packet-format: "%prefix% &c✖ &f%player% &7<sc>a envoyé un paquet illisible et a été expulsé</sc> &8(&7<sc>crasher possible</sc>&8)"
console-specify-target: "%prefix% &c✖ &7<sc>La console doit spécifier une cible</sc>"
reloading: "%prefix% &7<sc>Rechargement de la configuration...</sc>"
reloaded: "%prefix% &a✔ &7<sc>Configuration</sc> &a<sc>rechargée</sc>"
reload-failed: "%prefix% &c✖ &7<sc>Rechargement de la configuration</sc> &c<sc>échoué</sc>&7<sc>, consultez la console pour les détails</sc>"
player-not-found: "%prefix% &c✖ &7<sc>Ce joueur est introuvable</sc>"
player-not-this-server: "%prefix% &c✖ &7<sc>Ce joueur n'est pas sur ce serveur</sc>"
sender-not-found: "%prefix% &c✖ &7<sc>Les utilisateurs exemptés ne peuvent pas utiliser cette commande</sc>"
spectate-return: "<click:run_command:/void stopspectating><hover:show_text:\"/void stopspectating\">%prefix% &7<sc>Cliquez pour revenir</sc> &8▸ &5/void stopspectating</hover></click>"
cannot-spectate-return: "%prefix% &c✖ &7<sc>Vous ne pouvez le faire qu'après avoir observé un joueur</sc>"
cannot-run-on-self: "%prefix% &c✖ &7<sc>Vous ne pouvez pas utiliser cette commande sur vous-même</sc>"
upload-log: "%prefix% &a✔ &7<sc>Journal enregistré</sc> &8▸ &f%url%"
upload-log-start: "%prefix% &7<sc>Enregistrement du journal...</sc>"
upload-log-not-found: "%prefix% &c✖ &7<sc>Aucun journal trouvé</sc>"
upload-log-upload-failure: "%prefix% &c✖ &7<sc>Échec de l'enregistrement du journal, consultez la console pour les détails</sc>"
disconnect:
    timeout: "<lang:disconnect.timeout>"
    closed: "<lang:disconnect.closed>"
    error: "<red>An error occurred whilst processing packets. Please contact the administrators."
    blacklisted-forge: "<red>Your forge version is blacklisted due to inbuilt reach hacks.<newline><gold>Versions affected: 1.18.2-1.19.3<newline><newline><red>Please see https://github.com/MinecraftForge/MinecraftForge/issues/9309."
run-as-player: "%prefix% &c✖ &7<sc>Seuls les joueurs peuvent utiliser cette commande</sc>"
run-as-player-or-console: "%prefix% &c✖ &7<sc>Seuls les joueurs ou la console peuvent utiliser cette commande</sc>"
webhook-not-enabled: "%prefix% &c✖ &7<sc>Les webhooks ne sont pas activés</sc>"
webhook-test-message: "void signal test"
webhook-test-succeeded: "%prefix% &a✔ &7<sc>Message de test du webhook envoyé</sc>"
webhook-test-failed: "%prefix% &c✖ &7<sc>Échec du test du webhook, consultez la console pour les détails</sc>"

# Placeholders valides :
# %prefix%
# %player%
# %check_name%
# %description%
# %experimental%
# %vl% - violations
# %verbose% - Informations supplémentaires sur les vérifivations comme les écarts, toutes les vérifications n'ajoutent pas d'information
alerts-format: "%prefix% &f%player% &8▸ &5%check_name%%experimental% &8(&d%vl%&8)&7 %verbose%"
alerts-format-proxy: "%prefix% &8[&7%server%&8] &f%player% &8▸ &5%check_name%%experimental% &8(&d%vl%&8)&7 %verbose%"
experimental-symbol: "*"
small-caps-language-warning: "%prefix% &e⚠ &7Les petites capitales sont activées mais ne s'affichent pas correctement dans cette langue. Mets &fsmall-caps: false &7dans config.yml."

profile:
