    - "  &5/void debug &8<joueur>      &8│ &7Voir le debug trace"
    - "  &5/void spectate &8<joueur>   &8│ &7Observer un joueur"
    - "  &5/void history &8<joueur>    &8│ &7Historique des sessions"
    - "  &5/void log &8[0-255]         &8│ &7Téléverser le log de debug"
    - "  &5/void perf                &8│ &7Voir les temps de prédiction"
    - "  &5/void reload              &8│ &7Recharger la configuration"
    - "  &5/void version             &8│ &7Vérifier les mises à jour"
