    - "  &5/void verbose             &8│ &7Verbose'u aç/kapat"
    - "  &5/void brands              &8│ &7Marka takibini aç/kapat"
    - "  &5/void profile &8<oyuncu>    &8│ &7Oyuncu profilini görüntüle"
    - "  &5/void debug &8<oyuncu>      &8│ &7Debug trace görüntüle"
