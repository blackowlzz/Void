    - "  &8▸ &7Versiyon    &f%version%"
    - "  &8▸ &7Client      &f%brand%"
    - "  &8▸ &7Hassasiyet  &fY %h_sensitivity%% &8│ &fD %v_sensitivity%%"
    - "  &8▸ &7FastMath    &f%fast_math%"
    - ""
help:
