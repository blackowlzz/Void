# === /void history ===
# Oturum tabanlı geçmiş arayüzü. Aşağıdaki tüm satırlar tamamen yapılandırılabilir;
# placeholder'lar her anahtarda belgelenmiştir. Oturum ve ihlal satırlarındaki
# hover metni, ham verilerden (verbose, kontrol kırılımı) renderer tarafından
# üretilir; bir şablona ihtiyaç yoktur. Yine de herhangi bir satıra
# <hover:show_text:'...'> ekleyerek üzerine ek tooltip katmanı koyabilirsin.

void-history-load-failure: "%prefix% &c✖ &7<sc>Geçmiş yüklenemedi, hatalar için konsola bakın</sc>"
void-history-disabled: "%prefix% &c✖ &7<sc>Geçmiş devre dışı</sc>"
void-history-failed: "%prefix% &c✖ &7<sc>Geçmiş yüklenemedi:</sc> &f%error%"
void-history-unknown-player: "%prefix% &c✖ &7<sc>Bilinmeyen oyuncu:</sc> &f%player%"
void-history-no-sessions: "%prefix% &7&f%player% &7<sc>için oturum yok</sc>"
void-history-session-not-found: "%prefix% &c✖ &7&f%player% &7<sc>için</sc> &f%ordinal% &7<sc>numaralı oturum bulunamadı</sc>"

# Oturum listesi: geçerli placeholder'lar: %prefix% %player% %page% %max_pages%
void-history-header: "%prefix% &5<sc>Oturumlar</sc> &8─ &f%player% &8[&d%page%&8/&d%max_pages%&8]"
# Tek oturum özeti satırı: geçerli placeholder'lar:
#   %prefix% %player% %ordinal% %void_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %crashed_marker%
# Bağlantısı düzgün kapanmadan kopan oturumlar (sunucu çökmesi, kill -9,
# UserDisconnectEvent tetiklemeyen channel RST gibi) için %crashed_marker%
# void-history-crashed-marker olarak genişler. Devam eden veya düzgün
# kapatılmış oturumlarda boş string olur.
void-history-session: "  &8▸ &d#%ordinal% &8│ &f%duration% &8│ &d%violations% &7<sc>flag</sc> &8(&d%unique_checks%&8) &8│ &7%timeago% <sc>önce</sc> &8│ &5%client_version% &8│ &7%server_name%%crashed_marker%"

# closed_at == last_activity olan oturumlar (yani disconnect yolu yerine bir
# sonraki başlatmanın crash-sweep'i tarafından damgalananlar) için
# %crashed_marker%'a yerleştirilen satır içi işaret. Var olduğunda doğal
# okunsun, yokken temiz kaybolsun diye başında bir boşluk içerir.
void-history-crashed-marker: " &8(&c<sc>çökme</sc>&8)"

# Oturum detayı: geçerli placeholder'lar:
#   %prefix% %player% %ordinal% %void_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %bucket_size%
void-history-detail-header: "%prefix% &5<sc>Oturum</sc> &d#%ordinal% &8─ &f%player%"
void-history-detail-meta1: "  &8▸ &7<sc>Versiyon</sc> &f%void_version% &8│ &7<sc>Sunucu</sc> &f%server_name% &8│ &7<sc>Süre</sc> &f%duration% &8│ &7%timeago% <sc>önce</sc>"
void-history-detail-meta2: "  &8▸ &7<sc>İstemci</sc> &f%client_version% &8│ &7<sc>Marka</sc> &f%client_brand%"
void-history-detail-violations-header: "  &8▸ &d%violations% &7<sc>ihlal</sc> &8(&d%unique_checks% &7<sc>benzersiz</sc>&8)"
void-history-detail-empty: "  &8▸ &7(<sc>yok</sc>)"
# Gruplanmış satır (varsayılan): geçerli placeholder'lar: %prefix% %offset% %checks_list%
#   %checks_list%, void-history-check-count girdileri ", " ile birleştirilerek oluşur
void-history-detail-group: "  &8▸ %checks_list% &8(&5%offset%&8)"
# Tek ham ihlal satırı (--detailed): geçerli placeholder'lar:
#   %prefix% %offset% %check% %vl% %verbose%
void-history-detail-entry: "  &8▸ &f%check% &8(&5%offset%&8)&7 %verbose%"
# %checks_list% içinde her kontrol için iç biçim: geçerli placeholder'lar: %check_name% %count%
void-history-check-count: "&f%check_name%&7 x&d%count%"

# Şema işaretçileri: bkz. config.yml'deki başlık yorumu.
config-flavor: V2
verbose-join-reminder: "%prefix% &e⚠ &7<sc>Verbose</sc> &c<sc>kapalı</sc>&7<sc>, bu yüzden yalnızca tetiklenen uyarıları görüyorsun.</sc> &5/void verbose &7<sc>eşiğe yakın durumları da gösterir.</sc>"
config-version: 2
