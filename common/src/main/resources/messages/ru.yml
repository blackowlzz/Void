# \u00BB это " (двойной >>), ANSI и UTF-8 интерпретируют это по-разному... вы можете даже увидеть "?" из-за этого
prefix: "&8[&5Void&8]"

alerts-enabled: "%prefix% &a✔ &7<sc>Оповещения</sc> &a<sc>включены</sc>"
alerts-disabled: "%prefix% &c✖ &7<sc>Оповещения</sc> &c<sc>отключены</sc>"
verbose-enabled: "%prefix% &a✔ &7<sc>Verbose</sc> &a<sc>включён</sc>"
verbose-disabled: "%prefix% &c✖ &7<sc>Verbose</sc> &c<sc>отключён</sc>"
brands-enabled: "%prefix% &a✔ &7<sc>Отслеживание брендов</sc> &a<sc>включено</sc>"
brands-disabled: "%prefix% &c✖ &7<sc>Отслеживание брендов</sc> &c<sc>отключено</sc>"
client-brand-format: "%prefix% &f%player% &8▸ &7%brand%"
malformed-packet-format: "%prefix% &c✖ &f%player% &7<sc>отправил нечитаемый пакет и был кикнут</sc> &8(&7<sc>возможный крашер</sc>&8)"
console-specify-target: "%prefix% &c✖ &7<sc>Консоль должна указать цель</sc>"
reloading: "%prefix% &7<sc>Перезагрузка конфигурации...</sc>"
reloaded: "%prefix% &a✔ &7<sc>Конфигурация</sc> &a<sc>перезагружена</sc>"
reload-failed: "%prefix% &c✖ &7<sc>Перезагрузка конфигурации</sc> &c<sc>не удалась</sc>&7<sc>, подробности в консоли</sc>"
player-not-found: "%prefix% &c✖ &7<sc>Игрок не найден</sc>"
player-not-this-server: "%prefix% &c✖ &7<sc>Этого игрока нет на этом сервере</sc>"
sender-not-found: "%prefix% &c✖ &7<sc>Исключённые пользователи не могут использовать эту команду</sc>"
spectate-return: "<click:run_command:/void stopspectating><hover:show_text:\"/void stopspectating\">%prefix% &7<sc>Нажмите, чтобы вернуться</sc> &8▸ &5/void stopspectating</hover></click>"
cannot-spectate-return: "%prefix% &c✖ &7<sc>Это можно сделать только после наблюдения за игроком</sc>"
cannot-run-on-self: "%prefix% &c✖ &7<sc>Вы не можете использовать эту команду на себе</sc>"
upload-log: "%prefix% &a✔ &7<sc>Журнал сохранён</sc> &8▸ &f%url%"
upload-log-start: "%prefix% &7<sc>Сохранение журнала...</sc>"
upload-log-not-found: "%prefix% &c✖ &7<sc>Журнал не найден</sc>"
upload-log-upload-failure: "%prefix% &c✖ &7<sc>Не удалось сохранить журнал, подробности в консоли</sc>"
disconnect:
    timeout: "<lang:disconnect.timeout>"
    closed: "<lang:disconnect.closed>"
    error: "<red>An error occurred whilst processing packets. Please contact the administrators."
    blacklisted-forge: "<red>Your forge version is blacklisted due to inbuilt reach hacks.<newline><gold>Versions affected: 1.18.2-1.19.3<newline><newline><red>Please see https://github.com/MinecraftForge/MinecraftForge/issues/9309."
run-as-player: "%prefix% &c✖ &7<sc>Эту команду могут использовать только игроки</sc>"
run-as-player-or-console: "%prefix% &c✖ &7<sc>Эту команду могут использовать только игроки или консоль</sc>"
webhook-not-enabled: "%prefix% &c✖ &7<sc>Вебхуки не включены</sc>"
webhook-test-message: "void signal test"
webhook-test-succeeded: "%prefix% &a✔ &7<sc>Тестовое сообщение вебхука доставлено</sc>"
webhook-test-failed: "%prefix% &c✖ &7<sc>Тест вебхука не удался, подробности в консоли</sc>"

# Допустимые заполнители:
# %prefix%
# %player%
# %check_name%
# %description%
# %experimental%
# %vl% - нарушения
# %verbose% - дополнительная информация от проверки, например, смещения, не все проверки добавляют информацию.
alerts-format: "%prefix% &f%player% &8▸ &5%check_name%%experimental% &8(&d%vl%&8)&7 %verbose%"
alerts-format-proxy: "%prefix% &8[&7%server%&8] &f%player% &8▸ &5%check_name%%experimental% &8(&d%vl%&8)&7 %verbose%"
experimental-symbol: "*"
small-caps-language-warning: "%prefix% &e⚠ &7Капитель включена, но не отображается корректно на этом языке. Укажите &fsmall-caps: false &7в config.yml."

profile:
    - ""
    - "  %prefix% &5<sc>Профиль</sc> &8─ &f%player%"
    - "  &8▸ &7<sc>Пинг</sc> &8│ &f%ping% ms"
    - "  &8▸ &7<sc>Версия</sc> &8│ &f%version%"
    - "  &8▸ &7<sc>Бренд</sc> &8│ &f%brand%"
    - "  &8▸ &7<sc>Чувствительность</sc> &8│ &fГ %h_sensitivity%% &8/ &fВ %v_sensitivity%%"
    - "  &8▸ &7<sc>FastMath</sc> &8│ &f%fast_math%"
    - ""
help:
    - "  <click:suggest_command:'/void alerts'>&f/void alerts</click> &8· &7<sc>Включить/выключить оповещения</sc>"
    - "  <click:suggest_command:'/void verbose'>&f/void verbose</click> &8· &7<sc>Включить/выключить verbose</sc>"
    - "  <click:suggest_command:'/void brands'>&f/void brands</click> &8· &7<sc>Отслеживание брендов клиентов</sc>"
    - "  <click:suggest_command:'/void profile '>&f/void profile</click> &7<игрок> &8· &7<sc>Просмотр профиля игрока</sc>"
    - "  <click:suggest_command:'/void debug '>&f/void debug</click> &7<игрок> &8· &7<sc>Просмотр debug trace</sc>"
    - "  <click:suggest_command:'/void spectate '>&f/void spectate</click> &7<игрок> &8· &7<sc>Тихо наблюдать за игроком</sc>"
    - "  <click:suggest_command:'/void history '>&f/void history</click> &7<игрок> &8· &7<sc>История сессий</sc>"
    - "  <click:suggest_command:'/void punish '>&f/void punish</click> &7<игрок> &8· &7<sc>Вручную наказать игрока</sc>"
    - "  <click:suggest_command:'/void banwave'>&f/void banwave</click> &8· &7<sc>Управление очередью бан-волны</sc>"
    - "  <click:suggest_command:'/void punishments '>&f/void punishments</click> &7<запрос> &8· &7<sc>Поиск записей наказаний</sc>"
    - "  <click:suggest_command:'/void log '>&f/void log</click> &7[0-255] &8· &7<sc>Загрузить debug-лог</sc>"
    - "  <click:suggest_command:'/void perf'>&f/void perf</click> &8· &7<sc>Показать время предсказаний</sc>"
    - "  <click:suggest_command:'/void reload'>&f/void reload</click> &8· &7<sc>Перезагрузить конфигурацию</sc>"
    - "  <click:suggest_command:'/void version'>&f/void version</click> &8· &7<sc>Проверить обновления</sc>"

# === /void history ===
# UI истории на основе сессий. Все строки ниже полностью настраиваются;
# плейсхолдеры задокументированы у каждого ключа. Текст hover для строк
# сессий и нарушений собирает рендерер из сырых данных (verbose, разбивка
# по чекам), шаблон для него не нужен: но в любую строку можно добавить
# <hover:show_text:'...'> и наложить дополнительный тултип.

void-history-load-failure: "%prefix% &c✖ &7<sc>Не удалось загрузить историю, проверьте консоль на наличие ошибок</sc>"
void-history-disabled: "%prefix% &c✖ &7<sc>История отключена</sc>"
void-history-failed: "%prefix% &c✖ &7<sc>Не удалось загрузить историю:</sc> &f%error%"
void-history-unknown-player: "%prefix% &c✖ &7<sc>Неизвестный игрок:</sc> &f%player%"
void-history-no-sessions: "%prefix% &7<sc>Нет сессий для</sc> &f%player%"
void-history-session-not-found: "%prefix% &c✖ &7<sc>Сессия</sc> &f%ordinal% &7<sc>не найдена для</sc> &f%player%"

# Список сессий: допустимые плейсхолдеры: %prefix% %player% %page% %max_pages%
void-history-header: "%prefix% &5<sc>Сессии</sc> &8─ &f%player% &8[&d%page%&8/&d%max_pages%&8]"
# Сводная строка одной сессии: допустимые плейсхолдеры:
#   %prefix% %player% %ordinal% %void_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %crashed_marker%
# %crashed_marker% разворачивается в void-history-crashed-marker для сессий,
# чьё соединение оборвалось без штатного закрытия (краш сервера, kill -9,
# RST канала, не вызвавший UserDisconnectEvent). Для активных или штатно
# закрытых сессий: пустая строка.
void-history-session: "  &8▸ &d#%ordinal% &8│ &f%duration% &8│ &d%violations% &7<sc>флагов</sc> &8(&d%unique_checks%&8) &8│ &7%timeago% <sc>назад</sc> &8│ &5%client_version% &8│ &7%server_name%%crashed_marker%"

# Встроенный маркер, подставляемый в %crashed_marker% для сессий с
# closed_at == last_activity (то есть проставленных при следующем запуске
# crash-sweep'ом, а не путём штатного дисконнекта). Содержит ведущий
# пробел: при наличии маркер читается естественно, при отсутствии чисто
# исчезает.
void-history-crashed-marker: " &8(&c<sc>сбой</sc>&8)"

# Детали сессии: допустимые плейсхолдеры:
#   %prefix% %player% %ordinal% %void_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %bucket_size%
void-history-detail-header: "%prefix% &5<sc>Сессия</sc> &d#%ordinal% &8─ &f%player%"
void-history-detail-meta1: "  &8▸ &7<sc>Версия</sc> &f%void_version% &8│ &7<sc>Сервер</sc> &f%server_name% &8│ &7<sc>Длительность</sc> &f%duration% &8│ &7%timeago% <sc>назад</sc>"
void-history-detail-meta2: "  &8▸ &7<sc>Клиент</sc> &f%client_version% &8│ &7<sc>Бренд</sc> &f%client_brand%"
void-history-detail-violations-header: "  &8▸ &d%violations% &7<sc>нарушений</sc> &8(&d%unique_checks% &7<sc>уникальных</sc>&8)"
void-history-detail-empty: "  &8▸ &7(<sc>нет</sc>)"
# Сгруппированная строка (по умолчанию): допустимые плейсхолдеры: %prefix% %offset% %checks_list%
#   %checks_list% строится склейкой записей void-history-check-count через ", "
void-history-detail-group: "  &8▸ %checks_list% &8(&5%offset%&8)"
# Одиночная строка нарушения (--detailed): допустимые плейсхолдеры:
#   %prefix% %offset% %check% %vl% %verbose%
void-history-detail-entry: "  &8▸ &f%check% &8(&5%offset%&8)&7 %verbose%"
# Внутренний формат каждой записи в %checks_list%: допустимые плейсхолдеры: %check_name% %count%
void-history-check-count: "&f%check_name%&7 x&d%count%"

# Маркеры схемы: см. шапку config.yml.
config-flavor: V2
verbose-join-reminder: "%prefix% &e⚠ &7<sc>Режим verbose</sc> &c<sc>выключен</sc>&7<sc>, поэтому вы видите только сработавшие проверки.</sc> &5/void verbose &7<sc>также показывает случаи, близкие к порогу.</sc>"
config-version: 2
