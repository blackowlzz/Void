# \u00BB is » (double >>), ANSI and UTF-8 interpret this differently... you may even see ? due to this
prefix: "&8[&5Void&8]"

alerts-enabled: "%prefix% &a✔ &7<sc>Alerts</sc> &a<sc>enabled</sc>"
alerts-disabled: "%prefix% &c✖ &7<sc>Alerts</sc> &c<sc>disabled</sc>"
verbose-enabled: "%prefix% &a✔ &7<sc>Verbose</sc> &a<sc>enabled</sc>"
verbose-disabled: "%prefix% &c✖ &7<sc>Verbose</sc> &c<sc>disabled</sc>"
# Sent 5s after join to anyone with void.verbose.enable-on-join, if verbose is off.
# That permission no longer switches verbose on, it only asks for this reminder.
verbose-join-reminder: "%prefix% &e⚠ &7<sc>Verbose is</sc> &c<sc>off</sc>&7<sc>, so you only see flags that actually fired.</sc> &5/void verbose &7<sc>adds the near misses.</sc>"
brands-enabled: "%prefix% &a✔ &7<sc>Brand tracking</sc> &a<sc>enabled</sc>"
brands-disabled: "%prefix% &c✖ &7<sc>Brand tracking</sc> &c<sc>disabled</sc>"
client-brand-format: "%prefix% &f%player% &8▸ &7%brand%"
malformed-packet-format: "%prefix% &c✖ &f%player% &7<sc>sent an unreadable packet and was kicked</sc> &8(&7<sc>possible crasher</sc>&8)"
console-specify-target: "%prefix% &c✖ &7<sc>The console must specify a target</sc>"
reloading: "%prefix% &7<sc>Reloading configuration...</sc>"
reloaded: "%prefix% &a✔ &7<sc>Configuration</sc> &a<sc>reloaded</sc>"
reload-failed: "%prefix% &c✖ &7<sc>Configuration reload</sc> &c<sc>failed</sc>&7<sc>, check the console for details</sc>"
player-not-found: "%prefix% &c✖ &7<sc>That player could not be found</sc>"
player-not-this-server: "%prefix% &c✖ &7<sc>That player is not on this server</sc>"
sender-not-found: "%prefix% &c✖ &7<sc>Exempt users cannot use this command</sc>"
spectate-return: "<click:run_command:/void stopspectating><hover:show_text:\"/void stopspectating\">%prefix% &7<sc>Click to return</sc> &8▸ &5/void stopspectating</hover></click>"
cannot-spectate-return: "%prefix% &c✖ &7<sc>You can only do this after spectating a player</sc>"
cannot-run-on-self: "%prefix% &c✖ &7<sc>You cannot use this command on yourself</sc>"
upload-log: "%prefix% &a✔ &7<sc>Trace saved</sc> &8▸ &f%url%"
upload-log-start: "%prefix% &7<sc>Saving trace...</sc>"
upload-log-not-found: "%prefix% &c✖ &7<sc>No trace found</sc>"
upload-log-upload-failure: "%prefix% &c✖ &7<sc>Trace save failed, check the console for details</sc>"
disconnect:
    timeout: "<lang:disconnect.timeout>"
    closed: "<lang:disconnect.closed>"
    error: "<red>An error occurred whilst processing packets. Please contact the administrators."
    blacklisted-forge: "<red>Your forge version is blacklisted due to inbuilt reach hacks.<newline><gold>Versions affected: 1.18.2-1.19.3<newline><newline><red>Please see https://github.com/MinecraftForge/MinecraftForge/issues/9309."
run-as-player: "%prefix% &c✖ &7<sc>Only players may use this command</sc>"
run-as-player-or-console: "%prefix% &c✖ &7<sc>Only players or the console may use this command</sc>"
webhook-not-enabled: "%prefix% &c✖ &7<sc>Webhooks are not enabled</sc>"
webhook-test-message: "void signal test"
webhook-test-succeeded: "%prefix% &a✔ &7<sc>Webhook test message delivered</sc>"
webhook-test-failed: "%prefix% &c✖ &7<sc>Webhook test failed, check the console for details</sc>"

# Valid placeholders:
# %prefix%
# %player%
# %check_name%
# %description%
# %experimental%
# %vl% - violations
# %verbose% - extra information from the check such as offsets, not all checks will add information
alerts-format: "%prefix% &f%player% &8▸ &5%check_name%%experimental% &8(&d%vl%&8)&7 %verbose%"
alerts-format-proxy: "%prefix% &8[&7%server%&8] &f%player% &8▸ &5%check_name%%experimental% &8(&d%vl%&8)&7 %verbose%"
experimental-symbol: "*"
small-caps-language-warning: "%prefix% &e⚠ &7Small caps is enabled but does not render properly in this language. Set &fsmall-caps: false &7in config.yml."

profile:
    - ""
    - "  %prefix% &5<sc>Profile</sc> &8─ &f%player%"
    - "  &8▸ &7<sc>Ping</sc> &8│ &f%ping% ms"
    - "  &8▸ &7<sc>Version</sc> &8│ &f%version%"
    - "  &8▸ &7<sc>Brand</sc> &8│ &f%brand%"
    - "  &8▸ &7<sc>Sensitivity</sc> &8│ &fH %h_sensitivity%% &8/ &fV %v_sensitivity%%"
    - "  &8▸ &7<sc>FastMath</sc> &8│ &f%fast_math%"
    - ""
help:
    - "  <click:suggest_command:'/void alerts'>&f/void alerts</click> &8· &7<sc>Toggle alert notifications</sc>"
    - "  <click:suggest_command:'/void verbose'>&f/void verbose</click> &8· &7<sc>Toggle verbose mode</sc>"
    - "  <click:suggest_command:'/void brands'>&f/void brands</click> &8· &7<sc>Monitor client brands</sc>"
    - "  <click:suggest_command:'/void profile '>&f/void profile</click> &7<player> &8· &7<sc>Inspect a player's profile</sc>"
    - "  <click:suggest_command:'/void debug '>&f/void debug</click> &7<player> &8· &7<sc>View debug trace</sc>"
    - "  <click:suggest_command:'/void spectate '>&f/void spectate</click> &7<player> &8· &7<sc>Silently spectate a player</sc>"
    - "  <click:suggest_command:'/void history '>&f/void history</click> &7<player> &8· &7<sc>Browse session history</sc>"
    - "  <click:suggest_command:'/void punish '>&f/void punish</click> &7<player> &8· &7<sc>Manually punish a player</sc>"
    - "  <click:suggest_command:'/void banwave'>&f/void banwave</click> &8· &7<sc>Manage the ban wave queue</sc>"
    - "  <click:suggest_command:'/void punishments '>&f/void punishments</click> &7<query> &8· &7<sc>Look up punishment records</sc>"
    - "  <click:suggest_command:'/void log '>&f/void log</click> &7[0-255] &8· &7<sc>Upload debug log</sc>"
    - "  <click:suggest_command:'/void perf'>&f/void perf</click> &8· &7<sc>View prediction timings</sc>"
    - "  <click:suggest_command:'/void reload'>&f/void reload</click> &8· &7<sc>Reload configuration</sc>"
    - "  <click:suggest_command:'/void version'>&f/void version</click> &8· &7<sc>Check for updates</sc>"

# /void history

void-history-load-failure: "%prefix% &c✖ &7<sc>The archive failed to load, check the console for errors</sc>"
void-history-disabled: "%prefix% &c✖ &7<sc>The archive is disabled</sc>"
void-history-failed: "%prefix% &c✖ &7<sc>Failed to load the archive:</sc> &f%error%"
void-history-unknown-player: "%prefix% &c✖ &7<sc>Unknown player:</sc> &f%player%"
void-history-no-sessions: "%prefix% &7<sc>No sessions for</sc> &f%player%"
void-history-session-not-found: "%prefix% &c✖ &7<sc>Session</sc> &f%ordinal% &7<sc>not found for</sc> &f%player%"

# Placeholders: %prefix% %player% %page% %max_pages%
void-history-header: "%prefix% &5<sc>Sessions</sc> &8─ &f%player% &8[&d%page%&8/&d%max_pages%&8]"
# Placeholders: %prefix% %player% %ordinal% %void_version% %server_name% %client_version% %client_brand% %duration% %timeago% %violations% %unique_checks% %crashed_marker%
# %crashed_marker% expands to void-history-crashed-marker on ungraceful disconnects, empty otherwise.
void-history-session: "  &8▸ &d#%ordinal% &8│ &f%duration% &8│ &d%violations% &7<sc>flags</sc> &8(&d%unique_checks%&8) &8│ &7%timeago% <sc>ago</sc> &8│ &5%client_version% &8│ &7%server_name%%crashed_marker%"

# Substituted into %crashed_marker% on sessions that ended without a graceful disconnect.
void-history-crashed-marker: " &8(&c<sc>crashed</sc>&8)"

# Placeholders: %prefix% %player% %ordinal% %void_version% %server_name% %client_version% %client_brand% %duration% %timeago% %violations% %unique_checks% %bucket_size%
void-history-detail-header: "%prefix% &5<sc>Session</sc> &d#%ordinal% &8─ &f%player%"
void-history-detail-meta1: "  &8▸ &7<sc>Version</sc> &f%void_version% &8│ &7<sc>Server</sc> &f%server_name% &8│ &7<sc>Duration</sc> &f%duration% &8│ &7%timeago% <sc>ago</sc>"
void-history-detail-meta2: "  &8▸ &7<sc>Client</sc> &f%client_version% &8│ &7<sc>Brand</sc> &f%client_brand%"
void-history-detail-violations-header: "  &8▸ &d%violations% &7<sc>violations</sc> &8(&d%unique_checks% &7<sc>unique</sc>&8)"
void-history-detail-empty: "  &8▸ &7(<sc>none</sc>)"
# Placeholders: %prefix% %offset% %checks_list%, %checks_list% joins void-history-check-count entries with ", "
void-history-detail-group: "  &8▸ %checks_list% &8(&5%offset%&8)"
# Placeholders: %prefix% %offset% %check% %vl% %verbose%
void-history-detail-entry: "  &8▸ &f%check% &8(&5%offset%&8)&7 %verbose%"
# Placeholders: %check_name% %count%
void-history-check-count: "&f%check_name%&7 x&d%count%"

# Schema markers: see header comment in config.yml.
config-flavor: V2
config-version: 2
