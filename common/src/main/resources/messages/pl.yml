# \u00BB to » (podwójne >>), ANSI i UTF-8 interpretują je inaczej... z tego powodu możesz nawet zobaczyć ?
prefix: "&8[&5Void&8]"

alerts-enabled: "%prefix% &a✔ &7<sc>Alerty</sc> &a<sc>włączone</sc>"
alerts-disabled: "%prefix% &c✖ &7<sc>Alerty</sc> &c<sc>wyłączone</sc>"
verbose-enabled: "%prefix% &a✔ &7<sc>Verbose</sc> &a<sc>włączony</sc>"
verbose-disabled: "%prefix% &c✖ &7<sc>Verbose</sc> &c<sc>wyłączony</sc>"
# Wysyłane 5 s po dołączeniu każdemu z void.verbose.enable-on-join, jeśli verbose jest wyłączony.
# To uprawnienie nie włącza już verbose, tylko wywołuje to przypomnienie.
verbose-join-reminder: "%prefix% &e⚠ &7<sc>Verbose jest</sc> &c<sc>wyłączony</sc>&7<sc>, więc widzisz tylko flagi, które faktycznie się uruchomiły.</sc> &5/void verbose &7<sc>pokazuje też przypadki bliskie progowi.</sc>"
brands-enabled: "%prefix% &a✔ &7<sc>Śledzenie marek</sc> &a<sc>włączone</sc>"
brands-disabled: "%prefix% &c✖ &7<sc>Śledzenie marek</sc> &c<sc>wyłączone</sc>"
client-brand-format: "%prefix% &f%player% &8▸ &7%brand%"
malformed-packet-format: "%prefix% &c✖ &f%player% &7<sc>wysłał nieczytelny pakiet i został wyrzucony</sc> &8(&7<sc>możliwy crasher</sc>&8)"
console-specify-target: "%prefix% &c✖ &7<sc>Konsola musi wskazać cel</sc>"
reloading: "%prefix% &7<sc>Ponowne wczytywanie konfiguracji...</sc>"
reloaded: "%prefix% &a✔ &7<sc>Konfiguracja</sc> &a<sc>wczytana ponownie</sc>"
reload-failed: "%prefix% &c✖ &7<sc>Ponowne wczytanie konfiguracji</sc> &c<sc>nie powiodło się</sc>&7<sc>, szczegóły w konsoli</sc>"
player-not-found: "%prefix% &c✖ &7<sc>Nie znaleziono tego gracza</sc>"
player-not-this-server: "%prefix% &c✖ &7<sc>Tego gracza nie ma na tym serwerze</sc>"
sender-not-found: "%prefix% &c✖ &7<sc>Wyłączeni użytkownicy nie mogą używać tej komendy</sc>"
spectate-return: "<click:run_command:/void stopspectating><hover:show_text:\"/void stopspectating\">%prefix% &7<sc>Kliknij, aby wrócić</sc> &8▸ &5/void stopspectating</hover></click>"
cannot-spectate-return: "%prefix% &c✖ &7<sc>Możesz to zrobić dopiero po obserwowaniu gracza</sc>"
cannot-run-on-self: "%prefix% &c✖ &7<sc>Nie możesz użyć tej komendy na sobie</sc>"
upload-log: "%prefix% &a✔ &7<sc>Log zapisany</sc> &8▸ &f%url%"
upload-log-start: "%prefix% &7<sc>Zapisywanie logu...</sc>"
upload-log-not-found: "%prefix% &c✖ &7<sc>Nie znaleziono logu</sc>"
upload-log-upload-failure: "%prefix% &c✖ &7<sc>Nie udało się zapisać logu, szczegóły w konsoli</sc>"
disconnect:
    timeout: "<lang:disconnect.timeout>"
    closed: "<lang:disconnect.closed>"
    error: "<red>An error occurred whilst processing packets. Please contact the administrators."
    blacklisted-forge: "<red>Your forge version is blacklisted due to inbuilt reach hacks.<newline><gold>Versions affected: 1.18.2-1.19.3<newline><newline><red>Please see https://github.com/MinecraftForge/MinecraftForge/issues/9309."
run-as-player: "%prefix% &c✖ &7<sc>Tej komendy mogą używać tylko gracze</sc>"
run-as-player-or-console: "%prefix% &c✖ &7<sc>Tej komendy mogą używać tylko gracze lub konsola</sc>"
webhook-not-enabled: "%prefix% &c✖ &7<sc>Webhooki nie są włączone</sc>"
webhook-test-message: "void signal test"
webhook-test-succeeded: "%prefix% &a✔ &7<sc>Testowa wiadomość webhooka dostarczona</sc>"
webhook-test-failed: "%prefix% &c✖ &7<sc>Test webhooka nie powiódł się, szczegóły w konsoli</sc>"

# Dostępne placeholdery:
# %prefix%
# %player%
# %check_name%
# %description%
# %experimental%
# %vl% - naruszenia
# %verbose% - dodatkowe informacje z checka, takie jak przesunięcia, nie każdy check je dodaje
alerts-format: "%prefix% &f%player% &8▸ &5%check_name%%experimental% &8(&d%vl%&8)&7 %verbose%"
alerts-format-proxy: "%prefix% &8[&7%server%&8] &f%player% &8▸ &5%check_name%%experimental% &8(&d%vl%&8)&7 %verbose%"
experimental-symbol: "*"
small-caps-language-warning: "%prefix% &e⚠ &7Kapitaliki są włączone, ale nie wyświetlają się poprawnie w tym języku. Ustaw &fsmall-caps: false &7w config.yml."

profile:
    - ""
    - "  %prefix% &5<sc>Profil</sc> &8─ &f%player%"
    - "  &8▸ &7<sc>Ping</sc> &8│ &f%ping% ms"
    - "  &8▸ &7<sc>Wersja</sc> &8│ &f%version%"
    - "  &8▸ &7<sc>Marka</sc> &8│ &f%brand%"
    - "  &8▸ &7<sc>Czułość</sc> &8│ &fPoz %h_sensitivity%% &8/ &fPion %v_sensitivity%%"
    - "  &8▸ &7<sc>FastMath</sc> &8│ &f%fast_math%"
    - ""
help:
    - "  <click:suggest_command:'/void alerts'>&f/void alerts</click> &8· &7<sc>Włącz/wyłącz powiadomienia o alertach</sc>"
    - "  <click:suggest_command:'/void verbose'>&f/void verbose</click> &8· &7<sc>Włącz/wyłącz tryb verbose</sc>"
    - "  <click:suggest_command:'/void brands'>&f/void brands</click> &8· &7<sc>Monitoruj marki klientów</sc>"
    - "  <click:suggest_command:'/void profile '>&f/void profile</click> &7<gracz> &8· &7<sc>Pokaż profil gracza</sc>"
    - "  <click:suggest_command:'/void debug '>&f/void debug</click> &7<gracz> &8· &7<sc>Pokaż ślad debugowania</sc>"
    - "  <click:suggest_command:'/void spectate '>&f/void spectate</click> &7<gracz> &8· &7<sc>Obserwuj gracza po cichu</sc>"
    - "  <click:suggest_command:'/void history '>&f/void history</click> &7<gracz> &8· &7<sc>Przeglądaj historię sesji</sc>"
    - "  <click:suggest_command:'/void punish '>&f/void punish</click> &7<gracz> &8· &7<sc>Ręcznie ukaraj gracza</sc>"
    - "  <click:suggest_command:'/void banwave'>&f/void banwave</click> &8· &7<sc>Zarządzaj kolejką fali banów</sc>"
    - "  <click:suggest_command:'/void punishments '>&f/void punishments</click> &7<zapytanie> &8· &7<sc>Wyszukaj zapisy kar</sc>"
    - "  <click:suggest_command:'/void log '>&f/void log</click> &7[0-255] &8· &7<sc>Wyślij log debugowania</sc>"
    - "  <click:suggest_command:'/void perf'>&f/void perf</click> &8· &7<sc>Pokaż czasy predykcji</sc>"
    - "  <click:suggest_command:'/void reload'>&f/void reload</click> &8· &7<sc>Wczytaj ponownie konfigurację</sc>"
    - "  <click:suggest_command:'/void version'>&f/void version</click> &8· &7<sc>Sprawdź aktualizacje</sc>"

# /void history

void-history-load-failure: "%prefix% &c✖ &7<sc>Nie udało się wczytać historii, sprawdź konsolę pod kątem błędów</sc>"
void-history-disabled: "%prefix% &c✖ &7<sc>Historia jest wyłączona</sc>"
void-history-failed: "%prefix% &c✖ &7<sc>Nie udało się wczytać historii:</sc> &f%error%"
void-history-unknown-player: "%prefix% &c✖ &7<sc>Nieznany gracz:</sc> &f%player%"
void-history-no-sessions: "%prefix% &7<sc>Brak sesji dla</sc> &f%player%"
void-history-session-not-found: "%prefix% &c✖ &7<sc>Nie znaleziono sesji</sc> &f%ordinal% &7<sc>dla</sc> &f%player%"

# Placeholdery: %prefix% %player% %page% %max_pages%
void-history-header: "%prefix% &5<sc>Sesje</sc> &8─ &f%player% &8[&d%page%&8/&d%max_pages%&8]"
# Placeholdery: %prefix% %player% %ordinal% %void_version% %server_name% %client_version% %client_brand% %duration% %timeago% %violations% %unique_checks% %crashed_marker%
# %crashed_marker% zamienia się w void-history-crashed-marker przy nieczystych rozłączeniach, w przeciwnym razie jest pusty.
void-history-session: "  &8▸ &d#%ordinal% &8│ &f%duration% &8│ &d%violations% &7<sc>flag</sc> &8(&d%unique_checks%&8) &8│ &7%timeago% <sc>temu</sc> &8│ &5%client_version% &8│ &7%server_name%%crashed_marker%"

# Wstawiane w %crashed_marker% dla sesji zakończonych bez czystego rozłączenia.
void-history-crashed-marker: " &8(&c<sc>awaria</sc>&8)"

# Placeholdery: %prefix% %player% %ordinal% %void_version% %server_name% %client_version% %client_brand% %duration% %timeago% %violations% %unique_checks% %bucket_size%
void-history-detail-header: "%prefix% &5<sc>Sesja</sc> &d#%ordinal% &8─ &f%player%"
void-history-detail-meta1: "  &8▸ &7<sc>Wersja</sc> &f%void_version% &8│ &7<sc>Serwer</sc> &f%server_name% &8│ &7<sc>Czas trwania</sc> &f%duration% &8│ &7%timeago% <sc>temu</sc>"
void-history-detail-meta2: "  &8▸ &7<sc>Klient</sc> &f%client_version% &8│ &7<sc>Marka</sc> &f%client_brand%"
void-history-detail-violations-header: "  &8▸ &d%violations% &7<sc>naruszeń</sc> &8(&d%unique_checks% &7<sc>unikalnych</sc>&8)"
void-history-detail-empty: "  &8▸ &7(<sc>brak</sc>)"
# Placeholdery: %prefix% %offset% %checks_list%, %checks_list% łączy wpisy void-history-check-count przecinkami
void-history-detail-group: "  &8▸ %checks_list% &8(&5%offset%&8)"
# Placeholdery: %prefix% %offset% %check% %vl% %verbose%
void-history-detail-entry: "  &8▸ &f%check% &8(&5%offset%&8)&7 %verbose%"
# Placeholdery: %check_name% %count%
void-history-check-count: "&f%check_name%&7 x&d%count%"

# Znaczniki schematu: zobacz komentarz nagłówkowy w config.yml.
config-flavor: V2
config-version: 2
