# Void datastore routing. Backend settings live in databases/<id>.yml (created on first boot).
# If violations.sqlite exists from an older install it gets migrated automatically.
database:

  # Master toggle. Set false to disable violation history + /void history
  # entirely. Live AC checks keep running; flags just aren't persisted.
  enabled: true

  # Route each category to a backend id. Use "none" to disable a category.
  routing:
    violation: sqlite
    session: sqlite
    player-identity: sqlite
    setting: sqlite
    blob: none

  session:
    # Migration only. Flags within this gap (ms) are grouped into the same session.
    gap-ms: 600000
    scope-per-server: true
    # How often active sessions are refreshed. 0 to disable.
    heartbeat-interval-ms: 30000

  write-path:
    # Must be a power of two. Typical: 4096, 8192, 16384, 32768.
    queue-capacity: 16384
    batch-size: 256
    flush-interval-ms: 1000
    warn-rate-ms: 10000
    shutdown-drain-timeout-ms: 5000
    # Write queue strategy. BLOCKING works for most servers. Options: BLOCKING, YIELDING, BUSY_SPIN.
    wait-strategy: BLOCKING

  retention:
    session:
      enabled: true
      max-age-days: 90
    violation:
      enabled: true
      max-age-days: 365
    player-identity:
      enabled: false
    setting:
      enabled: false
    blob:
      enabled: true
      max-age-days: 30

  migration:
    skip: false
    max-duration-ms: 0        # 0 = no timeout

  name-resolution:
    # Order matters: first non-empty result wins.
    # local-cache reads the PlayerIdentity category.
    # offline-mode-uuid derives UUID.nameUUIDFromBytes (offline servers only).
    chain: [local-cache, offline-mode-uuid]

  history:
    entries-per-page: 15
    group-interval-ms: 30000

  # Label shown in /void history session headers.
  server-name: "VoidAC-default"

# Schema markers: see header comment in config.yml.
config-flavor: V2
config-version: 1
